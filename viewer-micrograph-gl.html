<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GenePool — micrograph (GL)</title>
<style>
  @font-face { font-family: 'OCR A'; src: url('fonts/OCRA.ttf') format('truetype'); font-display: swap; }   /* self-hosted, GPL/free */
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0e13; color: #cfd6e0; font: 13px/1.5 system-ui, sans-serif; }
  header { padding: 8px 14px; background: #11161f; border-bottom: 1px solid #1e2733; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 8px; }
  h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; letter-spacing: .02em; }
  label { display: inline-flex; gap: 6px; align-items: center; user-select: none; font-size: 12px; }
  button { background: #1c2836; color: #cfd6e0; border: 1px solid #2b3a4d; border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  button:hover { background: #24344a; }
  input[type=number] { width: 66px; background: #0b0e13; color: #cfd6e0; border: 1px solid #2b3a4d; border-radius: 6px; padding: 3px 6px; }
  .hud { margin-left: auto; font-variant-numeric: tabular-nums; color: #8fa0b5; }
  .hud b { color: #cfd6e0; font-weight: 600; }
  .params { color: #8fa0b5; }
  #err { color: #ff8f8f; }
  #wrap { display: flex; justify-content: center; padding: 14px; }
  #stage { position: relative; display: flex; gap: 5px; line-height: 0; }   /* main canvas | species panel */
  #canvasBox { position: relative; line-height: 0; }                        /* holds #cv + the absolute #labMain */
  #cv { border-radius: 12px; box-shadow: 0 6px 30px rgba(0,0,0,.5); cursor: grab; touch-action: none; }
  #cv.drag { cursor: grabbing; }
  #species { width: 256px; height: 768px; overflow-y: auto; scrollbar-gutter: stable; line-height: normal;
    background: #0b0e13; border-radius: 12px; padding: 4px 0; box-sizing: border-box; }   /* scrollable list of ALL species */
  /* NO padding: card + mini fill the row (same width); margin gives the gap+inset. So collapsed & expanded are the
     same width, and the info sits at the SAME (8,8) inset in both -> it lines up when you expand/collapse. */
  #species .srow { position: relative; margin: 6px 8px; cursor: pointer; }
  #species .srow .info { color: #000; font-family: "OCR A", ui-monospace, "SF Mono", Menlo, monospace; line-height: 1.15; }
  /* COLLAPSED = a little viewer card, FULL row width (= the expanded mini): micrograph-ish vignette + rounded corners */
  #species .srow:not(.exp) .info { display: block; padding: 8px; border-radius: 12px;
    background: radial-gradient(120% 200% at 50% 30%, #cfcbc1 0%, #bcb8ad 60%, #8c887e 100%); box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  #species .srow:not(.exp):hover .info { box-shadow: 0 1px 8px rgba(0,0,0,.6); }
  #species .srow .info .plate { margin-top: 0; }
  /* EXPANDED: mini fills the row; info overlays its top-left at the SAME (8,8) inset as the collapsed card */
  #species .srow.exp .info { position: absolute; top: 8px; left: 8px; z-index: 1; }
  #species .srow .miniwrap { width: 100%; aspect-ratio: 1 / 1; }
  #species .srow canvas.mini { display: block; width: 100%; height: 100%; border-radius: 12px; }
  /* species-tile count labels: HTML overlay over the right column (NOT drawn into the canvas, so goldens stay text-free) */
  /* science-lab label: black, no shadow, technical monospace (IBM Plex Mono) -> reads like specimen data */
  .tileLabel { position: absolute; left: 12px; text-align: left; pointer-events: none; line-height: 1.25;
    color: #000; font-family: "OCR A", ui-monospace, "SF Mono", Menlo, monospace; }
  /* .n / .d NOT scoped to .tileLabel -- reused in the #species .info blocks too */
  .crow { display: flex; align-items: center; gap: 7px; }   /* population count + lifespan circles on one row */
  .n { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .circs { display: inline-flex; gap: 3px; }
  .circ { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #35c46a; }   /* lifespan: 0-3 green circles */
  .dbar { width: 90px; height: 7px; margin-top: 3px; background: rgba(128,128,128,.22); border-radius: 2px; overflow: hidden; }  /* diversity gauge: max = plate width */
  .dfill { height: 100%; background: #000; }   /* INVERTED: 0 diversity -> full black bar, 100 diversity -> empty */
  /* license plate as a colour barcode: one cell per character, hue = that character's value (0-9A-Z -> around the wheel).
     NOT scoped to .tileLabel -- the plate is reused bare in the flowed .srow list rows too. */
  .plate { display: inline-flex; gap: 0; margin-top: 3px; }
  .cell { display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    width: 18px; height: 20px; font-size: 13px; font-weight: 600; color: #000; overflow: hidden; }
  .cell .g { display: block; width: 18px; height: 20px;   /* glyph is a pre-centred bitmap (see measurePlateGlyphs) */
    background-repeat: no-repeat; background-position: center; background-size: 18px 20px; }
  #labMain { top: 12px; left: 12px; }   /* total population, top-LEFT of the main view (anchored to #canvasBox) */
  /* debug FPS/hair HUD, top-RIGHT of the main view (DOM overlay -> does not touch the canvas goldens) */
  #fpsHud { position: absolute; top: 12px; right: 12px; z-index: 5; pointer-events: none; font: 11px ui-monospace, "SF Mono", Menlo, monospace;
    color: #7fd0a0; background: #0b0e13cc; padding: 2px 7px; border-radius: 5px; font-variant-numeric: tabular-nums; }
  /* scrub/playback bottom bar (desktop only) */
  #scrubbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; align-items: center; gap: 14px;
    padding: 8px 16px; background: #0d1117f2; border-top: 1px solid #1e2733; backdrop-filter: blur(4px);
    font: 12px system-ui, -apple-system, sans-serif; color: #9fb0c3; }
  #scrubbar label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #scrubbar #sbSlider { flex: 1; min-width: 120px; }
  #scrubbar button { min-width: 36px; cursor: pointer; }
  #scrubbar #sbTime { font-variant-numeric: tabular-nums; min-width: 172px; text-align: right; color: #c7d3e0; }
  #scrubbar #sbSpeeds { display: inline-flex; gap: 4px; }
  /* all 4 the SAME size as a single-triangle button: fixed width + overlapping triangles (negative letter-spacing;
     padding-left compensates the trailing negative space so the glyph cluster stays centred) */
  #scrubbar .sbSpeed { box-sizing: border-box; width: 46px; padding: 4px 0; display: inline-flex; align-items: center;
    justify-content: center; letter-spacing: -0.34em; padding-left: 0.34em; }
  #scrubbar .sbSpeed.active { background: #2e7d5b; border-color: #3aa06f; color: #fff; }
  /* desktop app: the main micrograph FILLS the window (the browser keeps the fixed 768^2 layout -> goldens unchanged) */
  body.desktop { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  body.desktop #wrap { flex: 1; min-height: 0; padding: 8px; }
  body.desktop #stage { flex: 1; min-height: 0; }
  body.desktop #canvasBox { flex: 1; min-width: 0; }
  body.desktop #cv { width: 100%; height: 100%; border-radius: 12px; box-shadow: none; }
  body.desktop #species { height: auto; align-self: stretch; }   /* list keeps its 256px width; fills the height */
  body.desktop #scrubbar { position: static; }                    /* in normal flow at the bottom (not overlaying the fill) */
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>GenePool · micrograph <span style="color:#5c6b80">· WebGL2</span></h1>
    <button id="play">Pause</button>
    <button id="reset">Reset</button>
    <label>Seed <input id="seedIn" type="number" min="0" step="1" value="1"></label>
    <label>Speed <input id="speed" type="range" min="1" max="60" value="3"> <span id="speedv">3×</span></label>
    <!-- desktop-only: real file save/load + SQLite snapshot recording (shown only in the Electron app) -->
    <span id="desktopCtl" hidden><button id="save">Save</button> <button id="load">Load</button>
      <button id="record">● Record</button> <span id="recinfo" class="hud"></span></span>
  </div>
  <div class="row"><span id="err"></span> <span style="color:#5c6b80">scroll = zoom · drag = pan</span></div>
</header>
<div id="wrap"><div id="stage">
  <div id="canvasBox"><canvas id="cv" width="768" height="768"></canvas>
    <div class="tileLabel" id="labMain"></div>
    <div id="fpsHud"></div>
  </div>
  <div id="species"></div>
</div></div>
<footer id="scrubbar" hidden>
  <label>Seed <input id="sbSeed" type="number" min="0" step="1" value="1"></label>
  <span id="sbSpeeds">
    <button class="sbSpeed" data-n="0" title="play 1×">▶</button>
    <button class="sbSpeed" data-n="1" title="fast 2×">▶▶</button>
    <button class="sbSpeed" data-n="2" title="faster 4×">▶▶▶</button>
    <button class="sbSpeed" data-n="3" title="fastest 8×">▶▶▶▶</button>
  </span>
  <input id="sbSlider" type="range" min="0" max="0" value="0" step="1">
  <span id="sbTime">00:00 / 00:00</span>
</footer>

<script type="module">
import { World } from './engine/world.js';
import { Genotype } from './engine/genotype.js';
import { createSpeciesAnalyzer, SIG_ALPHA, SPECIES_ISO } from './engine/analysis/species.mjs';
import { makeStandardWorld } from './engine/pool-seed.mjs';

const NUM_GENES = 256, USED = 112, YOUNG_AGE = 1000, MAX_LIFESPAN = 40000, EGG_SIZE = 5, SPLINE = 0.4;
const cv = document.getElementById('cv');
let CANVAS_W = cv.width, CANVAS_H = cv.height;      // backing-store size; the desktop app resizes these to FILL the window
const VIEW_MAIN = 768, VIEW_SMALL = 256;           // browser main micrograph = 768^2; species tiles = 256^2
const VIEW_ROUND = 12;                              // corner radius (px) — SAME on every view (main + tiles)
let mainW = VIEW_MAIN, mainH = VIEW_MAIN, mainRound = VIEW_ROUND;   // dynamic MAIN view (desktop fills the window); = VIEW_MAIN/round in the browser
let W = cv.width, H = cv.height;                    // ACTIVE view size — renderView sets this per view, then restores
const errEl = document.getElementById('err');

function mulberry32(seed){let a=seed>>>0;return()=>{a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function diskPoint(rng, cx, cy, r){ const rad = 2*Math.PI*rng(); const mag = r*Math.sqrt(rng()); return { x: cx + Math.cos(rad)*mag, y: cy + Math.sin(rad)*mag }; }
const lerp=(a,b,t)=>a+(b-a)*t, mid=(a,b)=>[(a[0]+b[0])*0.5,(a[1]+b[1])*0.5];
const lerp3=(a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const smoothstep=(a,b,x)=>{ const t=Math.max(0,Math.min(1,(x-a)/(b-a))); return t*t*(3-2*t); };
function bez(a,b,c,d,t){ const m=1-t, m2=m*m, t2=t*t; const w0=m2*m,w1=3*m2*t,w2=3*m*t2,w3=t2*t;
  return [ w0*a[0]+w1*b[0]+w2*c[0]+w3*d[0], w0*a[1]+w1*b[1]+w2*c[1]+w3*d[1] ]; }

// ------------------------------------------------------------------ live look/params
const P = {
  pool: 3000, n: 220, food: 700,
  // --- defaults baked from Karl's tuned "Save Defaults" (2026-09-02); the live slider panel + runtime file were removed ---
  field: 0.68,      // condenser backlight brightness (0..1)
  density: 0.45,    // tinted (Beer-Lambert) absorption scale -- how strongly the gel eats its complementary colour
  opacity: 0.05,    // flat colourless absorption -- milky/opaque even for pale gel (independent of tint)
  lighten: 0.7,     // mix segment pigment toward white -> less tinted absorption, brighter specimen
  desat: 0.75,      // desaturate the rendered body colour toward grey (render only; hair/cyto/grain stay raw)
  rim: 1.05,        // refractive Becke-line rim strength
  subsurface: 0.6,  // how much the gel re-emits its own tint
  cyto: 0.25,       // cytoplasm: strength of the cellular density spots
  cells: 0.3,       // cytoplasm: cell frequency (bigger = smaller, denser spots)
  cytoDrift: 0.02,  // cytoplasm: gentle streaming speed (world units of drift per sim tick; 0 = static)
  grain: 0.25,      // grain: fine density speckle strength (driven by the blue component)
  grainScale: 2.0,  // grain fineness (bigger = finer)
  junk: 1.0,        // floating detritus amount (0..1 of the seeded pool)
  junkOpacity: 0.225, // detritus density/darkness (-25% visibility)
  junkSoft: 6.0,    // detritus edge softness (0.5 = sharp, higher = soft/out-of-focus) [Karl: doubled 3->6]
  hair: 0.15,       // hairs: glow brightness (0 = off)
  hairLen: 4,       // hair length (world units)
  hairSpace: 1,     // spacing between hairs along the perimeter (world units; smaller = denser)
  hairWid: 0.35,    // hair strand thickness (world units at the root)
  hairSway: 0.8,    // hair beat amplitude (radians of tip deflection)
  hairBeat: 0.06,   // beat speed (per sim tick)
  hairWave: 0.12,   // metachronal wavelength along the body (per world arc-unit)
  hairDrag: 1.0,    // how much the hairs trail/bend from the part's motion through the water
  hairLenJit: 0.35, // per-hair random LENGTH variation (fraction, +/-): each strand a bit longer/shorter
  hairAngJit: 0.30, // per-hair random ANGLE offset (radians, +/-): each strand splays a bit differently
  hairGrow: 0.38,   // growth fraction at which hairs start appearing (baby-hair gate; ramps to full ~0.4 above it)
  bloom: 0.2,       // full-image bloom strength (0 = off)
  bloomThresh: 0,   // brightness above which pixels bloom
  deathBlur: 2.5,   // soft-focus blur on dying swimmers (edge-feather exponent added as they fade out)
  deathFadeFloor: 0.45, // decompose BEGINS before death: a dying swimmer (aging/starving) fades toward this while still
                        // alive & twitching, reaching it at the moment of death, then dissolves the rest of the way to 0
  wallThick: 11,    // world-boundary wall thickness (screen px at zoom 1; scales with zoom)
  wallDark: 0.2,    // darkening of the region OUTSIDE the wall (0 = none .. 1 = black)
  hairFade: 0.1,    // LOD hair fade-out band width (larger = hairs fade over a wider zoom range = gentler)
};

let seed = 1, world = null, running = true, ticksPerFrame = 3;
let cam = { x: P.pool/2, y: P.pool/2, zoom: 6 };
function fitZoom(){ return Math.min(W, H) / P.pool; }
function sc(){ return fitZoom() * cam.zoom; }
let SC_REF = (VIEW_MAIN / P.pool) * 6;   // reference scale (main view @ default zoom) -> rim brightness normalized to it; reset in build()
function toScreen(wx, wy){ const s = sc(); return [ (wx - cam.x)*s + W/2, (wy - cam.y)*s + H/2 ]; }

// ================================================================== WebGL2 setup
const gl = cv.getContext('webgl2', { antialias:false, premultipliedAlpha:false, alpha:false });
if (!gl){ errEl.textContent = 'WebGL2 not available in this browser.'; }

// half-float render target so thickness can accumulate past 1.0 (additive). iOS-safe: 16F + core blend (no float-blend ext).
let thickFmt = null;
if (gl){
  if (gl.getExtension('EXT_color_buffer_float')) thickFmt = { internal: gl.RGBA16F, type: gl.HALF_FLOAT };
  else if (gl.getExtension('EXT_color_buffer_half_float')) thickFmt = { internal: gl.RGBA16F, type: gl.HALF_FLOAT };
  else thickFmt = { internal: gl.RGBA8, type: gl.UNSIGNED_BYTE }; // fallback: thickness clips at 1 (degraded, still renders)
}

function makeShader(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)){ const log = gl.getShaderInfoLog(s); console.error('[shader]', log, '\n', src); errEl.textContent = 'Shader error: '+log; }
  return s;
}
function makeProgram(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, makeShader(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, makeShader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)){ const log = gl.getProgramInfoLog(p); console.error('[link]', log); errEl.textContent = 'Link error: '+log; }
  return p;
}

// --- body pass: tessellated segment geometry -> half-float thickness buffer (additive) ---
const BODY_VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;   // screen pixels
layout(location=1) in float aCU;   // profile coord across the segment: -1 edge .. 0 spine .. +1 edge
layout(location=2) in float aRad;  // local half-width (world units) = thickness radius at the spine
layout(location=4) in float aV;    // arc-length ALONG the body (world units) -- the other axis of body-space
layout(location=3) in vec3 aTint;  // gel pigment 0..1
layout(location=5) in float aBlur; // death soft-focus amount (0 alive -> higher as it dies)
uniform vec2 uRes;
out float vCU; out float vRad; out float vV; out vec3 vTint; out float vBlur;
void main(){
  vCU = aCU; vRad = aRad; vV = aV; vTint = aTint; vBlur = aBlur;
  vec2 clip = vec2(aPos.x / uRes.x * 2.0 - 1.0, 1.0 - aPos.y / uRes.y * 2.0);
  gl_Position = vec4(clip, 0.0, 1.0);
}`;
const BODY_FS = `#version 300 es
precision highp float;
in float vCU; in float vRad; in float vV; in vec3 vTint; in float vBlur;
uniform float uCyto, uCells, uLighten, uSat;   // cytoplasm amount, cell freq, lighten-to-white, desaturate (render only)
uniform float uGrain, uGrainScale;             // grain amount + fineness (driven by the BLUE component)
uniform float uTime, uCytoDrift;               // sim clock + gentle cytoplasmic-streaming speed (0 = static)
out vec4 frag;   // vTint carries the RAW genome colour; hair/cyto/grain read it raw, appearance is lit+desaturated below

// integer hash (uint mul/xor/shift) -> bit-identical on every GPU/CPU/JIT backend (arm64 LLVM == x86-64 Subzero),
// so goldens match cross-arch. Replaces fract(sin()*k), whose transcendentals diverge across backends. Callers pass
// integer-valued cell corners; float()+÷ below are IEEE-exact. (docs/PLAN-visual-goldens.md)
vec2 hash2(vec2 p){
  uvec2 q = uvec2(ivec2(p));                                  // exact for integer p; negatives wrap (defined int->uint)
  uint h = q.x*374761393u + q.y*668265263u; h = (h ^ (h >> 13u)) * 1274126177u; h ^= (h >> 16u);
  uint g = h*2246822519u; g = (g ^ (g >> 15u)) * 3266489917u; g ^= (g >> 13u);
  return vec2(float(h), float(g)) / 4294967296.0;             // -> [0,1)^2
}
// smooth value noise: interpolate the per-cell hash across cell corners -> no hard square grid, organic grain
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  float a = hash2(i).x, b = hash2(i+vec2(1.0,0.0)).x, c = hash2(i+vec2(0.0,1.0)).x, d = hash2(i+vec2(1.0,1.0)).x;
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
// Worley / cellular noise: distance to the nearest jittered feature point (small => near a cell centre)
float worley(vec2 p){
  vec2 i = floor(p), f = fract(p); float d = 8.0;
  for (int y=-1;y<=1;y++) for (int x=-1;x<=1;x++){
    vec2 g = vec2(float(x),float(y)); vec2 o = hash2(i+g); vec2 r = g+o-f; d = min(d, dot(r,r));
  }
  return sqrt(d);
}

void main(){
  // rounded cross-section: full radius at the spine, feathering to 0 at the edges. DEATH BLUR raises the falloff
  // exponent (soft-focus edges) and the detail factor washes out cyto/grain as it dies.
  float soft = 0.5 + vBlur;
  float detail = 1.0 - clamp(vBlur, 0.0, 1.0);
  float th = vRad * pow(max(0.0, 1.0 - vCU*vCU), soft);

  // CYTOPLASM: cellular spots of higher density in BODY-SPACE. u across = cu*radius (world units), v along = arc length.
  // Both in world units so cells are isotropic; welded to the material, so they flex with the body. No animation.
  if (uCyto > 0.0){
    float uW = vCU * vRad;
    // gentle cytoplasmic streaming: drift the sample slowly over sim time (mostly ALONG the body, a little across) so the
    // cells flow instead of sitting static. Welded per-instance offset is already baked into vV, so each creature flows its
    // own pattern. (bounded well within float precision for any realistic clock.)
    vec2 flow = vec2(uTime * uCytoDrift * 0.5, uTime * uCytoDrift);
    float f1 = worley((vec2(uW, vV) + flow) * uCells);
    float spot = 1.0 - smoothstep(0.0, 0.5, f1);            // 1 at cell centres, 0 between
    float interior = 1.0 - smoothstep(0.6, 1.0, abs(vCU));  // fade out near the silhouette so the rim stays clean
    th *= 1.0 + uCyto * vTint.g * spot * interior * detail; // cytoplasm attenuated by RAW GREEN (washed out on death)
  }

  // GRAIN: fine per-cell density speckle in body-space, attenuated by the segment's BLUE component. Symmetric
  // (light + dark specks), interior-faded so the silhouette/rim stays clean. Composes on top of the cytoplasm.
  if (uGrain > 0.0){
    float interior = 1.0 - smoothstep(0.6, 1.0, abs(vCU));
    vec2 gc = vec2(vCU * vRad, vV) * uGrainScale;
    float gr = 0.55*vnoise(gc) + 0.30*vnoise(gc*2.3 + 19.7) + 0.15*vnoise(gc*4.7 + 5.1);   // fBm: plain noise, a few octaves
    th *= 1.0 + uGrain * vTint.b * (gr - 0.5) * 2.0 * interior * detail;   // grain by RAW BLUE (washed out on death)
  }

  // BODY APPEARANCE (render only): raw genome colour -> lighten toward white -> desaturate toward grey
  vec3 col = vTint * (1.0 - uLighten) + uLighten;
  col = mix(col, vec3(dot(col, vec3(0.299, 0.587, 0.114))), uSat);
  frag = vec4(col * th, th);
}`;

// fullscreen triangle (attributeless) -- shared by the resolve and final passes
const COMP_VS = `#version 300 es
precision highp float;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); // (0,0)(2,0)(0,2) fullscreen triangle
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

// --- per-slab RESOLVE pass (front to back): fold ONE depth slab into the running composite ---
// Pure absorption is order-independent, so we only need ordering for EMITTED light (rim + subsurface): this slab's
// emission is dimmed by exp(-frontAbsorb), the gel already accumulated in nearer slabs. Two MRT outputs:
//   0 = running emitted colour   1 = running absorb*thickness (frontAbsorb for the slabs behind this one)
const RESOLVE_FS = `#version 300 es
precision highp float;
uniform sampler2D uSlab, uPrevOut, uPrevFA, uHairTex;
uniform vec2 uRes;
uniform float uField, uDensity, uRim, uSub, uOpacity, uScaleRatio;
layout(location=0) out vec4 outColor;
layout(location=1) out vec4 outFA;

float slabTh(ivec2 p){ return texelFetch(uSlab, p, 0).a; }

void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy);
  vec4 slab = texelFetch(uSlab, ip, 0);
  vec3 prevOut = texelFetch(uPrevOut, ip, 0).rgb;   // emission from nearer slabs
  vec3 prevFA  = texelFetch(uPrevFA,  ip, 0).rgb;   // absorb*thickness of nearer slabs (gel in front)
  vec3 hairE   = texelFetch(uHairTex, ip, 0).rgb;   // THIS slab's hair glow (rim-coloured)
  vec3 atten = exp(-prevFA);                         // everything this slab emits is dimmed by the gel in front of it
  float th = slab.a;
  if (th <= 1e-4){
    // no body gel here, but hairs stick out past the silhouette -> still add their (depth-attenuated) glow
    outColor = vec4(prevOut + hairE * atten, 1.0);
    outFA = vec4(prevFA, 1.0); return;
  }

  vec3 tint = clamp(slab.rgb / th, 0.0, 1.0);
  // tinted absorption (a gel eats its complement) + flat colourless opacity (makes even white gel milky/opaque)
  vec3 absorb = (vec3(1.0) - tint) * uDensity + vec3(uOpacity);

  // this slab's emitted light: subsurface glow + refractive Becke rim (from THIS slab's own thickness edges)
  vec3 sub = tint * (1.0 - exp(-th * 0.04)) * uSub * uField * 0.5;
  // gradient measured per pixel -> multiply by the zoom ratio so the rim brightness is per-WORLD-unit (scale-invariant).
  // The line still widens as you zoom in (more pixels fall inside the edge); only its brightness is held steady.
  float grad = length(vec2(slabTh(ip+ivec2(1,0)) - slabTh(ip-ivec2(1,0)),
                           slabTh(ip+ivec2(0,1)) - slabTh(ip-ivec2(0,1)))) * uScaleRatio;
  vec3 rim = vec3(1.0, 1.0, 0.97) * (smoothstep(0.15, 2.5, grad) * uRim * 0.6 * uField);

  // subsurface glow stays STEADY (must not pop as others drift over it). Rim AND hairs are depth-ordered -- dimmed by
  // the gel nearer than this slab -> overlapping swimmers no longer stack their hairs into blown-out hot spots.
  outColor = vec4(prevOut + sub + (rim + hairE) * atten, 1.0);
  outFA    = vec4(prevFA + absorb * th, 1.0);
}`;

// --- FINAL pass: backlight through all the gel (order-independent) + all the accumulated emission, over the field ---
const FINAL_FS = `#version 300 es
precision highp float;
uniform sampler2D uOut, uFA;
uniform vec2 uRes;
uniform float uField;
out vec4 frag;
void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy);
  vec3 emitted = texelFetch(uOut, ip, 0).rgb;
  vec3 totalAbsorb = texelFetch(uFA, ip, 0).rgb;   // absorb*thickness summed over every slab

  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 field = uField * vec3(0.99, 1.0, 0.95);
  field *= 1.0 - smoothstep(0.35, 0.98, distance(uv, vec2(0.5))) * 0.5;

  frag = vec4(field * exp(-totalAbsorb) + emitted, 1.0);   // Beer-Lambert backlight + emission
}`;

// --- BLOOM: bright-pass -> separable blur -> add back over the scene (full-image glow) ---
const BRIGHT_FS = `#version 300 es
precision highp float;
uniform sampler2D uScene; uniform float uThresh;
out vec4 frag;
void main(){
  vec3 c = texelFetch(uScene, ivec2(gl_FragCoord.xy), 0).rgb;
  float b = max(max(c.r, c.g), c.b);
  frag = vec4(c * (max(0.0, b - uThresh) / max(b, 1e-4)), 1.0);   // keep only the bright excess
}`;
const BLUR_FS = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform ivec2 uDir;   // per-tap pixel step (H then V)
out vec4 frag;
void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy);
  vec3 s = texelFetch(uTex, ip, 0).rgb * 0.204164;
  s += (texelFetch(uTex, ip+uDir,    0).rgb + texelFetch(uTex, ip-uDir,    0).rgb) * 0.180174;
  s += (texelFetch(uTex, ip+uDir*2,  0).rgb + texelFetch(uTex, ip-uDir*2,  0).rgb) * 0.123832;
  s += (texelFetch(uTex, ip+uDir*3,  0).rgb + texelFetch(uTex, ip-uDir*3,  0).rgb) * 0.066282;
  s += (texelFetch(uTex, ip+uDir*4,  0).rgb + texelFetch(uTex, ip-uDir*4,  0).rgb) * 0.027631;
  frag = vec4(s, 1.0);
}`;
const POST_FS = `#version 300 es
precision highp float;
uniform sampler2D uScene, uBloom; uniform float uStrength;
uniform ivec2 uOrigin;     // composite: this view fills a REGION of the canvas -> map window fragcoord back to view texels
uniform vec2 uViewSize;    // view size (px) for the rounded-corner mask
uniform float uRound;      // corner radius (px); same for every view so all four match
out vec4 frag;
void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy) - uOrigin;
  vec3 c = texelFetch(uScene, ip, 0).rgb + texelFetch(uBloom, ip, 0).rgb * uStrength;
  if (uRound > 0.0){                                       // rounded-box SDF -> mask corners to the (black) canvas
    vec2 hs = uViewSize * 0.5;
    vec2 q = abs((vec2(ip) + 0.5) - hs) - hs + vec2(uRound);
    float sd = min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - uRound;
    c *= 1.0 - smoothstep(-0.75, 0.75, sd);               // ~1.5px antialiased edge
  }
  frag = vec4(c, 1.0);
}`;

// --- world-boundary box: flat-colour screen-space quads drawn on top ---
const BOX_VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;
uniform vec2 uRes;
void main(){ gl_Position = vec4(aPos.x/uRes.x*2.0-1.0, 1.0-aPos.y/uRes.y*2.0, 0.0, 1.0); }`;
const BOX_FS = `#version 300 es
precision highp float;
uniform vec4 uColor;
out vec4 frag;
void main(){ frag = uColor; }`;   // rgba -> alpha lets the outside-wall darkening be semi-transparent

// --- hairs: thin glowing rim-coloured strands, drawn additively on top of the composite ---
const HAIR_VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;   // screen pixels
layout(location=1) in float aA;    // intensity (1 at root, 0 at tip)
uniform vec2 uRes;
out float vA;
void main(){
  vA = aA;
  vec2 clip = vec2(aPos.x / uRes.x * 2.0 - 1.0, 1.0 - aPos.y / uRes.y * 2.0);
  gl_Position = vec4(clip, 0.0, 1.0);
}`;
const HAIR_FS = `#version 300 es
precision highp float;
in float vA;
uniform vec3 uColor;
uniform float uBright;
out vec4 frag;
void main(){ frag = vec4(uColor * (vA * uBright), 1.0); }   // additive glow (blendFunc ONE,ONE)
`;
// INSTANCED hair strip: one instance per strand, params {root, dir, len, wid, theta, bright} (screen space); the VS
// expands a TRIANGLE_STRIP of uSegs segments along the strand's CIRCULAR ARC (the exact curve emitHair builds on the
// CPU, but smooth at any zoom -> no facets) and tapers width+alpha to the tip. Pairs with the SAME trivial HAIR_FS
// (no new per-pixel math -> golden-safe, cross-arch-stable). theta->0 degrades to a straight segment (stable). (P1.)
const HAIR_INST_VS = `#version 300 es
precision highp float;
layout(location=0) in vec4 p0;   // rx,ry (screen root) , nx,ny (outward dir)
layout(location=1) in vec4 p1;   // len, wid(half-width at root), theta(total bend), bright
uniform vec2 uRes; uniform int uSegs;
out float vA;
void main(){
  int seg = gl_VertexID >> 1;                         // 0..uSegs
  float side = float(gl_VertexID & 1) * 2.0 - 1.0;    // -1 / +1 (strip edges)
  float f = float(seg) / float(uSegs);                // 0..1 along the strand
  vec2 root = p0.xy; vec2 d0 = normalize(p0.zw);
  float len = p1.x, wid = p1.y, theta = p1.z, bright = p1.w;
  vec2 pos, tang;
  if (abs(theta) < 1e-3){ pos = root + d0 * (len * f); tang = d0; }   // straight (theta~0 is the common case; no cancellation)
  else {
    float R = len / theta;                            // signed radius
    vec2 nrm = vec2(-d0.y, d0.x);                     // +90deg (CCW), matches emitHair's ang+=theta stepping
    vec2 C = root + nrm * R;                          // arc centre
    float a = f * theta, ca = cos(a), sa = sin(a);    // swept angle
    vec2 rc = root - C;
    pos  = C + vec2(rc.x*ca - rc.y*sa, rc.x*sa + rc.y*ca);
    tang = vec2(d0.x*ca - d0.y*sa, d0.x*sa + d0.y*ca);
  }
  float w = wid * (1.0 - f);                          // taper half-width to the tip
  vec2 perp = vec2(-tang.y, tang.x);
  vec2 P = pos + perp * (side * w);
  vA = (1.0 - f) * bright;                            // taper intensity to the tip (matches emitHair)
  gl_Position = vec4(P.x/uRes.x*2.0 - 1.0, 1.0 - P.y/uRes.y*2.0, 0.0, 1.0);
}`;
const HAIR_SEGS = 20;   // strip segments/strand: chord deviation ~ len*theta/(2*(2N)^2) -> sub-pixel/facet-free at branchy zoom

// --- junk/detritus: plain thickness discs (NO cytoplasm/grain), summed into the slab thickness like a tiny body ---
const JUNK_FS = `#version 300 es
precision highp float;
in float vCU; in float vRad; in vec3 vTint;
uniform float uSoft;   // edge falloff exponent: 0.5 = sharp (sqrt), higher = softer/feathered (out-of-focus)
out vec4 frag;
void main(){
  float th = vRad * pow(max(0.0, 1.0 - vCU*vCU), uSoft);
  frag = vec4(vTint * th, th);
}`;

const K_SLABS = 8;   // depth slabs for front-to-back compositing (more = finer occlusion ordering, more passes)
let bodyProg=null, resolveProg=null, finalProg=null, uBodyRes=null, uBodyCyto=null, uBodyCells=null, uBodyLighten=null, uBodyGrain=null, uBodyGrainScale=null, uBodySat=null, uBodyTime=null, uBodyCytoDrift=null;
const uR = {}, uF = {};                  // resolve / final uniform locations
let mainSet=null, smallSet=null;   // per-VIEW FBO sets (makeFBOSet): { slabTex/FBO, accA/B (MRT), hairTex/FBO, sceneTex/FBO, bloomA/B(+FBO) }. Main=768^2, small=256^2.
let bodyVAO=null, bodyVBO=null, emptyVAO=null;
let hairProg=null, uHairRes=null, uHairColor=null, uHairBright=null, hairVAO=null, hairVBO=null;
let hairInstProg=null, hairInstVAO=null, hairInstVBO=null, uHiRes=null, uHiSegs=null, uHiColor=null, uHiBright=null;   // instanced strip (P1)
let junkProg=null, uJunkRes=null, uJunkSoft=null;
let brightProg=null, blurProg=null, postProg=null; const uBr={}, uBl={}, uPo={};
let boxProg=null, uBoxRes=null, uBoxColor=null, boxVAO=null, boxVBO=null;
let hairTime = 0;
// death fade: dead swimbots are swept from the world each tick, so keep the last reference per id and render it
// fading out (thickness -> 0) over FADE_TICKS of SIM TIME before pruning. Tied to the clock, so it tracks sim
// speed and freezes on pause. 240 ticks = 4 s at 1x (60 ticks/s @ 60fps); at 60x it's 240/3600 = 4/60 s -- death
// speeds up exactly with sim speed. Alive -> fade 1; dead -> fade by elapsed ticks.
const known = new Map(), fades = new Map(), deathTick = new Map(), deathFade0 = new Map(), FADE_TICKS = 240;
const OLD_AGE_DURATION = 1000;   // mirrors the engine: the decline window before old-age death (pre-death decompose ramp)
// floating detritus: persistent world-space particles that drift in the medium (specks + soft out-of-focus blobs)
const MAX_JUNK = 1500;   // floating detritus particle pool (denser medium)
let junk = [], lastJunkClock = 0;   // lastJunkClock: junk drift is advanced by ELAPSED SIM TICKS (freezes on pause, scales with speed)
function seedJunk(rng){
  junk = [];
  for (let i=0;i<MAX_JUNK;i++){
    const blob = rng() < 0.3;
    const sz = Math.pow(2, rng()*2 - 1);             // per-particle size: log-uniform in [0.5x, 2x] (symmetric, mean 1)
    junk.push({
      x: rng()*P.pool, y: rng()*P.pool, vx: (rng()-0.5)*0.083, vy: (rng()-0.5)*0.083,   // per-TICK velocity (x elapsed ticks)
      r: (blob ? 9 + rng()*18 : 2.5 + rng()*5) * sz,   // world visual radius (bigger); x per-particle size spread
      th: blob ? 0.3 + rng()*0.4 : 0.6 + rng()*1.0,    // world thickness (less opaque)
      tint: blob ? [0.62,0.55,0.48] : [0.35+rng()*0.15, 0.30+rng()*0.12, 0.25+rng()*0.10],
      slab: Math.min(K_SLABS-1, (rng()*K_SLABS)|0),    // depth -> interleaves with the swimmers
    });
  }
}
// stable per-creature pseudo-depth in [0,1) (the pool is 2D, so we invent a depth): golden-ratio hash of the id.
function pseudoDepth(id){ const f = (id * 0.61803398875) % 1; return f < 0 ? f + 1 : f; }

function makeTex(w, h){   // FBO-size decoupled from the canvas: caller passes the view size
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, thickFmt.internal, w, h, 0, gl.RGBA, thickFmt.type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function makeAccum(w, h){   // MRT pair: colour (emission) + frontAbsorb
  const out = makeTex(w,h), fa = makeTex(w,h), f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, out, 0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, fa, 0);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) errEl.textContent = 'Accum FBO incomplete';
  return { fbo: f, out, fa };
}
// One complete offscreen pipeline sized to a view (square). Main = 768^2; species tiles share a 256^2 set.
function mkFBO1(tex){ const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0); return f; }
function makeFBOSet(w, h = w){   // view may be non-square (the desktop main fills the window); tiles stay square
  const slabTex = makeTex(w,h), slabFBO = mkFBO1(slabTex);   // per-slab thickness
  const hairTex = makeTex(w,h), hairFBO = mkFBO1(hairTex);   // per-slab hair glow (depth-attenuated in resolve)
  const accA = makeAccum(w,h), accB = makeAccum(w,h);        // front-to-back ping-pong composite
  const sceneTex = makeTex(w,h), sceneFBO = mkFBO1(sceneTex);// backlit scene (pre-bloom)
  const bloomA = makeTex(w,h), bloomAFBO = mkFBO1(bloomA);   // bloom ping-pong
  const bloomB = makeTex(w,h), bloomBFBO = mkFBO1(bloomB);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { w, h, slabTex, slabFBO, hairTex, hairFBO, accA, accB, sceneTex, sceneFBO, bloomA, bloomAFBO, bloomB, bloomBFBO };
}
function deleteFBOSet(s){   // free GL objects when resizing the main set (else a resize leaks textures/FBOs)
  if (!s || !gl) return;
  for (const t of [s.slabTex, s.hairTex, s.sceneTex, s.bloomA, s.bloomB, s.accA.out, s.accA.fa, s.accB.out, s.accB.fa]) gl.deleteTexture(t);
  for (const f of [s.slabFBO, s.hairFBO, s.sceneFBO, s.bloomAFBO, s.bloomBFBO, s.accA.fbo, s.accB.fbo]) gl.deleteFramebuffer(f);
}
// Desktop only: size the main view (canvas backing-store + its FBO set) to FILL #canvasBox. The browser keeps the
// fixed 768^2 main (so its goldens are unchanged). Aspect-correct: fitZoom uses min(W,H)/pool, so the visible field is
// pool/zoom regardless of size -- filling just adds pixels + more world on the long axis.
function resizeMain(){
  if (!gl) return;
  const box = document.getElementById('canvasBox');
  const w = Math.max(64, Math.floor(box.clientWidth)), h = Math.max(64, Math.floor(box.clientHeight));
  if (w === cv.width && h === cv.height && mainSet && mainSet.w === w && mainSet.h === h) return;
  cv.width = w; cv.height = h; CANVAS_W = w; CANVAS_H = h; mainW = w; mainH = h;
  const old = mainSet; mainSet = makeFBOSet(w, h); deleteFBOSet(old);
  SC_REF = (Math.min(w, h) / P.pool) * 6;   // rim-brightness ref tracks the view size (uScaleRatio stays = zoom/6)
  render();
}

function initGL(){
  if (!gl) return;
  bodyProg = makeProgram(BODY_VS, BODY_FS);
  resolveProg = makeProgram(COMP_VS, RESOLVE_FS);
  finalProg = makeProgram(COMP_VS, FINAL_FS);
  uBodyRes = gl.getUniformLocation(bodyProg, 'uRes');
  uBodyCyto = gl.getUniformLocation(bodyProg, 'uCyto');
  uBodyCells = gl.getUniformLocation(bodyProg, 'uCells');
  uBodyLighten = gl.getUniformLocation(bodyProg, 'uLighten');
  uBodyGrain = gl.getUniformLocation(bodyProg, 'uGrain');
  uBodyGrainScale = gl.getUniformLocation(bodyProg, 'uGrainScale');
  uBodySat = gl.getUniformLocation(bodyProg, 'uSat');
  uBodyTime = gl.getUniformLocation(bodyProg, 'uTime');
  uBodyCytoDrift = gl.getUniformLocation(bodyProg, 'uCytoDrift');
  for (const n of ['uSlab','uPrevOut','uPrevFA','uHairTex','uRes','uField','uDensity','uOpacity','uRim','uSub','uScaleRatio']) uR[n] = gl.getUniformLocation(resolveProg, n);
  for (const n of ['uOut','uFA','uRes','uField']) uF[n] = gl.getUniformLocation(finalProg, n);

  // offscreen pipelines: one 768^2 set for the main micrograph, one 256^2 set shared serially by the species tiles.
  // (Each holds its own slab/hair/accum/scene/bloom targets; see makeFBOSet.)
  mainSet = makeFBOSet(VIEW_MAIN);
  smallSet = makeFBOSet(VIEW_SMALL);

  // dynamic body geometry buffer
  bodyVAO = gl.createVertexArray(); gl.bindVertexArray(bodyVAO);
  bodyVBO = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bodyVBO);
  const STR = 9 * 4;   // x,y, cu, rad, v, r,g,b, blur
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, STR, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, false, STR, 8);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, STR, 12);
  gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4, 1, gl.FLOAT, false, STR, 16);   // aV (arc-length)
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 3, gl.FLOAT, false, STR, 20);   // aTint
  gl.enableVertexAttribArray(5); gl.vertexAttribPointer(5, 1, gl.FLOAT, false, STR, 32);   // aBlur (death)
  gl.bindVertexArray(null);

  emptyVAO = gl.createVertexArray(); // for the attributeless fullscreen triangle

  // hairs: their own program + dynamic buffer ([x,y,alpha]), rendered additively over the composite
  hairProg = makeProgram(HAIR_VS, HAIR_FS);
  uHairRes = gl.getUniformLocation(hairProg, 'uRes');
  uHairColor = gl.getUniformLocation(hairProg, 'uColor');
  uHairBright = gl.getUniformLocation(hairProg, 'uBright');
  hairVAO = gl.createVertexArray(); gl.bindVertexArray(hairVAO);
  hairVBO = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, hairVBO);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 3*4, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 3*4, 8);
  gl.bindVertexArray(null);

  // instanced hair strip (P1): dedicated VAO, 2 vec4 per-instance attribs (divisor set ONCE here), corners via gl_VertexID
  hairInstProg = makeProgram(HAIR_INST_VS, HAIR_FS);
  uHiRes = gl.getUniformLocation(hairInstProg, 'uRes'); uHiSegs = gl.getUniformLocation(hairInstProg, 'uSegs');
  uHiColor = gl.getUniformLocation(hairInstProg, 'uColor'); uHiBright = gl.getUniformLocation(hairInstProg, 'uBright');
  hairInstVAO = gl.createVertexArray(); gl.bindVertexArray(hairInstVAO);
  hairInstVBO = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, hairInstVBO);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 32, 0);  gl.vertexAttribDivisor(0, 1);   // p0
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 16); gl.vertexAttribDivisor(1, 1);   // p1
  gl.bindVertexArray(null);

  junkProg = makeProgram(BODY_VS, JUNK_FS);   // plain discs, shares the body vertex format
  uJunkRes = gl.getUniformLocation(junkProg, 'uRes');
  uJunkSoft = gl.getUniformLocation(junkProg, 'uSoft');

  // bloom: scene target + ping-pong blur buffers + bright/blur/composite programs
  brightProg = makeProgram(COMP_VS, BRIGHT_FS); for (const n of ['uScene','uThresh']) uBr[n]=gl.getUniformLocation(brightProg,n);
  blurProg   = makeProgram(COMP_VS, BLUR_FS);   for (const n of ['uTex','uDir'])       uBl[n]=gl.getUniformLocation(blurProg,n);
  postProg   = makeProgram(COMP_VS, POST_FS);   for (const n of ['uScene','uBloom','uStrength','uOrigin','uViewSize','uRound']) uPo[n]=gl.getUniformLocation(postProg,n);
  // scene + bloom targets live per-view inside makeFBOSet (mainSet/smallSet, created above).

  // world-boundary box (flat-colour quads)
  boxProg = makeProgram(BOX_VS, BOX_FS);
  uBoxRes = gl.getUniformLocation(boxProg, 'uRes');
  uBoxColor = gl.getUniformLocation(boxProg, 'uColor');
  boxVAO = gl.createVertexArray(); gl.bindVertexArray(boxVAO);
  boxVBO = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, boxVBO);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 8, 0);
  gl.bindVertexArray(null);
}

// ================================================================== engine wiring (identical to the canvas viewer)
let curConfig = null, recording = false, recBuf = [];   // desktop (Electron) SQLite recording: current config + event buffer
function build(){
  errEl.textContent = '';
  if (recording) stopRecording();   // a fresh pool ends the current recording (don't mix runs in one DB)
  // the world (config + junk-zeroed founders + food) is built by the SHARED seeder so live and scrub match exactly;
  // it returns the seed's rng AFTER founders/food so the detritus below continues the same stream (byte-identical).
  let rng;
  try { const r = makeStandardWorld(seed, { pool: P.pool, n: P.n, food: P.food }); world = r.world; curConfig = r.config; rng = r.rng; }
  catch(e){ world = null; errEl.textContent = 'Cannot build: ' + e.message; return; }
  known.clear(); fades.clear(); deathTick.clear(); deathFade0.clear(); lastJunkClock = 0;   // no stale death-fade ghosts / junk drift across a rebuild
  frameCount = 0; speciesModel = createSpeciesAnalyzer();   // reset species state -> deterministic from a fresh build
  rowMap = new Map(); expanded = new Set(); if (speciesPanel) speciesPanel.replaceChildren();   // ids reuse from 1 across builds -> drop stale rows/expansion + the DOM (else orphans accumulate)
  SC_REF = (VIEW_MAIN / P.pool) * 6;   // main-view calibrated (independent of canvas aspect); recompute if P.pool changed
  seedJunk(rng);
  cam = { x:P.pool/2, y:P.pool/2, zoom: cam.zoom || 6 };
  document.getElementById('seedIn').value = seed;
}

  frameCount = 0; speciesModel = createSpeciesAnalyzer();

  const rng = mulberry32((seed>>>0) ^ 0x5eed1234); seedJunk(rng);    // detritus re-seeded from seed (deterministic, cosmetic)
  cam = { x:P.pool/2, y:P.pool/2, zoom: cam.zoom || 6 };

}

function parentPos(ph, p){ const par = ph.parts[p].parent; return (par === undefined || par === null || par < 0) ? ph.parts[0].position : ph.parts[par].position; }

function partPointsGL(ph, p, gscale){
  const part = ph.parts[p], parIdx = part.parent, pos = part.position, ppos = parentPos(ph, p);
  let width = part.width, parentWidth = ph.parts[(parIdx>=0?parIdx:0)].width;
  if (gscale < 1){ width = width*gscale + EGG_SIZE*(1-gscale); parentWidth = parentWidth*gscale + EGG_SIZE*(1-gscale); }
  let psx = part.perpendicular.x, psy = part.perpendicular.y, pex = part.perpendicular.x, pey = part.perpendicular.y;
  const cvl = part.length * SPLINE;

  const startW = (p===1?width:parentWidth);
  const sPX=psx*startW, sPY=psy*startW, ePX=pex*width, ePY=pey*width;
  const T=(x,y)=>toScreen(x,y);

  const len = part.length || 1, nx = part.axis.x/len, ny = part.axis.y/len;   // segment axis (world = screen direction)
  const capLenT = terminal ? width * (part.endCapSpline || 0) : 0;            // terminal dome bulge (world), along +axis
  const root = (p === 1);
  // ONLY the mouth (root) gets a rounded start-dome. Branch limbs instead MERGE into the trunk (thickness ramps up
  // from 0 at their base in emitStrip) -> no visible edge, a smooth fade. Sequential parts share their start edge.
  const capLenR = root ? startW * (4/3) : 0;                                  // start-dome bulge (world), along -axis
  return {
    sL:T(ppos.x-sPX, ppos.y-sPY), c1L:T(ppos.x-sPX+c1vx, ppos.y-sPY+c1vy),
    c2L:T(pos.x-ePX+c2vx, pos.y-ePY+c2vy), eL:T(pos.x-ePX, pos.y-ePY),
    eR:T(pos.x+ePX, pos.y+ePY), c2R:T(pos.x+ePX+c2vx, pos.y+ePY+c2vy),
    c1R:T(ppos.x+sPX+c1vx, ppos.y+sPY+c1vy), sR:T(ppos.x+sPX, ppos.y+sPY),
    joint:T(ppos.x, ppos.y), wStart:startW, wEnd:width, terminal, root, nx, ny, capLenT, capLenR,

}

// ------------------------------------------------------------------ geometry -> vertex buffer
let buf = new Float32Array(1 << 21);   // grows if needed
let o = 0;
// CAP: when non-null (during a Copy-Swimmer capture) every emitted triangle also records its SCREEN-space corners, so we

let CAP = null;   // { tris:[[part,kind,ax,ay,bx,by,cx,cy]...], hairs:[[part,ax,ay,bx,by,cx,cy]...], part, kind }  kind:0 strip,1 dome
function vtx(x, y, cu, rad, v, t, blur){
  if (o + 9 > buf.length){ const nb = new Float32Array(buf.length * 2); nb.set(buf); buf = nb; }
  buf[o++]=x; buf[o++]=y; buf[o++]=cu; buf[o++]=rad; buf[o++]=v; buf[o++]=t[0]; buf[o++]=t[1]; buf[o++]=t[2]; buf[o++]=blur;
}
function tri(A,acu,ar,av,aT, B,bcu,br,bv,bT, C,ccu,cr,cv,cT, blur){ if (CAP) CAP.tris.push([CAP.part, CAP.kind, A[0],A[1], B[0],B[1], C[0],C[1], ar,br,cr]); vtx(A[0],A[1],acu,ar,av,aT,blur); vtx(B[0],B[1],bcu,br,bv,bT,blur); vtx(C[0],C[1],ccu,cr,cv,cT,blur); }

function quad(A,acu,ar,av, B,bcu,br,bv, C,ccu,cr,cv, D,dcu,dr,dv, tA, tB, blur){ tri(A,acu,ar,av,tA, B,bcu,br,bv,tA, C,ccu,cr,cv,tB, blur); tri(A,acu,ar,av,tA, C,ccu,cr,cv,tB, D,dcu,dr,dv,tB, blur); }

const STEPS = 10, DOME_RINGS = 8, DOME_CROSS = 16, DISCK = 16;   // more strip steps -> smoother flexing; smooth caps
function emitStrip(pt, tStart, tEnd, v0, v1, rs, blur, merge, steps=STEPS){
  // merge (branch base): thickness ramps up from 0, and the side edges spread ALONG the trunk axis (fillet) -- BOTH
  // measured in ARC-LENGTH from the branch base (merge.a0..a1 over merge.rw), so short first segments still fade smoothly.
  const arcAt = (u)=> merge.a0 + (merge.a1-merge.a0)*u;
  // THICKNESS ramp uses its OWN (short) distance rampRw, NOT the bend's rw. The bend fillet spans rw=4*baseWidth, but the
  // thickness only needs to fade in over ~one base width -- with the long rw a SHORT limb never reached full thickness (it
  // rendered as a faint 17% ghost). Decoupled here so short limbs reach full thickness while the Y-fillet shape is unchanged.
  const ramp = merge ? (u)=>smoothstep(0, merge.rampRw, arcAt(u)) : ()=>1;
  // BEND: rotate the base region about the branch base so it emerges TANGENT to the trunk (full angle merge.da at the
  // base, easing to 0 by arc merge.rw) -> the branch leaves as a smooth Y arm, both edges fairing into the trunk.
  const bend = merge ? (Pp,u)=>{
    const th = merge.da * (1 - smoothstep(0, merge.rw, arcAt(u)));
    const c=Math.cos(th), s=Math.sin(th), dx=Pp[0]-merge.px, dy=Pp[1]-merge.py;
    return [merge.px + dx*c - dy*s, merge.py + dx*s + dy*c];

    quad(pL,-1,pr,pv, pM,0,pr,pv, M,0,r,v, L,-1,r,v, ptint, ct, blur);   // left half
    quad(pM,0,pr,pv, pR,1,pr,pv, R,1,r,v, M,0,r,v, ptint, ct, blur);     // right half

}
// a SOLID rounded end cap: an ellipsoidal dome grown off the base edge (baseA..baseB) along (axX,axY) by capLenScreen,
// shrinking to a point at the tip. Rings step outward along the axis (R = wBase*sqrt(1-a^2)) while carrying cu across
// the width and a tapering radius, so the fragment gets real 3D thickness (full at the base -> 0 at the tip) instead
// of a transparent film. Base ring (a=0) == the segment's end edge, so it joins the strip seamlessly.
function emitDome(baseA, baseB, axX, axY, capLenScreen, radWorld, t, vBase, vTip, blur, lod=1){
  const cx=(baseA[0]+baseB[0])*0.5, cy=(baseA[1]+baseB[1])*0.5;
  const hx=(baseB[0]-baseA[0])*0.5, hy=(baseB[1]-baseA[1])*0.5;
  const wBase=Math.hypot(hx,hy)||1e-6, ux=hx/wBase, uy=hy/wBase;   // unit vector across the base width
  const pt=(a,c)=>{ const R=wBase*Math.sqrt(Math.max(0,1-a*a)); return [ cx+axX*capLenScreen*a+ux*c*R, cy+axY*capLenScreen*a+uy*c*R ]; };
  const rad=(a)=>radWorld*Math.sqrt(Math.max(0,1-a*a));
  // RESOLUTION: rings step ALONG the cap axis, cross steps ACROSS the width. Rather than ADD rings for a long cap (which
  // multiplied the triangle count -> frame-rate hit), REDISTRIBUTE a FIXED budget (DOME_RINGS*DOME_CROSS) between the two by
  // the cap's aspect ratio: a long cap -> more rings, fewer cross; a flat one -> the reverse. Never faceted in one direction,
  // yet the same cost as the old fixed 8x16 (aspect=1 reproduces 8x16 exactly). Clamped so extreme aspects stay bounded.
  const aspect = Math.max(0.25, Math.min(4.0, capLenScreen / wBase));
  const ld = Math.sqrt(Math.max(0.12, lod));   // LOD: shrink both counts (budget ~ lod) for small on-screen creatures
  const rings = Math.max(3, Math.min(24, Math.round(DOME_RINGS * Math.sqrt(aspect) * ld)));

    for (let j=0;j<cross;j++){

    }
  }
}
function emitDisc(cx, cy, screenR, rad, t, vBase, blur){

}

// --- hairs: a separate [x,y,alpha] buffer, drawn additively as a glow on top of the composite ---
let hairBuf = new Float32Array(1 << 19), ho = 0;

let hairInst = new Float32Array(8 * 4096), hio = 0;   // grows as needed; hio/8 = strands

function emitHairInstance(rx, ry, nx, ny, len, wid, theta, bright){
  if (hio + 8 > hairInst.length){ const nb = new Float32Array(hairInst.length * 2); nb.set(hairInst); hairInst = nb; }
  hairInst[hio++]=rx; hairInst[hio++]=ry; hairInst[hio++]=nx; hairInst[hio++]=ny;
  hairInst[hio++]=len; hairInst[hio++]=wid; hairInst[hio++]=theta; hairInst[hio++]=bright;
}
// window.__hairMode: 'cpu' (default, the tessellated ribbons) or 'gpu' (the instanced arc strip). Settable via ?hair=gpu
// on the URL (so the headless harness + desktop can A/B) or window.__hairMode at runtime.

}

// per-HAIR stable pseudo-random: hash an integer key -> [0,1). Keyed on the hair's arc position/index (NOT time), so
// each strand's length/angle offset is fixed (organic jitter, not flicker) and identical frame to frame.
function hair01(k){ let h = k>>>0; h = Math.imul(h ^ (h>>>16), 0x45d9f3b); h = Math.imul(h ^ (h>>>16), 0x45d9f3b); h ^= h>>>16; return (h>>>0)/4294967296; }

const HAIR_NSEG = 4;
function emitHair(rx, ry, nx, ny, len, wid, theta, bright){
  hairsEmitted++;

function emitCapHairs(A, B, ax, ay, capLenScreen, radWorld, red, grow, fade, vArc, vx, vy, S){

// tessellate ONE segment (part p) of a creature at the current buffer cursor. Segments of the same CHAIN are emitted
// into the same depth slab so they still fuse seamlessly (no joint disc needed -- sequential parts share their edge).
function tessSegment(sb, ph, p, g, S, v0, v1, fade, merge, lod=1){
  const part = ph.parts[p];
  const pt = partPointsGL(ph, p, g);
  // LOD (lod: 1 = full, ->0 for tiny on-screen creatures): hairs (~half the geometry, invisible when small) drop first,
  // then strip steps and dome resolution scale down. Full detail when lod>=~1 (a reasonably large creature on screen).
  const steps = (lod >= 0.999) ? STEPS : Math.max(2, Math.round(STEPS * lod));
  // hairs FADE OUT smoothly as the creature shrinks (no hard on/off pop). At the small end they'd just be a faint white
  // halo anyway -- which the silhouette RIM already draws -- so as they fade they melt into that rim line. Below the fade
  // floor they're skipped entirely (cost saved at full zoom-out); above it they're full strength.
  const hairLOD = smoothstep(0.6 - P.hairFade, 0.6, lod);   // P.hairFade = fade-band width (wider = gentler fade-out)
  // caps GROW IN smoothly (bulge length scaled by domeLOD) rather than hard on/off -> no pop as you zoom. A zero-length cap
  // is just the flat strip end, so scaling from 0 emerges invisibly; we still skip the draw while it's ~flat (perf kept).
  const domeLOD = smoothstep(0.3, 0.55, lod);

  // Colour is a GRADIENT along the body: from the PARENT segment's colour at the joint to this segment's colour at its
  // end -> smooth transitions, no hard colour edges at joints (own colour at the root, where there is no parent).
  // `fade` scales thickness (1 alive -> 0 dead), so a dying swimmer dissolves (absorption, rim, glow all fade with it).
  const tEnd = [ part.red, part.green, part.blue ];

  // SHORT limb the bend has not eased to 0 by the tip, so the dome is left misaligned from the strip end -> a cut at the tip
  // dome transition. Apply the SAME end-bend (th at u=1, same pivot) to the dome base edge + bulge axis so the dome's base

  // faded (e.g. 17%) -- but the dome ignored the ramp and popped to FULL thickness, a cliff at the tip = a dark step + rim
  // line across the limb ("the cut at the tip dome transition"). Match the dome base thickness to the strip end (ramp at u=1).
  const rampEnd = merge ? smoothstep(0, merge.rampRw, merge.a1) : 1;   // match dome base to the strip-end thickness (same ramp)
  if (merge){

    const rot=(Pp)=>{ const dx=Pp[0]-merge.px, dy=Pp[1]-merge.py; return [merge.px+dx*c-dy*s, merge.py+dx*s+dy*c]; };
    deL=rot(pt.eL); deR=rot(pt.eR); dnx=pt.nx*c-pt.ny*s; dny=pt.nx*s+pt.ny*c;

// buildSegs: append one creature's per-part draw records (depth slab + arc-based Y-merge) to `segs`. Shared by render() and
// the Copy-Swimmer capture, so the dumped geometry is exactly what the renderer draws (no separate path that could diverge).
function buildSegs(id, sb, ph, g, fade, S, segs, lodOverride){
  const base = pseudoDepth(id);
  // PER-INSTANCE cytoplasm/grain: shift this creature's body-space v by a big per-id constant so its Worley/grain samples a
  // different region of the (non-repeating, 2D-jittered) noise field -> every creature's pattern is unique instead of every
  // identical shape sharing one pattern. Same offset for all its parts (welding + intra-creature continuity preserved); it
  // also desyncs the hair beat per creature, which looks better. Content-addressed by id so it's stable frame to frame.
  const vOff = (((id * 2654435761) >>> 0) / 4294967296) * 600;
  // per-chain layering, BUT the TRUNK is forced to the front and every branch one layer BEHIND it -> the trunk's gel masks
  // the branch bases from the front (hides the merge transition). Branch limbs still layer over the body.
  const chain = new Int32Array(ph.numParts);
  const arc = new Float64Array(ph.numParts);   // arc-length (world) to each part's START -> body-space `v`
  let reach = 0;   // longest root->tip PATH length (world) -- a POSE-INDEPENDENT size (from fixed part lengths), so LOD
  for (let p=1;p<ph.numParts;p++){ const par = ph.parts[p].parent; chain[p] = ph.parts[p].branch ? p : chain[par]; arc[p] = arc[par] + ph.parts[par].length; const tip = arc[p] + ph.parts[p].length; if (tip > reach) reach = tip; }
  // LOD from the STABLE path length (not the flexing max-part-distance, which wobbled ~25% and made caps/hairs flicker).
  // T=75 calibrated so this matches the old rs/60 aggressiveness on average. Capture forces full detail via lodOverride.
  const lod = (lodOverride !== undefined) ? lodOverride : Math.max(0, Math.min(1, reach * S / 75));
  const trunkChain = chain[1];
  const rankOf = new Map([[trunkChain, 0]]); let nextRank = 1;
  for (let p=1;p<ph.numParts;p++){ const c=chain[p]; if (!rankOf.has(c)) rankOf.set(c, nextRank++); }
  const chainLen = new Map();   // total arc-length of each chain -> how much room a limb has to fade its thickness in
  for (let p=1;p<ph.numParts;p++){ const c=chain[p]; chainLen.set(c, (chainLen.get(c)||0) + ph.parts[p].length); }
  const trunkSlab = Math.floor(base * (K_SLABS - 1));   // whole-integer slab offsets: trunk in front, each branch >=1 behind
  for (let p=1;p<ph.numParts;p++){
    if (ph.parts[p].length <= 0) continue;
    const cid = chain[p];
    const slab = Math.min(K_SLABS-1, trunkSlab + rankOf.get(cid));
    let merge = null;
    if (cid !== trunkChain){
      const baseArc = arc[cid], bw = ph.parts[cid].width;              // branch base part
      const tp = ph.parts[ph.parts[cid].parent], tl = Math.hypot(tp.axis.x, tp.axis.y) || 1;   // trunk it attaches to
      const tx = tp.axis.x/tl, ty = tp.axis.y/tl;
      const bp = ph.parts[cid], bl = Math.hypot(bp.axis.x, bp.axis.y) || 1;                      // branch base direction
      const bnx = bp.axis.x/bl, bny = bp.axis.y/bl;
      let phi = Math.atan2(bny, bnx) - Math.atan2(ty, tx); phi = Math.atan2(Math.sin(phi), Math.cos(phi));
      if (phi > Math.PI/2) phi -= Math.PI; else if (phi < -Math.PI/2) phi += Math.PI;
      const da = -phi * Math.cos(phi);                                 // bend toward tangent, ->0 at perpendicular (no snap)
      const pv = parentPos(ph, cid), ps = toScreen(pv.x, pv.y);
      const a0 = arc[p] - baseArc;
      // rw = bend-fillet span (long, keeps the smooth Y). rampRw = the thickness fade-in span. Keep it GENTLE (bw*4) so the
      // base thickness gradient stays UNDER the rim threshold -> no junction rim line, and the cyto/grain rim (which rides on
      // the same thickness gradient) is untouched. BUT cap rampRw at the chain's OWN length so a SHORT limb still reaches full
      // thickness (no faded ghost) rather than ramping past its end. Long limbs (longer than bw*4) get the gentle ramp for
      // free; only genuinely short limbs pay a steeper ramp, and they're small. (Length-aware, per Karl.)
      const rampRw = Math.min(bw*4, Math.max(chainLen.get(cid), 1e-3));
      merge = { a0, a1: a0 + ph.parts[p].length, rw: bw*4, rampRw, px: ps[0], py: ps[1], da };
    }
    segs.push({ sb, ph, p, g, S, fade, slab, v0: arc[p]+vOff, v1: arc[p]+vOff + ph.parts[p].length, merge, lod });
  }
}

// captureCreatureGeom: run the SAME tessellation for one creature with CAP active, returning the exact screen-space triangles

// ================================================================== species clustering (engine-native junk-DNA gate)
// Cluster living swimbots on the junk genes [USED, NUM_GENES) with the engine's EXACT metric (sim = 1 - mean|Δ|/256),
// same-species iff sim > reproductiveIsolation. Clusters are tracked as PERSISTENT LINEAGES (membership-overlap match)
// with an EMA'd centroid, so a species' plate crawls with real drift instead of scrambling; three STICKY tile slots
// (hysteresis) hold species so tiles don't reshuffle. Recomputed every SPECIES_RECOMPUTE frames (deterministic).
// Species clustering + the plate/diversity/lifespan EMAs live in engine/analysis/species.mjs (shared with the
// headless run generator, so a generated run's stats reproduce this panel exactly). `speciesModel` = live analyzer.
const SPECIES_RECOMPUTE = 1;         // recluster EVERY frame (~0.6ms at this pool size) -> smooth counts + fine drift
const TILE_ZOOM = 14;                // fixed shared zoom for a species mini-viewer -> fill is comparable across species
let frameCount = 0;
let speciesModel = createSpeciesAnalyzer();
let rowMap = new Map();            // id -> the collapsed <div.srow> in #species (persists across misses; dropped on retirement)
let expanded = new Set();          // ids currently expanded into a live mini-viewer
let miniCursor = 0; const MINI_BUDGET = 6;   // <=6 live minis rendered per frame; extras refresh round-robin (thumbnails)
const DIV_MAX = 60;                              // reference mean-per-gene std that reads 100 (founding ~73 pins at 100; punchy)
const divPct = std => Math.round(Math.min(100, Math.max(0, 100 * std / DIV_MAX)));   // mean per-gene std -> 0..100
// Species clustering, junkOf/junkSim, the PCA signature + the lifespan fold now live in engine/analysis/species.mjs;
// the viewer drives `speciesModel` (created above) and keeps only the DOM rendering below.
// whole-population label (HTML overlay, top-right of the main view). Per-species right column = DOM #species list (P1).
const labMain = document.getElementById('labMain');
const speciesPanel = document.getElementById('species');
// Ink-centering: a glyph's INK is not centred in its metric box (OCR-A sits low and off-centre), and CSS centres the
// box, not the ink -- and the measureText metrics that would let us correct it are unreliable across engines. So at
// launch we RASTERISE each glyph with the ACTUAL loaded font, pixel-scan its true ink bbox, and re-draw it dead-centre
// on a cell-sized bitmap. The bitmap becomes the cell's glyph (a CSS background-image), so it's centred by construction
// -- font-agnostic, no baseline math, no magic constants. Bitmaps are cached in a <style> so per-frame plateHTML stays
// a tiny string (no base64 churn).
const CELL_W = 18, CELL_H = 20, GLYPH_SS = 4;         // CELL_* must match .cell width/height; SS = supersample for crispness
const CELL_FONT_PX = 13, CELL_FONT_STACK = '"OCR A", ui-monospace, "SF Mono", Menlo, monospace';
let SIG_GLYPHS_READY = false;                         // false until the bitmap stylesheet is installed
function measurePlateGlyphs(){
  const W = CELL_W * GLYPH_SS, H = CELL_H * GLYPH_SS;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const cx = cv.getContext('2d', { willReadFrequently: true });   // we getImageData every glyph -> hint avoids a warning + is faster
  cx.font = `600 ${CELL_FONT_PX * GLYPH_SS}px ${CELL_FONT_STACK}`;
  cx.textAlign = 'left'; cx.textBaseline = 'alphabetic'; cx.fillStyle = '#000';
  let css = '';
  for (const ch of SIG_ALPHA){
    cx.clearRect(0, 0, W, H);
    cx.fillText(ch, W * 0.25, H * 0.7);                            // draw somewhere on-canvas; exact spot doesn't matter
    const d = cx.getImageData(0, 0, W, H).data;                    // pixel-scan the true ink bbox (alpha > 0)
    let minx = W, maxx = -1, miny = H, maxy = -1;

      if (d[(y*W + x)*4 + 3] > 12){ if (x<minx)minx=x; if (x>maxx)maxx=x; if (y<miny)miny=y; if (y>maxy)maxy=y; } }
    if (maxx >= 0){

      cx.clearRect(0, 0, W, H); cx.fillText(ch, W*0.25 + sx, H*0.7 + sy);

  }

if (document.fonts && document.fonts.load) document.fonts.load(`600 ${CELL_FONT_PX}px "OCR A"`).then(measurePlateGlyphs, measurePlateGlyphs);
else measurePlateGlyphs();
// render the signature as a colour barcode. Colour is a LINEAR (non-wrapping) ramp red(-1) -> green(0=mean) -> blue(+1)
// in OKLCh -- NOT the hue WHEEL (a ring: red would wrap back through magenta). We sweep hue monotonically red(29)->
// green(146)->blue(264) and stop, dropping the magenta arc. Value comes from the symbol's signed step ('0'=mean).
function plateHTML(sig){

    const v = signed / 17;                                    // [-1,1]
    const hue = (29 + (v + 1) * 117.5).toFixed(1);            // red(29) -> green(146) -> blue(264), linear, no magenta
    const g = SIG_GLYPHS_READY ? `<span class="g" data-c="${ch}"></span>` : ch;   // centred bitmap once ready, else text
    cells += `<span class="cell" style="background:oklch(0.74 0.15 ${hue})">${g}</span>`;

}
const PLATE_W = 5 * CELL_W;   // diversity bar max width = the 5-cell plate width, so bar and plate align
const lifeTier = life => life==null ? 0 : Math.min(3, Math.floor(life / (MAX_LIFESPAN/4)));   // avg lifespan -> 0..3 (quartiles of 0..40k)
const lifeCircles = life => '<span class="circ"></span>'.repeat(lifeTier(life));   // 0..3 green circles; none until first death
const crowHTML = (count, life) => `<span class="crow"><span class="n">${count}</span><span class="circs">${lifeCircles(life)}</span></span>`;
// diversity bar, INVERTED: 100 diversity -> 0 width, 0 diversity -> full plate width (converged species read as a long bar)
const dbarWidth = std => (100 - (std==null ? 100 : divPct(std))) / 100 * PLATE_W;
const dbarHTML = std => `<div class="dbar"><div class="dfill" style="width:${dbarWidth(std).toFixed(1)}px"></div></div>`;
// offscreen-gating: a scrolled-out mini must NOT render+blit for pixels nobody sees. IO flips el._miniVisible.
const miniObserver = speciesPanel ? new IntersectionObserver(
  es => { for (const e of es) e.target._srow._miniVisible = e.isIntersecting; }, { root: speciesPanel }) : null;
function makeRow(id){
  // Build the row's structure ONCE and update only changed bits (plate on sig-change, bar width, count, circles) in place.
  // Rebuilding innerHTML every frame would destroy the element mid-click (deaths/counts churn while running) -> can't expand.
  const el = document.createElement('div'); el.className = 'srow'; el.dataset.id = id;
  const info = document.createElement('div'); info.className = 'info';
  const plateHost = document.createElement('span'); plateHost.className = 'platehost';        // plate barcode (rebuilt on sig change)
  const dbar = document.createElement('div'); dbar.className = 'dbar';                          // diversity bar: BETWEEN plate and count
  const dfill = document.createElement('div'); dfill.className = 'dfill'; dbar.appendChild(dfill);
  const crow = document.createElement('span'); crow.className = 'crow';                         // count + lifespan circles
  const n = document.createElement('span'); n.className = 'n';

  crow.appendChild(n); crow.appendChild(circs);
  info.appendChild(plateHost); info.appendChild(dbar); info.appendChild(crow);                 // ORDER: plate, bar, count+circles
