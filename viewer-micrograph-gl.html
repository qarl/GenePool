// Toggle a row's live mini-viewer on POINTERDOWN (not click): the list re-sorts every frame while running, so a `click`
// (which needs press+release on compatible targets) can miss when the row moves -- pointerdown fires instantly at press,
// immune to the wobble. Reflect both directions immediately (responsive). Multi-expand: independent toggles.
if (speciesPanel){
  speciesPanel.addEventListener('pointerdown', e => {
    const row = e.target.closest('.srow'); if (!row) return;
    const id = +row.dataset.id; const el = rowMap.get(id);
    if (expanded.has(id)){ expanded.delete(id); if (el){ el.classList.remove('exp'); el._wrap.hidden = true; } }
    else { expanded.add(id); if (el){ el.classList.add('exp'); el._wrap.hidden = false; el._miniVisible = true; } }
  });
}
function updateSpeciesUI(){
  // whole-population: plate, then the diversity bar, then count + lifespan circles. Top-left of the main view.
  if (labMain && world) labMain.innerHTML = `${plateHTML(speciesModel.popSig)}${dbarHTML(speciesModel.popDivEMA)}${crowHTML(world.getLivingSwimbotCount(), speciesModel.popLifeEMA)}`;
  if (!speciesPanel) return;
  // The list is driven by the PERSISTENT lineages (`tracked`), NOT the per-frame `speciesList`: a lineage survives up to
  // 4 missed reclusters (tracked.delete at misses>4), so a 1-frame absence must NOT drop its row / collapse its viewer.
  const live = [...speciesModel.tracked.entries()];                 // [id, t]; t.count/t.sig hold last-known values during a miss
  const lifeKey = t => t.lifeEMA ?? speciesModel.popLifeEMA ?? (MAX_LIFESPAN/2);   // no-death-yet -> pop avg (else half the cap)
  live.sort((a, b) => b[1].count*lifeKey(b[1]) - a[1].count*lifeKey(a[1]));   // sort by population x avg-lifespan (wobbly)
  const want = new Set();
  for (const [id] of live) want.add(id);
  for (const [id, el] of rowMap) if (!want.has(id)){ if (el._wrap) miniObserver.unobserve(el._wrap); el.remove(); rowMap.delete(id); expanded.delete(id); }   // retired lineages
  for (const [id, t] of live){                          // create rows / refresh plate only when the signature changed
    let el = rowMap.get(id);
    if (!el){ el = makeRow(id); rowMap.set(id, el); }
    const exp = expanded.has(id);
    el.classList.toggle('exp', exp);                     // collapsed = info card; expanded = mini + info overlay
    el._wrap.hidden = !exp;
    if (el._sig !== t.sig){ el._plateHost.innerHTML = plateHTML(t.sig); el._sig = t.sig; }   // plate: only on signature change
    el._dfill.style.width = dbarWidth(t.divEMA).toFixed(1) + 'px';   // diversity bar (cheap style update, no DOM churn)
    el._n.textContent = t.count;
    const tier = lifeTier(t.lifeEMA);
    if (el._tier !== tier){ el._circs.innerHTML = lifeCircles(t.lifeEMA); el._tier = tier; }
  }
  for (let i = 0; i < live.length; i++){                // minimal-move reorder to the sorted order (no-op when unchanged)
    const el = rowMap.get(live[i][0]);
    if (speciesPanel.children[i] !== el) speciesPanel.insertBefore(el, speciesPanel.children[i] || null);
  }
}

// ================================================================== render
// Per-FRAME state, advanced ONCE per frame regardless of how many views render (main + species tiles). Hoisted out of
// renderView so detritus drift + death-fade bookkeeping don't advance 4x. See docs/PLAN-species-viewers.md.
function advanceFrame(){
  const clock = world ? world.getClock() : 0;
  hairTime = clock;
  // drift the floating detritus by ELAPSED SIM TICKS (dt) -> freezes on pause, scales with speed. modulo-wrap handles
  // any dt (a big jump at high speed / in the golden hook stays in-bounds).
  const dt = clock - lastJunkClock; lastJunkClock = clock;
  const nJunk = Math.floor(P.junk * MAX_JUNK);
  for (let i=0;i<nJunk;i++){ const j=junk[i]; j.x += j.vx*dt; j.y += j.vy*dt;
    j.x = ((j.x % P.pool) + P.pool) % P.pool; j.y = ((j.y % P.pool) + P.pool) % P.pool; }
  if (world){
    // death-fade bookkeeping: refresh refs from the live map, then fade the dead by elapsed SIM TICKS
    const nowClock = world.getClock();
    for (const [id, sb] of world._swimbots) known.set(id, sb);
    for (const [id, sb] of known){
      if (sb.getAlive()){
        // DECOMPOSE BEFORE DEATH: once a swimmer enters its old-age decline (the last OLD_AGE_DURATION ticks before
        // death) it thins/blurs while still ALIVE (and still twitching + slowing), reaching deathFadeFloor exactly at
        // death; it then dissolves the rest of the way post-death. Age-based -> only the genuinely dying decompose
        // (newborns/adults stay at 1); the engine's _timerDelta can't be used raw (it also dips at birth + when starving).
        const oldThresh = MAX_LIFESPAN - OLD_AGE_DURATION;
        const age = sb.getAge();
        const vit = age <= oldThresh ? 1 : Math.max(0, 1 - (age - oldThresh) / OLD_AGE_DURATION);
        fades.set(id, P.deathFadeFloor + (1 - P.deathFadeFloor) * vit);
        deathTick.delete(id); deathFade0.delete(id);
      } else {
        if (!deathTick.has(id)){ deathTick.set(id, nowClock); deathFade0.set(id, fades.get(id) ?? P.deathFadeFloor);   // fade level AT death -> continue from there
          // AVG LIFESPAN: this is the death moment (final age is frozen on the retained ref). Fold age-at-death into the
          // whole-population EMA + the nearest lineage's EMA (matched by junk, like the clustering gate). A fitness proxy.
          speciesModel.foldDeath(sb, sb.getAge());   // event-driven age-at-death fold (D9) -> pop + lineage lifespan EMAs
        }
        const f = (deathFade0.get(id) ?? 1) * (1 - (nowClock - deathTick.get(id)) / FADE_TICKS);
        if (f <= 0){ known.delete(id); fades.delete(id); deathTick.delete(id); deathFade0.delete(id); } else fades.set(id, f);
      }
    }
  }
}

// Render ONE view: a camera + viewport size into the pipeline -> screen. PURE per-view — reads the hoisted per-frame
// state (known/fades/junk positions), never mutates it. Sets cam/W/H for the view and RESTORES them (so build(),
// the wall, and the golden hook always see the canvas values). For the main view this is byte-identical to the old
// render(); species tiles will call it with a different cam + size.
function renderView(viewCam, vw, vh, set, regionX, regionY, drawWall = true, roundPx = 0, onlyBot = null){
  if (!gl) return;
  const _cam = cam, _W = W, _H = H;
  cam = viewCam; W = vw; H = vh;
  // this view's offscreen pipeline; same local names the body already uses, so the pipeline code is unchanged
  const { slabFBO, slabTex, hairFBO, hairTex, accA, accB, sceneFBO, sceneTex, bloomAFBO, bloomA, bloomBFBO, bloomB } = set;
  try {
  o = 0; ho = 0; hio = 0;
  hairGPU = (typeof window !== 'undefined' && window.__hairMode === 'gpu');   // read the hair mode ONCE per view
  // ---- tessellate every creature ONCE, bucketed into K depth slabs (sorted front->back); food joins the deepest slab
  const slabStart = new Array(K_SLABS).fill(0), segCount = new Array(K_SLABS).fill(0);   // segments (cyto/grain)
  const junkStart = new Array(K_SLABS).fill(0), junkCount = new Array(K_SLABS).fill(0);  // detritus + food (plain)
  const hairStart = new Array(K_SLABS).fill(0), hairCount = new Array(K_SLABS).fill(0);
  const hairInstStart = new Array(K_SLABS).fill(0), hairInstCount = new Array(K_SLABS).fill(0);   // GPU strip: per-slab instances
  const nJunk = Math.floor(P.junk * MAX_JUNK);
  if (world){
    const S = sc();
    const segs = [];
    const mW = W + 40, mH = H + 40;   // small viewport margin
    for (const [id, sb] of known){
      if (onlyBot && sb !== onlyBot) continue;                        // species tile: render ONLY the representative
      const ph = sb._phenotype; if (!ph || !ph.parts || ph.numParts <= 1) continue;
      const g = (sb._growthScale !== undefined) ? sb._growthScale : 1;
      // FRUSTUM CULL: skip any creature whose screen bounding box is fully off-view. The pool grows toward maxPopulation
      // (2000), and the whole pool was tessellated+drawn every frame regardless of zoom -> zoomed in with a grown pool was
      // slow even though only a few creatures are visible. Bound = farthest part from the swimmer centre (+ hair/cap slack).
      const c = sb.getPosition();
      let wr = 0; for (let q=1;q<ph.numParts;q++){ const dx=ph.parts[q].position.x-c.x, dy=ph.parts[q].position.y-c.y, d=dx*dx+dy*dy; if (d>wr) wr=d; }
      const rs = (Math.sqrt(wr) + 30) * S;   // screen bounding radius (+ slack for hairs/caps) -- CULL bound only
      const cs = toScreen(c.x, c.y);
      if (cs[0]+rs < -40 || cs[0]-rs > mW || cs[1]+rs < -40 || cs[1]-rs > mH) continue;   // off-screen -> skip
      // LOD is computed INSIDE buildSegs from the pose-independent path length (see there): dome-skip below lod 0.4, hairs
      // below 0.5, strip steps + dome resolution scale with lod. Domes are the dominant zoom-out cost (~half the geometry)
      // and invisible on tiny creatures, so at full zoom-out this is ~15x fewer triangles; detail returns as you zoom in.
      buildSegs(id, sb, ph, g, fades.get(id) ?? 1, S, segs);
    }
    segs.sort((a,b)=>a.slab-b.slab);
    let si = 0;
    for (let k=0;k<K_SLABS;k++){
      slabStart[k] = o/9; hairStart[k] = ho/3; hairInstStart[k] = hio/8;
      while (si<segs.length && segs[si].slab===k){ const s=segs[si]; tessSegment(s.sb, s.ph, s.p, s.g, s.S, s.v0, s.v1, s.fade, s.merge, s.lod); si++; }  // body -> buf, hairs -> hairBuf/hairInst
      segCount[k] = (o/9) - slabStart[k]; hairCount[k] = (ho/3) - hairStart[k]; hairInstCount[k] = (hio/8) - hairInstStart[k];
      // plain (no cyto/grain) stuff for this slab: floating detritus at this depth, + food in the deepest slab
      junkStart[k] = o/9;
      const S = sc();
      for (let i=0;i<nJunk;i++){ const j=junk[i]; if (j.slab!==k) continue; const [jx,jy]=toScreen(j.x,j.y); emitDisc(jx, jy, j.r*S, j.th*P.junkOpacity, j.tint, 0, 0); }
      if (k===K_SLABS-1){ for (const f of world._foodBits.values()){ if (f.getAlive()) tessFood(f); } }
      junkCount[k] = (o/9) - junkStart[k];
    }
  }
  gl.viewport(0, 0, W, H);
  gl.bindVertexArray(bodyVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, bodyVBO);
  gl.bufferData(gl.ARRAY_BUFFER, buf.subarray(0, o), gl.DYNAMIC_DRAW);   // upload all body slabs once
  gl.bindVertexArray(null);
  if (hairGPU){                                                         // GPU strip: upload the per-instance params once
    if (hio > 0){ gl.bindVertexArray(hairInstVAO); gl.bindBuffer(gl.ARRAY_BUFFER, hairInstVBO);
      gl.bufferData(gl.ARRAY_BUFFER, hairInst.subarray(0, hio), gl.DYNAMIC_DRAW); gl.bindVertexArray(null); }
  } else if (ho > 0){                                                    // CPU ribbons: upload all hair slabs once
    gl.bindVertexArray(hairVAO); gl.bindBuffer(gl.ARRAY_BUFFER, hairVBO);
    gl.bufferData(gl.ARRAY_BUFFER, hairBuf.subarray(0, ho), gl.DYNAMIC_DRAW);
    gl.bindVertexArray(null);
  }

  // ---- clear the FRONT accumulator (emitted=0, frontAbsorb=0); it seeds the front-to-back sweep ----
  let prev = accA, next = accB;
  gl.bindFramebuffer(gl.FRAMEBUFFER, prev.fbo);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);

  // ---- sweep slabs front -> back: render each slab's thickness, then fold it into the running composite ----
  for (let k=0;k<K_SLABS;k++){
    gl.bindFramebuffer(gl.FRAMEBUFFER, slabFBO);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND); gl.blendEquation(gl.FUNC_ADD); gl.blendFunc(gl.ONE, gl.ONE);
    gl.bindVertexArray(bodyVAO);
    if (segCount[k] > 0){   // creature segments -> cytoplasm + grain
      gl.useProgram(bodyProg); gl.uniform2f(uBodyRes, W, H);
      gl.uniform1f(uBodyCyto, P.cyto); gl.uniform1f(uBodyCells, P.cells); gl.uniform1f(uBodyLighten, P.lighten);
      gl.uniform1f(uBodyGrain, P.grain); gl.uniform1f(uBodyGrainScale, P.grainScale); gl.uniform1f(uBodySat, P.desat);
      gl.uniform1f(uBodyTime, hairTime); gl.uniform1f(uBodyCytoDrift, P.cytoDrift);
      gl.drawArrays(gl.TRIANGLES, slabStart[k], segCount[k]);
    }
    if (junkCount[k] > 0){   // detritus + food -> plain thickness discs (no cyto/grain)
      gl.useProgram(junkProg); gl.uniform2f(uJunkRes, W, H); gl.uniform1f(uJunkSoft, P.junkSoft);
      gl.drawArrays(gl.TRIANGLES, junkStart[k], junkCount[k]);
    }
    gl.bindVertexArray(null);
    gl.disable(gl.BLEND);
    // this slab's hairs -> hairTex (additive glow; the resolve then depth-attenuates it)
    gl.bindFramebuffer(gl.FRAMEBUFFER, hairFBO);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    if (P.hair > 0 && hairGPU && hairInstCount[k] > 0){   // GPU strip: one instanced draw of this slab's strands
      gl.useProgram(hairInstProg);
      gl.uniform2f(uHiRes, W, H); gl.uniform1i(uHiSegs, HAIR_SEGS); gl.uniform3f(uHiColor, 1.0, 1.0, 0.97); gl.uniform1f(uHiBright, P.hair);
      gl.enable(gl.BLEND); gl.blendEquation(gl.FUNC_ADD); gl.blendFunc(gl.ONE, gl.ONE);
      gl.bindVertexArray(hairInstVAO); gl.bindBuffer(gl.ARRAY_BUFFER, hairInstVBO);
      const base = hairInstStart[k] * 32;   // byteOffset for this slab (no baseInstance in WebGL2 -> rebind the pointers)
      gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 32, base + 0);   // divisor(0/1) already set once in initGL (VAO state)
      gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, base + 16);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, HAIR_SEGS * 2 + 2, hairInstCount[k]);
      gl.bindVertexArray(null); gl.disable(gl.BLEND);
    } else if (P.hair > 0 && hairCount[k] > 0){
      gl.useProgram(hairProg);
      gl.uniform2f(uHairRes, W, H); gl.uniform3f(uHairColor, 1.0, 1.0, 0.97); gl.uniform1f(uHairBright, P.hair);
      gl.enable(gl.BLEND); gl.blendEquation(gl.FUNC_ADD); gl.blendFunc(gl.ONE, gl.ONE);
      gl.bindVertexArray(hairVAO);
      gl.drawArrays(gl.TRIANGLES, hairStart[k], hairCount[k]);
      gl.bindVertexArray(null); gl.disable(gl.BLEND);
    }
    // resolve: prev accumulator + this slab (body + hairs) -> next accumulator
    gl.bindFramebuffer(gl.FRAMEBUFFER, next.fbo);
    gl.useProgram(resolveProg);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, slabTex);  gl.uniform1i(uR.uSlab, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, prev.out); gl.uniform1i(uR.uPrevOut, 1);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, prev.fa);  gl.uniform1i(uR.uPrevFA, 2);
    gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, hairTex);  gl.uniform1i(uR.uHairTex, 3);
    gl.uniform2f(uR.uRes, W, H); gl.uniform1f(uR.uField, P.field); gl.uniform1f(uR.uDensity, P.density);
    gl.uniform1f(uR.uOpacity, P.opacity); gl.uniform1f(uR.uRim, P.rim); gl.uniform1f(uR.uSub, P.subsurface);
    gl.uniform1f(uR.uScaleRatio, sc() / SC_REF);
    gl.bindVertexArray(emptyVAO); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.bindVertexArray(null);
    const tmp = prev; prev = next; next = tmp;   // prev now holds the just-written composite
  }

  // ---- final: backlight through all gel + accumulated emission -> sceneTex (so bloom can post-process it) ----
  gl.bindVertexArray(emptyVAO);
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO);
  gl.useProgram(finalProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, prev.out); gl.uniform1i(uF.uOut, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, prev.fa);  gl.uniform1i(uF.uFA, 1);
  gl.uniform2f(uF.uRes, W, H); gl.uniform1f(uF.uField, P.field);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // (hairs are folded into each slab's resolve above, so they depth-attenuate)

  // ---- bloom: bright-pass -> blur H -> blur V, then composite scene + bloom -> screen ----
  if (P.bloom > 0){
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomAFBO);
    gl.useProgram(brightProg); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.uniform1i(uBr.uScene, 0); gl.uniform1f(uBr.uThresh, P.bloomThresh); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.useProgram(blurProg);
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomBFBO); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, bloomA);
    gl.uniform1i(uBl.uTex, 0); gl.uniform2i(uBl.uDir, 3, 0); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomAFBO); gl.bindTexture(gl.TEXTURE_2D, bloomB);
    gl.uniform2i(uBl.uDir, 0, 3); gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  // ---- COMPOSITE this view into its REGION of the canvas (viewport = region; uOrigin maps fragcoord -> view texels) ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(regionX, regionY, W, H);
  gl.useProgram(postProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneTex); gl.uniform1i(uPo.uScene, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomA);   gl.uniform1i(uPo.uBloom, 1);
  gl.uniform1f(uPo.uStrength, P.bloom);   // 0 => bloom (possibly stale) contributes nothing
  gl.uniform2i(uPo.uOrigin, regionX, regionY);
  gl.uniform2f(uPo.uViewSize, W, H); gl.uniform1f(uPo.uRound, roundPx);   // rounded corners (same radius on every view)
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindVertexArray(null);

  // ---- wall marking the world boundary: a FIXED-WORLD-THICKNESS frame drawn ENTIRELY OUTSIDE the play area (never
  //      covers it), so it scales with zoom -- ~5px when the whole pool fits (zoom 1) and thicker as you zoom in. ----
  //      SKIPPED for tiles: at tile zoom the wall is huge (thick*zoom) and its darkening quads blacken a tile whose
  //      specimen sits near a pool edge. Tiles are interior close-ups; the boundary isn't meaningful there.
  if (drawWall) {
    const T = P.wallThick * cam.zoom;   // wall thickness (screen px): P.wallThick at zoom 1, scales with zoom
    const a = toScreen(0,0), c = toScreen(P.pool, P.pool);
    const x0=Math.min(a[0],c[0]), x1=Math.max(a[0],c[0]), y0=Math.min(a[1],c[1]), y1=Math.max(a[1],c[1]);
    const R=(rx0,ry0,rx1,ry1)=>[rx0,ry0, rx1,ry0, rx1,ry1,  rx0,ry0, rx1,ry1, rx0,ry1];
    gl.useProgram(boxProg); gl.uniform2f(uBoxRes, W, H);
    gl.enable(gl.BLEND); gl.blendEquation(gl.FUNC_ADD); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindVertexArray(boxVAO); gl.bindBuffer(gl.ARRAY_BUFFER, boxVBO);
    // 1) DARKEN everything outside the wall's outer edge (semi-transparent black; clipped to the canvas). Four quads that
    //    tile the outside region without overlap, so the alpha darkening is even (no double-darkened seams).
    if (P.wallDark > 0){
      const ox0=x0-T, oy0=y0-T, ox1=x1+T, oy1=y1+T;
      const dv = new Float32Array([
        ...R(0, 0,   W,   oy0),   // above the wall
        ...R(0, oy1, W,   H),     // below
        ...R(0, oy0, ox0, oy1),   // left
        ...R(ox1, oy0, W, oy1),   // right
      ]);
      gl.uniform4f(uBoxColor, 0, 0, 0, P.wallDark);
      gl.bufferData(gl.ARRAY_BUFFER, dv, gl.DYNAMIC_DRAW);
      gl.drawArrays(gl.TRIANGLES, 0, dv.length/2);
    }
    // 2) the WALL frame itself (opaque black), just OUTSIDE the play area [x0,x1]x[y0,y1] -- never covers the interior
    const bv = new Float32Array([
      ...R(x0-T, y0-T, x1+T, y0),   // top
      ...R(x0-T, y1,   x1+T, y1+T), // bottom
      ...R(x0-T, y0,   x0,   y1),   // left
      ...R(x1,   y0,   x1+T, y1),   // right
    ]);
    gl.uniform4f(uBoxColor, 0, 0, 0, 1.0);
    gl.bufferData(gl.ARRAY_BUFFER, bv, gl.DYNAMIC_DRAW);
    gl.drawArrays(gl.TRIANGLES, 0, bv.length/2);
    gl.bindVertexArray(null); gl.disable(gl.BLEND);
  }
  } finally { cam = _cam; W = _W; H = _H; }   // restore the active view to the canvas view
}

// The whole frame: advance per-frame state once, clear the canvas, then render the main view into the left 768^2.
// (Species tiles render into the right 256-wide column next — step 3.)
function render(){
  if (!gl) return;
  hairsEmitted = 0;   // count strands drawn this frame (FPS HUD + __bench perf metric)
  advanceFrame();
  if (world && (frameCount % SPECIES_RECOMPUTE) === 0){ speciesModel.recompute(world._swimbots.values()); updateSpeciesUI(); }   // recluster + refresh the list
  frameCount++;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, CANVAS_W, CANVAS_H);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);          // clear regions not covered by a view
  // EXPANDED species minis: render each into the (0,0,256,256) scratch corner and blit (drawImage, GPU-side, no readback
  // stall) into its DOM canvas -- BEFORE main, so main's full-768 render overpaints the corner. Offscreen-gated + a
  // per-frame budget (round-robin) so many open viewers can't blow the frame; a species in a miss (absent from
  // speciesById but still tracked) freezes its last mini frame.
  if (expanded.size){
    const vis = [];
    for (const id of expanded){ const el = rowMap.get(id); if (el && el._miniVisible) vis.push(id); }
    const n = Math.min(vis.length, MINI_BUDGET);
    for (let k = 0; k < n; k++){
      const id = vis[(miniCursor + k) % vis.length];
      const r = speciesModel.speciesById.get(id); if (!r || !r.t) continue;        // miss -> freeze last frame
      const rep = r.t.rep; if (!rep || !rep.getAlive()) continue;     // stable specimen (re-established in computeSpecies)
      const c = rep.getPosition();
      renderView({ x: c.x, y: c.y, zoom: TILE_ZOOM }, VIEW_SMALL, VIEW_SMALL, smallSet, 0, 0, false, 0, rep);
      const el = rowMap.get(id);
      if (el && el._miniCtx) el._miniCtx.drawImage(cv, 0, CANVAS_H - VIEW_SMALL, VIEW_SMALL, VIEW_SMALL, 0, 0, VIEW_SMALL, VIEW_SMALL);
    }
    if (vis.length) miniCursor = (miniCursor + n) % vis.length;
  }
  renderView(cam, mainW, mainH, mainSet, 0, 0, true, mainRound);   // main micrograph LAST (fills the window on desktop); overpaints the scratch corner
}

let loopStopped = false;   // golden capture stops the rAF loop ENTIRELY (running only gates ticks, not render)
// debug FPS/hair HUD: smoothed real frame-rate from rAF deltas (DOM overlay, canvas-golden-safe). In the desktop app it
// also logs to the console every ~2s so I can read the REAL-GPU frame-rate from main's forwarded log (not just Karl's eyes).
const fpsHud = document.getElementById('fpsHud');
let _fpsPrev = 0, _fpsEMA = 0, _fpsLogT = 0;
function tickFPS(){
  const now = performance.now();
  if (_fpsPrev){ const f = 1000 / Math.max(0.001, now - _fpsPrev); _fpsEMA = _fpsEMA ? _fpsEMA * 0.9 + f * 0.1 : f; }
  _fpsPrev = now;
  const pop = world ? world.getLivingSwimbotCount() : 0;
  if (fpsHud) fpsHud.textContent = `${_fpsEMA.toFixed(0)} fps · ${hairsEmitted} hairs · ${pop} pop`;
  if (window.pool && now - _fpsLogT > 2000){ _fpsLogT = now; console.info(`[fps] ${_fpsEMA.toFixed(1)} fps  hairs=${hairsEmitted}  pop=${pop}`); }
}

function loop(){
  if (loopStopped) return;
  if (running && world){ for (let i=0;i<ticksPerFrame;i++) world.tick(); }
  if (recording && recBuf.length && window.pool){ window.pool.record(recBuf); recBuf = []; }   // flush this frame's events to the recorder
  render();
  tickFPS();
  requestAnimationFrame(loop);
}

// ================================================================== controls
document.getElementById('play').onclick = (e)=>{ running=!running; e.target.textContent = running?'Pause':'Play'; };
document.getElementById('reset').onclick = ()=>{ seed++; build(); };
document.getElementById('seedIn').onchange = (e)=>{ const v=parseInt(e.target.value,10); seed=Number.isFinite(v)&&v>=0?v:0; build(); };
const speed=document.getElementById('speed'); speed.oninput=()=>{ ticksPerFrame=+speed.value; document.getElementById('speedv').textContent=ticksPerFrame+'×'; };
cv.addEventListener('wheel', (e)=>{ e.preventDefault(); const f=Math.exp(-e.deltaY*0.0015); cam.zoom=Math.max(0.5, Math.min(60, cam.zoom*f)); }, {passive:false});
let dragging=false, lastX=0, lastY=0;
cv.addEventListener('mousedown', (e)=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; cv.classList.add('drag'); });
window.addEventListener('mouseup', ()=>{ dragging=false; cv.classList.remove('drag'); });
window.addEventListener('mousemove', (e)=>{ if(!dragging) return; const s=sc(); cam.x -= (e.clientX-lastX)/s; cam.y -= (e.clientY-lastY)/s; lastX=e.clientX; lastY=e.clientY; });


// ---- deterministic golden-capture hook (INERT unless called; see docs/PLAN-visual-goldens.md) ----
// Stops the rAF loop, rebuilds at a fixed seed, advances/renders a fixed amount, returns raw default-framebuffer RGBA.
// The render is a pure function of (seed, ticks, frames, opts); no wall-clock/random/DPR anywhere.
//   camOv  = {x?,y?,zoom?,focus?}  pick a view (focus:'biggest' centres on the largest grown living specimen).
//   opts.interleave = N > 0  => advance N ticks BETWEEN renders (tick N, render, repeat) so the death-fade path
//     (deathTick/fades, updated inside render()) actually populates — a plain ticks-then-render never exercises it.
// Returns {w,h,b64, thickFmt:'RGBA16F'|'RGBA8', floatRT, fading} (fading = count of mid-fade dead ghosts in-frame).
window.__golden = function(s, ticks, frames, camOv, opts){
  opts = opts || {};
  loopStopped = true; running = false;
  seed = (s>>>0); cam.zoom = 6; build();
  gl.disable(gl.DITHER);
  const applyCam = () => {
    if (!camOv) return;
    cam = { x: camOv.x ?? P.pool/2, y: camOv.y ?? P.pool/2, zoom: camOv.zoom ?? 6 };
    if (camOv.focus === 'biggest' && world){      // centre on the largest grown living specimen (most grain to judge)
      let best=null, bestR=-1;
      for (const [id, sb] of world._swimbots){
        if (!sb.getAlive()) continue;
        const ph = sb._phenotype; if (!ph || ph.numParts <= 1) continue;
        if ((sb._growthScale ?? 1) < 0.9) continue;
        const c = sb.getPosition(); let wr=0;
        for (let q=1;q<ph.numParts;q++){ const dx=ph.parts[q].position.x-c.x, dy=ph.parts[q].position.y-c.y, d=dx*dx+dy*dy; if (d>wr) wr=d; }
        if (wr > bestR){ bestR=wr; best=c; }
      }
      if (best){ cam.x = best.x; cam.y = best.y; }
    }
  };
  const T = ticks|0, every = opts.interleave|0;
  if (every > 0){                                 // interleaved tick->render (exercises death-fade)
    applyCam();                                   // static cam across the interleave
    let done = 0;
    while (done < T){ const step = Math.min(every, T - done); for (let i=0;i<step;i++) world.tick(); done += step; render(); }
    if (T === 0) render();
  } else {
    for (let i=0; i<T; i++) world.tick();
    applyCam();                                   // apply AFTER ticks so focus sees settled positions
    for (let f=0; f<Math.max(1, frames|0); f++) render();
  }
  let fading = 0; for (const v of fades.values()) if (v > 0 && v < 1) fading++;
  const w = cv.width, h = cv.height, px = new Uint8Array(w*h*4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let str=''; for (let i=0;i<px.length;i+=8192) str += String.fromCharCode.apply(null, px.subarray(i, i+8192));
  const floatRT = !!(thickFmt && thickFmt.internal === gl.RGBA16F);
  const species = speciesModel.speciesList.slice(0,4).map(r => ({ n: r.count, sig: r.t ? r.t.sig : null,
    alive: !!(r.t && r.t.rep && r.t.rep.getAlive()) }));
  // opts.mini: also capture the largest species' 256^2 mini-viewer (the small-view render path the list expands into),
  // via the SAME (0,0,256,256) scratch corner the live blit uses. Done AFTER the main readPixels (it overwrites the corner).
  let mini = null; const bigR = speciesModel.speciesList.find(r => r.t && r.t.rep && r.t.rep.getAlive());
  if (opts.mini && bigR){
    const c = bigR.t.rep.getPosition();
    renderView({ x: c.x, y: c.y, zoom: TILE_ZOOM }, VIEW_SMALL, VIEW_SMALL, smallSet, 0, 0, false, 0, bigR.t.rep);
    const mp = new Uint8Array(VIEW_SMALL*VIEW_SMALL*4);
    gl.readPixels(0, 0, VIEW_SMALL, VIEW_SMALL, gl.RGBA, gl.UNSIGNED_BYTE, mp);
    let ms=''; for (let i=0;i<mp.length;i+=8192) ms += String.fromCharCode.apply(null, mp.subarray(i, i+8192));
    mini = btoa(ms);
  }
  return { w, h, b64: btoa(str), thickFmt: floatRT ? 'RGBA16F' : 'RGBA8', floatRT, fading, species,
           mini, miniW: VIEW_SMALL, miniH: VIEW_SMALL };
};

// ---- perf benchmark hook (INERT unless called; performance.now is MEASUREMENT only -> never touches render output) ----
// Builds a fixed scene, then renders it `frames` times (no ticks between -> constant frame) and returns per-frame ms.
// junkFrac optionally overrides P.junk for an A/B of the detritus load. gl.finish() after each render so SwiftShader's
// (CPU) work is actually complete before we stop the clock.
window.__bench = function(s, ticks, camOv, frames, junkFrac){
  loopStopped = true; running = false;
  seed = (s>>>0); cam.zoom = 6; build();
  gl.disable(gl.DITHER);
  for (let i=0; i<(ticks|0); i++) world.tick();
  if (camOv) cam = { x: camOv.x ?? P.pool/2, y: camOv.y ?? P.pool/2, zoom: camOv.zoom ?? 6 };
  const _junk = P.junk; if (junkFrac !== undefined && junkFrac !== null) P.junk = junkFrac;
  const N = Math.max(1, frames|0);
  render(); gl.finish();                                        // warm-up: shader compile / buffer upload / first recluster
  const t = new Array(N), tc = new Array(N);                    // total (incl. gl.finish) + CPU-only (before gl.finish)
  for (let f=0; f<N; f++){ const t0 = performance.now(); render(); const t1 = performance.now(); gl.finish(); t[f] = performance.now() - t0; tc[f] = t1 - t0; }
  const nJunk = Math.floor(P.junk * MAX_JUNK), nHairs = hairsEmitted;   // detritus + strands drawn during the timed renders
  P.junk = _junk;
  const med = (a) => { const s = a.slice().sort((x,y)=>x-y); return s[s.length>>1]; };
  t.sort((a,b)=>a-b);
  const sum = t.reduce((a,b)=>a+b,0);
  const cpuMed = med(tc);
  // tCPU = JS emit/submit (on SwiftShader ~ the CPU-side cost we optimize); tGPU = the gl.finish() delta (SwiftShader
  // software raster -> a PESSIMISTIC proxy, not real-GPU). See perf.mjs / the hair plan P3.
  return { frames:N, median:t[N>>1], mean:sum/N, min:t[0], p90:t[Math.min(N-1, Math.floor(N*0.9))],
           cpuMedian: cpuMed, gpuMedian: t[N>>1] - cpuMed, nHairs,
           living: world.getLivingSwimbotCount(), nJunk, zoom: cam.zoom };
};

// Zoom-sweep A/B bench (real-GPU when run in the desktop app; SwiftShader is misleading for the GPU strip). Runs
// __bench at several zooms x {cpu ribbons, gpu strip}, logs a [bench] table -> main forwards it -> I read the numbers
// myself. Trigger: ?zoombench on the URL (desktop main.mjs adds it when GP_BENCH=1). Uses focus:'biggest' so hairs frame.
function benchZooms(){
  const TICKS = 30000, FRAMES = 30;   // grown pool -> realistic hair counts (esp. whole-pool zoom-out)
  // whole-pool (no focus) at low zoom = ALL creatures + hairs, no cull -> the full-zoom-out case; focus:'biggest' zooms in.
  const cases = [
    { z: 1, focus: false }, { z: 2, focus: false }, { z: 4, focus: false },   // full/near zoom-out (max hairs)
    { z: 8, focus: true }, { z: 20, focus: true }, { z: 50, focus: true },     // zoomed in on the biggest specimen
  ];
  console.warn('[bench] zoom(view) |  cpu-ribbons ms (fps) |  gpu-strip ms (fps) | delta | hairs | living');
  for (const c of cases){
    const cam = c.focus ? { zoom: c.z, focus: 'biggest' } : { zoom: c.z };
    const res = {};
    for (const mode of ['cpu', 'gpu']){ window.__hairMode = mode; res[mode] = window.__bench(1, TICKS, cam, FRAMES); }
    const cp = res.cpu, gp = res.gpu, d = (gp.median - cp.median) / cp.median * 100;
    const tag = (c.focus ? 'z' : 'W') + String(c.z);   // W = whole-pool, z = focus-biggest
    console.warn(`[bench] ${tag.padStart(4)} | ${cp.median.toFixed(1).padStart(7)} (${(1000/cp.median).toFixed(0).padStart(3)}fps) | ${gp.median.toFixed(1).padStart(7)} (${(1000/gp.median).toFixed(0).padStart(3)}fps) | ${(d>=0?'+':'')}${d.toFixed(0)}% | ${cp.nHairs} | ${cp.living}`);
  }
  console.warn('[bench] done');
}
try { if (typeof window !== 'undefined' && new URLSearchParams(location.search).has('zoombench')) setTimeout(benchZooms, 300); } catch {}

// ================================================================== scrub / playback (desktop only)
// The browser keeps the live loop above. In the Electron app a utilityProcess GENERATES the seed's run (real Node,
// same V8 -> D1) and main serves it read-only over IPC (window.pool.scrub). A tick is DECODED by restoring the nearest
// keyframe (drag = snap, no re-sim) and, while playing, ticking that restored world forward -- deterministic, so it
// stays in lockstep with the generator. Time is shown mm:ss (never ticks).
const TICKS_PER_SECOND = 60;   // 1x speed = real-time
// adaptive sim-time: mm:ss under an hour, h:mm:ss under a day, "Nd hh:mm:ss" beyond (unbounded runs reach days).
const _p2 = n => String(n).padStart(2, '0');
const timeUnits = t => { const s = Math.max(0, Math.floor((t || 0) / TICKS_PER_SECOND)); return s >= 86400 ? 3 : s >= 3600 ? 2 : 1; };
function fmtTime(t, units = timeUnits(t)) {
  let s = Math.max(0, Math.floor((t || 0) / TICKS_PER_SECOND));
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  if (units >= 3) return `${d}d ${_p2(h)}:${_p2(m)}:${_p2(s)}`;
  if (units >= 2) return `${h}:${_p2(m)}:${_p2(s)}`;
  return `${_p2(m)}:${_p2(s)}`;
}
function resetOverlays(clock = 0){ known.clear(); fades.clear(); deathTick.clear(); deathFade0.clear(); lastJunkClock = clock; speciesModel = createSpeciesAnalyzer(); }

function startPlayback(){
  document.body.classList.add('desktop');            // fill-the-window layout (browser keeps the fixed 768 layout -> goldens unchanged)
  document.querySelector('header').hidden = true;    // drop the top-of-screen UI entirely (Karl); everything lives in the bottom bar
  document.getElementById('scrubbar').hidden = false;
  // (main view keeps VIEW_ROUND rounded corners, matching the canvas border-radius below)

  const $seed = document.getElementById('sbSeed'), $slider = document.getElementById('sbSlider'), $time = document.getElementById('sbTime');
  const speedBtns = [...document.querySelectorAll('#sbSpeeds .sbSpeed')];
  let cfg = null, head = 0, frontier = 0, playing = false, dragging = false, snapInFlight = false, snapPending = null;

  function updateBar(){
    if (!dragging){ $slider.max = Math.max(0, frontier); $slider.value = head; }
    { const u = timeUnits(frontier); $time.textContent = `${fmtTime(head, u)} / ${fmtTime(frontier, u)}`; }
    // highlight the active speed while playing (2^N == ticksPerFrame); nothing highlighted when paused
    for (const b of speedBtns) b.classList.toggle('active', playing && ticksPerFrame === (1 << (+b.dataset.n)));
  }
  // drag-snap: restore the nearest keyframe <= t (no re-sim). Coalesce to the latest target while one is in flight.
  async function snapTo(t){
    if (!cfg) return;
    t = Math.max(0, Math.min(t, frontier));
    if (snapInFlight){ snapPending = t; return; }
    snapInFlight = true;
    const kf = await window.pool.scrub.keyframe(t);
    snapInFlight = false;
    if (kf){ world = World.restore(cfg, kf.snapshot); head = kf.tick; resetOverlays(head); render(); updateBar(); }
    if (snapPending != null){ const p = snapPending; snapPending = null; snapTo(p); }
  }
  async function selectSeed(sd){
    playing = false;
    const r = await window.pool.scrub.select(sd >>> 0);
    if (!r || !r.ok){ document.getElementById('err').textContent = 'run failed: ' + ((r && r.error) || '?'); return; }
    document.getElementById('err').textContent = '';
    cfg = r.runConfig.config; frontier = r.frontier; head = 0;
    seedJunk(mulberry32((sd >>> 0) ^ 0x5eed1234));   // detritus pool (cosmetic; build() normally does this)
    await snapTo(0);
  }

  window.pool.scrub.onFrontier(t => { frontier = Math.max(frontier, t); if (!dragging) updateBar(); });
  // 4 fast-forward buttons: each plays at 2^N x real-time (1x, 2x, 4x, 8x); clicking the ACTIVE speed pauses.
  for (const b of speedBtns) b.onclick = () => {
    const tpf = 1 << (+b.dataset.n);
    if (playing && ticksPerFrame === tpf) playing = false;          // click the playing speed -> pause
    else { ticksPerFrame = tpf; playing = true; }
    updateBar();
  };
  // seed +/- : step to the previous/next seed (and load/generate its run)
  $seed.onchange = () => { const v = parseInt($seed.value, 10); if (Number.isFinite(v) && v >= 0) selectSeed(v); };   // native number-input arrows fire this
  // scrubbing does NOT pause: keep `playing` as-is while dragging (loop holds via !dragging), so releasing resumes -> "takes off" (Karl)
  $slider.oninput = () => { dragging = true; head = +$slider.value; const u = timeUnits(frontier); $time.textContent = `${fmtTime(head, u)} / ${fmtTime(frontier, u)}`; snapTo(head); };
  $slider.onchange = () => { dragging = false; snapTo(+$slider.value); };

  function playbackLoop(){
    if (loopStopped) return;
    if (playing && world && !dragging && head < frontier){
      const step = Math.min(ticksPerFrame, frontier - head);
      for (let i = 0; i < step; i++) world.tick();
      head += step;
    }
    render(); updateBar(); tickFPS();
    requestAnimationFrame(playbackLoop);
  }
  ticksPerFrame = 1;   // default 1x; playback starts paused until a speed button is pressed
  seedJunk(mulberry32((+$seed.value >>> 0) ^ 0x5eed1234));   // seed detritus BEFORE any render (loop + resizeMain both render)
  resizeMain();                                              // size the main view to FILL the window (safe: junk seeded, world may be null)
  window.addEventListener('resize', resizeMain);            // keep filling when the window is resized
  selectSeed(+$seed.value);
  requestAnimationFrame(playbackLoop);
}

function boot(){
  if (!gl) return;
  initGL();
  let bench = false; try { bench = new URLSearchParams(location.search).has('zoombench'); } catch {}
  if (bench){ /* ?zoombench: benchZooms runs via its own setTimeout; do NOT start playback (it would collide + freeze) */ }
  else if (window.pool && window.pool.scrub){ startPlayback(); }     // desktop: generate-then-scrub player
  else { build(); requestAnimationFrame(loop); }                     // browser: live loop (unchanged)
}
boot();
</script>
</body>
