<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GenePool — micrograph (GL)</title>
<style>
  @font-face { font-family: 'OCR A'; src: url('fonts/OCRA.ttf') format('truetype'); font-display: swap; }   /* self-hosted, GPL/free */
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0e13; color: #cfd6e0; font: 13px/1.5 system-ui, sans-serif; }
  header { padding: 8px 14px; background: #11161f; border-bottom: 1px solid #1e2733; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 8px; }
  h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; letter-spacing: .02em; }
  label { display: inline-flex; gap: 6px; align-items: center; user-select: none; font-size: 12px; }
  button { background: #1c2836; color: #cfd6e0; border: 1px solid #2b3a4d; border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  button:hover { background: #24344a; }
  input[type=number] { width: 66px; background: #0b0e13; color: #cfd6e0; border: 1px solid #2b3a4d; border-radius: 6px; padding: 3px 6px; }
  .hud { margin-left: auto; font-variant-numeric: tabular-nums; color: #8fa0b5; }
  .hud b { color: #cfd6e0; font-weight: 600; }
  .params { color: #8fa0b5; }
  #err { color: #ff8f8f; }
  #wrap { display: flex; justify-content: center; padding: 14px; }
  #stage { position: relative; line-height: 0; }
  canvas { border-radius: 12px; box-shadow: 0 6px 30px rgba(0,0,0,.5); cursor: grab; touch-action: none; }
  canvas.drag { cursor: grabbing; }
  /* species-tile count labels: HTML overlay over the right column (NOT drawn into the canvas, so goldens stay text-free) */
  /* science-lab label: black, no shadow, technical monospace (IBM Plex Mono) -> reads like specimen data */
  .tileLabel { position: absolute; right: 12px; text-align: right; pointer-events: none; line-height: 1.25;
    color: #000; font-family: "OCR A", ui-monospace, "SF Mono", Menlo, monospace; }
  .tileLabel .n { display: block; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tileLabel .sig { font-size: 12px; font-weight: 500; letter-spacing: 2px; }
  #lab0 { top: 12px; } #lab1 { top: calc(33.333% + 12px); } #lab2 { top: calc(66.666% + 12px); }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>GenePool · micrograph <span style="color:#5c6b80">· WebGL2</span></h1>
    <button id="play">Pause</button>
    <button id="reset">Reset</button>
    <label>Seed <input id="seedIn" type="number" min="0" step="1" value="1"></label>
    <label>Speed <input id="speed" type="range" min="1" max="60" value="3"> <span id="speedv">3×</span></label>
  </div>
  <div class="row"><span id="err"></span> <span style="color:#5c6b80">scroll = zoom · drag = pan</span></div>
</header>
<div id="wrap"><div id="stage"><canvas id="cv" width="1024" height="768"></canvas>
  <div class="tileLabel" id="lab0"></div><div class="tileLabel" id="lab1"></div><div class="tileLabel" id="lab2"></div>
</div></div>

<script type="module">
import { World } from './engine/world.js';
import { Genotype } from './engine/genotype.js';

const NUM_GENES = 256, USED = 112, YOUNG_AGE = 1000, MAX_LIFESPAN = 40000, EGG_SIZE = 5, SPLINE = 0.4;
const cv = document.getElementById('cv');
const CANVAS_W = cv.width, CANVAS_H = cv.height;   // true backing-store size (1024x768), never changes
const VIEW_MAIN = 768, VIEW_SMALL = 256;           // main micrograph = 768^2 (left); three species tiles = 256^2 (right column)
const VIEW_ROUND = 12;                              // corner radius (px) — SAME on every view (main + tiles)
let W = cv.width, H = cv.height;                    // ACTIVE view size — renderView sets this per view, then restores
const errEl = document.getElementById('err');

function mulberry32(seed){let a=seed>>>0;return()=>{a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function diskPoint(rng, cx, cy, r){ const rad = 2*Math.PI*rng(); const mag = r*Math.sqrt(rng()); return { x: cx + Math.cos(rad)*mag, y: cy + Math.sin(rad)*mag }; }
const lerp=(a,b,t)=>a+(b-a)*t, mid=(a,b)=>[(a[0]+b[0])*0.5,(a[1]+b[1])*0.5];
const lerp3=(a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const smoothstep=(a,b,x)=>{ const t=Math.max(0,Math.min(1,(x-a)/(b-a))); return t*t*(3-2*t); };
function bez(a,b,c,d,t){ const m=1-t, m2=m*m, t2=t*t; const w0=m2*m,w1=3*m2*t,w2=3*m*t2,w3=t2*t;
  return [ w0*a[0]+w1*b[0]+w2*c[0]+w3*d[0], w0*a[1]+w1*b[1]+w2*c[1]+w3*d[1] ]; }

// ------------------------------------------------------------------ live look/params
const P = {
  pool: 3000, n: 220, food: 700,
  // --- defaults baked from Karl's tuned "Save Defaults" (2026-09-02); the live slider panel + runtime file were removed ---
  field: 0.68,      // condenser backlight brightness (0..1)
  density: 0.45,    // tinted (Beer-Lambert) absorption scale -- how strongly the gel eats its complementary colour
  opacity: 0.05,    // flat colourless absorption -- milky/opaque even for pale gel (independent of tint)
  lighten: 0.7,     // mix segment pigment toward white -> less tinted absorption, brighter specimen
  desat: 0.75,      // desaturate the rendered body colour toward grey (render only; hair/cyto/grain stay raw)
  rim: 1.05,        // refractive Becke-line rim strength
  subsurface: 0.6,  // how much the gel re-emits its own tint
  cyto: 0.25,       // cytoplasm: strength of the cellular density spots
  cells: 0.3,       // cytoplasm: cell frequency (bigger = smaller, denser spots)
  cytoDrift: 0.02,  // cytoplasm: gentle streaming speed (world units of drift per sim tick; 0 = static)
  grain: 0.25,      // grain: fine density speckle strength (driven by the blue component)
  grainScale: 2.0,  // grain fineness (bigger = finer)
  junk: 1.0,        // floating detritus amount (0..1 of the seeded pool)
  junkOpacity: 0.3, // detritus density/darkness
  junkSoft: 3.0,    // detritus edge softness (0.5 = sharp, higher = soft/out-of-focus)
  hair: 0.15,       // hairs: glow brightness (0 = off)
  hairLen: 4,       // hair length (world units)
  hairSpace: 1,     // spacing between hairs along the perimeter (world units; smaller = denser)
  hairWid: 0.35,    // hair strand thickness (world units at the root)
  hairSway: 0.8,    // hair beat amplitude (radians of tip deflection)
  hairBeat: 0.06,   // beat speed (per sim tick)
  hairWave: 0.12,   // metachronal wavelength along the body (per world arc-unit)
  hairDrag: 1.0,    // how much the hairs trail/bend from the part's motion through the water
  hairLenJit: 0.35, // per-hair random LENGTH variation (fraction, +/-): each strand a bit longer/shorter
  hairAngJit: 0.30, // per-hair random ANGLE offset (radians, +/-): each strand splays a bit differently
  hairGrow: 0.38,   // growth fraction at which hairs start appearing (baby-hair gate; ramps to full ~0.4 above it)
  bloom: 0.2,       // full-image bloom strength (0 = off)
  bloomThresh: 0,   // brightness above which pixels bloom
  deathBlur: 2.5,   // soft-focus blur on dying swimmers (edge-feather exponent added as they fade out)
  deathFadeFloor: 0.45, // decompose BEGINS before death: a dying swimmer (aging/starving) fades toward this while still
                        // alive & twitching, reaching it at the moment of death, then dissolves the rest of the way to 0
  wallThick: 11,    // world-boundary wall thickness (screen px at zoom 1; scales with zoom)
  wallDark: 0.2,    // darkening of the region OUTSIDE the wall (0 = none .. 1 = black)
  hairFade: 0.1,    // LOD hair fade-out band width (larger = hairs fade over a wider zoom range = gentler)
};

let seed = 1, world = null, running = true, ticksPerFrame = 3;
let cam = { x: P.pool/2, y: P.pool/2, zoom: 6 };
function fitZoom(){ return Math.min(W, H) / P.pool; }
function sc(){ return fitZoom() * cam.zoom; }
let SC_REF = (VIEW_MAIN / P.pool) * 6;   // reference scale (main view @ default zoom) -> rim brightness normalized to it; reset in build()
function toScreen(wx, wy){ const s = sc(); return [ (wx - cam.x)*s + W/2, (wy - cam.y)*s + H/2 ]; }

// ================================================================== WebGL2 setup
const gl = cv.getContext('webgl2', { antialias:false, premultipliedAlpha:false, alpha:false });
if (!gl){ errEl.textContent = 'WebGL2 not available in this browser.'; }

// half-float render target so thickness can accumulate past 1.0 (additive). iOS-safe: 16F + core blend (no float-blend ext).
let thickFmt = null;
if (gl){
  if (gl.getExtension('EXT_color_buffer_float')) thickFmt = { internal: gl.RGBA16F, type: gl.HALF_FLOAT };
  else if (gl.getExtension('EXT_color_buffer_half_float')) thickFmt = { internal: gl.RGBA16F, type: gl.HALF_FLOAT };
  else thickFmt = { internal: gl.RGBA8, type: gl.UNSIGNED_BYTE }; // fallback: thickness clips at 1 (degraded, still renders)
}

function makeShader(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)){ const log = gl.getShaderInfoLog(s); console.error('[shader]', log, '\n', src); errEl.textContent = 'Shader error: '+log; }
  return s;
}
function makeProgram(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, makeShader(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, makeShader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)){ const log = gl.getProgramInfoLog(p); console.error('[link]', log); errEl.textContent = 'Link error: '+log; }
  return p;
}

// --- body pass: tessellated segment geometry -> half-float thickness buffer (additive) ---
const BODY_VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;   // screen pixels
layout(location=1) in float aCU;   // profile coord across the segment: -1 edge .. 0 spine .. +1 edge
layout(location=2) in float aRad;  // local half-width (world units) = thickness radius at the spine
layout(location=4) in float aV;    // arc-length ALONG the body (world units) -- the other axis of body-space
layout(location=3) in vec3 aTint;  // gel pigment 0..1
layout(location=5) in float aBlur; // death soft-focus amount (0 alive -> higher as it dies)
uniform vec2 uRes;
out float vCU; out float vRad; out float vV; out vec3 vTint; out float vBlur;
void main(){
  vCU = aCU; vRad = aRad; vV = aV; vTint = aTint; vBlur = aBlur;
  vec2 clip = vec2(aPos.x / uRes.x * 2.0 - 1.0, 1.0 - aPos.y / uRes.y * 2.0);
  gl_Position = vec4(clip, 0.0, 1.0);
}`;
const BODY_FS = `#version 300 es
precision highp float;
in float vCU; in float vRad; in float vV; in vec3 vTint; in float vBlur;
uniform float uCyto, uCells, uLighten, uSat;   // cytoplasm amount, cell freq, lighten-to-white, desaturate (render only)
uniform float uGrain, uGrainScale;             // grain amount + fineness (driven by the BLUE component)
uniform float uTime, uCytoDrift;               // sim clock + gentle cytoplasmic-streaming speed (0 = static)
out vec4 frag;   // vTint carries the RAW genome colour; hair/cyto/grain read it raw, appearance is lit+desaturated below

// integer hash (uint mul/xor/shift) -> bit-identical on every GPU/CPU/JIT backend (arm64 LLVM == x86-64 Subzero),
// so goldens match cross-arch. Replaces fract(sin()*k), whose transcendentals diverge across backends. Callers pass
// integer-valued cell corners; float()+÷ below are IEEE-exact. (docs/PLAN-visual-goldens.md)
vec2 hash2(vec2 p){
  uvec2 q = uvec2(ivec2(p));                                  // exact for integer p; negatives wrap (defined int->uint)
  uint h = q.x*374761393u + q.y*668265263u; h = (h ^ (h >> 13u)) * 1274126177u; h ^= (h >> 16u);
  uint g = h*2246822519u; g = (g ^ (g >> 15u)) * 3266489917u; g ^= (g >> 13u);
  return vec2(float(h), float(g)) / 4294967296.0;             // -> [0,1)^2
}
// smooth value noise: interpolate the per-cell hash across cell corners -> no hard square grid, organic grain
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  float a = hash2(i).x, b = hash2(i+vec2(1.0,0.0)).x, c = hash2(i+vec2(0.0,1.0)).x, d = hash2(i+vec2(1.0,1.0)).x;
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
// Worley / cellular noise: distance to the nearest jittered feature point (small => near a cell centre)
float worley(vec2 p){
  vec2 i = floor(p), f = fract(p); float d = 8.0;
  for (int y=-1;y<=1;y++) for (int x=-1;x<=1;x++){
    vec2 g = vec2(float(x),float(y)); vec2 o = hash2(i+g); vec2 r = g+o-f; d = min(d, dot(r,r));
  }
  return sqrt(d);
}

void main(){
  // rounded cross-section: full radius at the spine, feathering to 0 at the edges. DEATH BLUR raises the falloff
  // exponent (soft-focus edges) and the detail factor washes out cyto/grain as it dies.
  float soft = 0.5 + vBlur;
  float detail = 1.0 - clamp(vBlur, 0.0, 1.0);
  float th = vRad * pow(max(0.0, 1.0 - vCU*vCU), soft);

  // CYTOPLASM: cellular spots of higher density in BODY-SPACE. u across = cu*radius (world units), v along = arc length.
  // Both in world units so cells are isotropic; welded to the material, so they flex with the body. No animation.
  if (uCyto > 0.0){
    float uW = vCU * vRad;
    // gentle cytoplasmic streaming: drift the sample slowly over sim time (mostly ALONG the body, a little across) so the
    // cells flow instead of sitting static. Welded per-instance offset is already baked into vV, so each creature flows its
    // own pattern. (bounded well within float precision for any realistic clock.)
    vec2 flow = vec2(uTime * uCytoDrift * 0.5, uTime * uCytoDrift);
    float f1 = worley((vec2(uW, vV) + flow) * uCells);
    float spot = 1.0 - smoothstep(0.0, 0.5, f1);            // 1 at cell centres, 0 between
    float interior = 1.0 - smoothstep(0.6, 1.0, abs(vCU));  // fade out near the silhouette so the rim stays clean
    th *= 1.0 + uCyto * vTint.g * spot * interior * detail; // cytoplasm attenuated by RAW GREEN (washed out on death)
  }

  // GRAIN: fine per-cell density speckle in body-space, attenuated by the segment's BLUE component. Symmetric
  // (light + dark specks), interior-faded so the silhouette/rim stays clean. Composes on top of the cytoplasm.
  if (uGrain > 0.0){
    float interior = 1.0 - smoothstep(0.6, 1.0, abs(vCU));
    vec2 gc = vec2(vCU * vRad, vV) * uGrainScale;
    float gr = 0.55*vnoise(gc) + 0.30*vnoise(gc*2.3 + 19.7) + 0.15*vnoise(gc*4.7 + 5.1);   // fBm: plain noise, a few octaves
    th *= 1.0 + uGrain * vTint.b * (gr - 0.5) * 2.0 * interior * detail;   // grain by RAW BLUE (washed out on death)
  }

  // BODY APPEARANCE (render only): raw genome colour -> lighten toward white -> desaturate toward grey
  vec3 col = vTint * (1.0 - uLighten) + uLighten;
  col = mix(col, vec3(dot(col, vec3(0.299, 0.587, 0.114))), uSat);
  frag = vec4(col * th, th);
}`;

// fullscreen triangle (attributeless) -- shared by the resolve and final passes
const COMP_VS = `#version 300 es
precision highp float;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); // (0,0)(2,0)(0,2) fullscreen triangle
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

// --- per-slab RESOLVE pass (front to back): fold ONE depth slab into the running composite ---
// Pure absorption is order-independent, so we only need ordering for EMITTED light (rim + subsurface): this slab's
// emission is dimmed by exp(-frontAbsorb), the gel already accumulated in nearer slabs. Two MRT outputs:
//   0 = running emitted colour   1 = running absorb*thickness (frontAbsorb for the slabs behind this one)
const RESOLVE_FS = `#version 300 es
precision highp float;
uniform sampler2D uSlab, uPrevOut, uPrevFA, uHairTex;
uniform vec2 uRes;
uniform float uField, uDensity, uRim, uSub, uOpacity, uScaleRatio;
layout(location=0) out vec4 outColor;
layout(location=1) out vec4 outFA;

float slabTh(ivec2 p){ return texelFetch(uSlab, p, 0).a; }

void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy);
  vec4 slab = texelFetch(uSlab, ip, 0);
  vec3 prevOut = texelFetch(uPrevOut, ip, 0).rgb;   // emission from nearer slabs
  vec3 prevFA  = texelFetch(uPrevFA,  ip, 0).rgb;   // absorb*thickness of nearer slabs (gel in front)
  vec3 hairE   = texelFetch(uHairTex, ip, 0).rgb;   // THIS slab's hair glow (rim-coloured)
  vec3 atten = exp(-prevFA);                         // everything this slab emits is dimmed by the gel in front of it
  float th = slab.a;
  if (th <= 1e-4){
    // no body gel here, but hairs stick out past the silhouette -> still add their (depth-attenuated) glow
    outColor = vec4(prevOut + hairE * atten, 1.0);
    outFA = vec4(prevFA, 1.0); return;
  }

  vec3 tint = clamp(slab.rgb / th, 0.0, 1.0);
  // tinted absorption (a gel eats its complement) + flat colourless opacity (makes even white gel milky/opaque)
  vec3 absorb = (vec3(1.0) - tint) * uDensity + vec3(uOpacity);

  // this slab's emitted light: subsurface glow + refractive Becke rim (from THIS slab's own thickness edges)
  vec3 sub = tint * (1.0 - exp(-th * 0.04)) * uSub * uField * 0.5;
  // gradient measured per pixel -> multiply by the zoom ratio so the rim brightness is per-WORLD-unit (scale-invariant).
  // The line still widens as you zoom in (more pixels fall inside the edge); only its brightness is held steady.
  float grad = length(vec2(slabTh(ip+ivec2(1,0)) - slabTh(ip-ivec2(1,0)),
                           slabTh(ip+ivec2(0,1)) - slabTh(ip-ivec2(0,1)))) * uScaleRatio;
  vec3 rim = vec3(1.0, 1.0, 0.97) * (smoothstep(0.15, 2.5, grad) * uRim * 0.6 * uField);

  // subsurface glow stays STEADY (must not pop as others drift over it). Rim AND hairs are depth-ordered -- dimmed by
  // the gel nearer than this slab -> overlapping swimmers no longer stack their hairs into blown-out hot spots.
  outColor = vec4(prevOut + sub + (rim + hairE) * atten, 1.0);
  outFA    = vec4(prevFA + absorb * th, 1.0);
}`;

// --- FINAL pass: backlight through all the gel (order-independent) + all the accumulated emission, over the field ---
const FINAL_FS = `#version 300 es
precision highp float;
uniform sampler2D uOut, uFA;
uniform vec2 uRes;
uniform float uField;
out vec4 frag;
void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy);
  vec3 emitted = texelFetch(uOut, ip, 0).rgb;
  vec3 totalAbsorb = texelFetch(uFA, ip, 0).rgb;   // absorb*thickness summed over every slab

  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 field = uField * vec3(0.99, 1.0, 0.95);
  field *= 1.0 - smoothstep(0.35, 0.98, distance(uv, vec2(0.5))) * 0.5;

  frag = vec4(field * exp(-totalAbsorb) + emitted, 1.0);   // Beer-Lambert backlight + emission
}`;

// --- BLOOM: bright-pass -> separable blur -> add back over the scene (full-image glow) ---
const BRIGHT_FS = `#version 300 es
precision highp float;
uniform sampler2D uScene; uniform float uThresh;
out vec4 frag;
void main(){
  vec3 c = texelFetch(uScene, ivec2(gl_FragCoord.xy), 0).rgb;
  float b = max(max(c.r, c.g), c.b);
  frag = vec4(c * (max(0.0, b - uThresh) / max(b, 1e-4)), 1.0);   // keep only the bright excess
}`;
const BLUR_FS = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform ivec2 uDir;   // per-tap pixel step (H then V)
out vec4 frag;
void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy);
  vec3 s = texelFetch(uTex, ip, 0).rgb * 0.204164;
  s += (texelFetch(uTex, ip+uDir,    0).rgb + texelFetch(uTex, ip-uDir,    0).rgb) * 0.180174;
  s += (texelFetch(uTex, ip+uDir*2,  0).rgb + texelFetch(uTex, ip-uDir*2,  0).rgb) * 0.123832;
  s += (texelFetch(uTex, ip+uDir*3,  0).rgb + texelFetch(uTex, ip-uDir*3,  0).rgb) * 0.066282;
  s += (texelFetch(uTex, ip+uDir*4,  0).rgb + texelFetch(uTex, ip-uDir*4,  0).rgb) * 0.027631;
  frag = vec4(s, 1.0);
}`;
const POST_FS = `#version 300 es
precision highp float;
uniform sampler2D uScene, uBloom; uniform float uStrength;
uniform ivec2 uOrigin;     // composite: this view fills a REGION of the canvas -> map window fragcoord back to view texels
uniform vec2 uViewSize;    // view size (px) for the rounded-corner mask
uniform float uRound;      // corner radius (px); same for every view so all four match
out vec4 frag;
void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy) - uOrigin;
  vec3 c = texelFetch(uScene, ip, 0).rgb + texelFetch(uBloom, ip, 0).rgb * uStrength;
  if (uRound > 0.0){                                       // rounded-box SDF -> mask corners to the (black) canvas
    vec2 hs = uViewSize * 0.5;
    vec2 q = abs((vec2(ip) + 0.5) - hs) - hs + vec2(uRound);
    float sd = min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - uRound;
    c *= 1.0 - smoothstep(-0.75, 0.75, sd);               // ~1.5px antialiased edge
  }
  frag = vec4(c, 1.0);
}`;

// --- world-boundary box: flat-colour screen-space quads drawn on top ---
const BOX_VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;
uniform vec2 uRes;
void main(){ gl_Position = vec4(aPos.x/uRes.x*2.0-1.0, 1.0-aPos.y/uRes.y*2.0, 0.0, 1.0); }`;
const BOX_FS = `#version 300 es
precision highp float;
uniform vec4 uColor;
out vec4 frag;
void main(){ frag = uColor; }`;   // rgba -> alpha lets the outside-wall darkening be semi-transparent

// --- hairs: thin glowing rim-coloured strands, drawn additively on top of the composite ---
const HAIR_VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;   // screen pixels
layout(location=1) in float aA;    // intensity (1 at root, 0 at tip)
uniform vec2 uRes;
out float vA;
void main(){
  vA = aA;
  vec2 clip = vec2(aPos.x / uRes.x * 2.0 - 1.0, 1.0 - aPos.y / uRes.y * 2.0);
  gl_Position = vec4(clip, 0.0, 1.0);
}`;
const HAIR_FS = `#version 300 es
precision highp float;
in float vA;
uniform vec3 uColor;
uniform float uBright;
out vec4 frag;
void main(){ frag = vec4(uColor * (vA * uBright), 1.0); }   // additive glow (blendFunc ONE,ONE)
`;

function build(){
  errEl.textContent = '';

    maximumLifeSpan: MAX_LIFESPAN, numFoodTypes: 1, childEnergyRatio: 0.5, hungerThreshold: 50,
    crossoverRate: 0.2, mutationRate: 0.01, foodRegenerationPeriod: 20, foodSpread: P.pool/2,
    foodBitEnergy: 50, attractionCriterion: 10, maxPopulation: 2000, maxFood: 2000,
    viewRadius: 300, reproductiveIsolation: SPECIES_ISO,   // junk-DNA gate ON -> reproductive species emerge over time
    pool: { left:0, top:0, right:P.pool, bottom:P.pool },

  try { world = new World(config, seed, {}); }
  catch(e){ world = null; errEl.textContent = 'Cannot build: ' + e.message; return; }
  const rng = mulberry32((seed>>>0) ^ 0x5eed1234);
  for (let i=0;i<P.n;i++){
    const g = new Genotype(); g.randomize(rng);
    const genes = g.getGenes().slice();

    const p = diskPoint(rng, P.pool/2, P.pool/2, P.pool/2.4);
    const age = YOUNG_AGE + Math.floor((MAX_LIFESPAN-YOUNG_AGE)*rng());
    world.loadSwimbot(i, { age, x:p.x, y:p.y, angle: rng()*360-180, energy: 50, genes });
  }

  known.clear(); fades.clear(); deathTick.clear(); deathFade0.clear(); lastJunkClock = 0;   // no stale death-fade ghosts / junk drift across a rebuild
  frameCount = 0; nextSpeciesId = 1; tracked = new Map(); slotIds = [null,null,null]; speciesById = new Map(); speciesList = [];   // reset species tiles -> deterministic from a fresh build
  SC_REF = (VIEW_MAIN / P.pool) * 6;   // main-view calibrated (independent of canvas aspect); recompute if P.pool changed
  seedJunk(rng);

}

let hairBuf = new Float32Array(1 << 19), ho = 0;
function hairVtx(x, y, a){ if (ho+3 > hairBuf.length){ const nb=new Float32Array(hairBuf.length*2); nb.set(hairBuf); hairBuf=nb; } hairBuf[ho++]=x; hairBuf[ho++]=y; hairBuf[ho++]=a; }
function hairTri(ax,ay,aa, bx,by,ba, cx,cy,ca){ if (CAP) CAP.hairs.push([CAP.part, ax,ay, bx,by, cx,cy]); hairVtx(ax,ay,aa); hairVtx(bx,by,ba); hairVtx(cx,cy,ca); }
// one strand: root (rx,ry), outward unit normal (nx,ny), screen length/width, total tip deflection `theta`.
// per-HAIR stable pseudo-random: hash an integer key -> [0,1). Keyed on the hair's arc position/index (NOT time), so
// each strand's length/angle offset is fixed (organic jitter, not flicker) and identical frame to frame.
function hair01(k){ let h = k>>>0; h = Math.imul(h ^ (h>>>16), 0x45d9f3b); h = Math.imul(h ^ (h>>>16), 0x45d9f3b); h ^= h>>>16; return (h>>>0)/4294967296; }
// jitter a hair's outward direction (nx,ny) + length by small per-strand random offsets. Returns [dx,dy,len].
function hairJit(nx, ny, len, key){
  const a = (hair01(key ^ 0x9e3779b9)*2 - 1) * P.hairAngJit, c = Math.cos(a), s = Math.sin(a);
  return [nx*c - ny*s, nx*s + ny*c, len * (1 + (hair01(key)*2 - 1) * P.hairLenJit)];
}
// Steps outward while rotating by theta/NSEG each step (curved sway), tapering width + glow to the tip.
const HAIR_NSEG = 4;
function emitHair(rx, ry, nx, ny, len, wid, theta, bright){
  const step = len/HAIR_NSEG; let ang = Math.atan2(ny, nx), cx=rx, cy=ry;
  let pLx=0,pLy=0,pRx=0,pRy=0,pa=bright;
  for (let s=0;s<=HAIR_NSEG;s++){
    const frac=s/HAIR_NSEG, w=wid*(1-frac), a=(1-frac)*bright;   // brightness scale (dims baby hairs), tapering to tip
    const px=-Math.sin(ang), py=Math.cos(ang);        // perpendicular to the strand heading
    const Lx=cx-px*w, Ly=cy-py*w, Rx=cx+px*w, Ry=cy+py*w;
    if (s>0) hairTri(pLx,pLy,pa, pRx,pRy,pa, Rx,Ry,a), hairTri(pLx,pLy,pa, Rx,Ry,a, Lx,Ly,a);
    pLx=Lx;pLy=Ly;pRx=Rx;pRy=Ry;pa=a;
    cx += Math.cos(ang)*step; cy += Math.sin(ang)*step; ang += theta/HAIR_NSEG;
  }
}
// hairs radiating OUTWARD from a rounded cap (mouth / tip / shoulder): a fan of strands around the dome outline.
// A,B = cap base corners (screen); (ax,ay) = outward axis (screen); capLenScreen = cap bulge; radWorld = cap thickness.
function emitCapHairs(A, B, ax, ay, capLenScreen, radWorld, red, grow, fade, vArc, vx, vy, S){
  const cx=(A[0]+B[0])*0.5, cy=(A[1]+B[1])*0.5, hx=(B[0]-A[0])*0.5, hy=(B[1]-A[1])*0.5;
  const capLenW = capLenScreen / Math.max(S, 1e-6);
  const arcW = Math.PI * (radWorld + capLenW) * 0.5;          // half-ellipse perimeter (world) around the cap
  const K = Math.max(2, Math.round(arcW / P.hairSpace));      // SAME spacing (world units) as the side hairs
  const lenS = P.hairLen * (radWorld/3) * red * grow * S, widS = Math.max(0.25, P.hairWid*S);
  const beat = P.hairSway * Math.sin(vArc*P.hairWave - hairTime*P.hairBeat), hb = grow*fade, IN = 0.88;
  for (let i=0;i<K;i++){
    const phi = -1.5708 + (i+0.5)/K * 3.14159, s=Math.sin(phi), co=Math.cos(phi);
    const dx = hx*s + ax*capLenScreen*co, dy = hy*s + ay*capLenScreen*co;   // outline offset from the cap centre
    const px = cx + dx*IN, py = cy + dy*IN;                                 // root slightly inside -> attaches to the body
    let ol=Math.hypot(dx,dy)||1, ox=dx/ol, oy=dy/ol;                        // radial outward normal
    const [jox,joy,jlen] = hairJit(ox, oy, lenS, (Math.floor(vArc*13) + i*131) >>> 0);
    emitHair(px, py, jox, joy, jlen, widS, beat - P.hairDrag*(vx*(-joy)+vy*jox), hb);
  }
}

// tessellate ONE segment (part p) of a creature at the current buffer cursor. Segments of the same CHAIN are emitted
// into the same depth slab so they still fuse seamlessly (no joint disc needed -- sequential parts share their edge).
function tessSegment(sb, ph, p, g, S, v0, v1, fade, merge, lod=1){
  const part = ph.parts[p];
  const pt = partPointsGL(ph, p, g);
  // LOD (lod: 1 = full, ->0 for tiny on-screen creatures): hairs (~half the geometry, invisible when small) drop first,
  // then strip steps and dome resolution scale down. Full detail when lod>=~1 (a reasonably large creature on screen).
  const steps = (lod >= 0.999) ? STEPS : Math.max(2, Math.round(STEPS * lod));
  // hairs FADE OUT smoothly as the creature shrinks (no hard on/off pop). At the small end they'd just be a faint white
  // halo anyway -- which the silhouette RIM already draws -- so as they fade they melt into that rim line. Below the fade
  // floor they're skipped entirely (cost saved at full zoom-out); above it they're full strength.
  const hairLOD = smoothstep(0.6 - P.hairFade, 0.6, lod);   // P.hairFade = fade-band width (wider = gentler fade-out)
  // caps GROW IN smoothly (bulge length scaled by domeLOD) rather than hard on/off -> no pop as you zoom. A zero-length cap
  // is just the flat strip end, so scaling from 0 emerges invisibly; we still skip the draw while it's ~flat (perf kept).
  const domeLOD = smoothstep(0.3, 0.55, lod);
  // DEATH: swell the segment outward from the swimmer's centre (disperse) + soft-focus BLUR, while thickness fades
  let capLenT = pt.capLenT, capLenR = pt.capLenR;
  const blur = P.deathBlur * (1 - fade);   // 0 alive -> P.deathBlur when fully dead (feathers edges in the shader)
  if (fade < 0.999){
    const pos = sb.getPosition(), c = toScreen(pos.x, pos.y), swell = 1 + 0.2*(1-fade);
    for (const key of ['sL','c1L','c2L','eL','eR','c2R','c1R','sR']){ const q=pt[key]; q[0]=c[0]+(q[0]-c[0])*swell; q[1]=c[1]+(q[1]-c[1])*swell; }
    capLenT *= swell; capLenR *= swell;
  }
  // RAW genome colour (0..1) -- the shader reads it raw for cyto/grain, and lightens+desaturates it for the appearance.
  // Colour is a GRADIENT along the body: from the PARENT segment's colour at the joint to this segment's colour at its
  // end -> smooth transitions, no hard colour edges at joints (own colour at the root, where there is no parent).
  // `fade` scales thickness (1 alive -> 0 dead), so a dying swimmer dissolves (absorption, rim, glow all fade with it).
  const tEnd = [ part.red, part.green, part.blue ];
  const pp = (part.parent >= 1) ? ph.parts[part.parent] : part;
  const tStart = [ pp.red, pp.green, pp.blue ];
  if (CAP){ CAP.part = p; CAP.kind = 0; }
  emitStrip(pt, tStart, tEnd, v0, v1, fade, blur, merge, steps);   // merge (branch base fillet+fade) computed in render, arc-based
  if (CAP) CAP.kind = 1;
  // The strip's END is rotated by the branch BEND (inside emitStrip), but the tip dome attaches to the RAW eL/eR/axis. On a
  // SHORT limb the bend has not eased to 0 by the tip, so the dome is left misaligned from the strip end -> a cut at the tip
  // dome transition. Apply the SAME end-bend (th at u=1, same pivot) to the dome base edge + bulge axis so the dome's base
  // ring becomes exactly the strip's end edge (welded). The mouth dome (capLenR) is only on the trunk root (merge null).
  let deL=pt.eL, deR=pt.eR, dnx=pt.nx, dny=pt.ny;
  // The branch base RAMP fades the STRIP's thickness up from 0 over arc-length rw, so on a SHORT limb the strip END is still
  // faded (e.g. 17%) -- but the dome ignored the ramp and popped to FULL thickness, a cliff at the tip = a dark step + rim
  // line across the limb ("the cut at the tip dome transition"). Match the dome base thickness to the strip end (ramp at u=1).
  const rampEnd = merge ? smoothstep(0, merge.rampRw, merge.a1) : 1;   // match dome base to the strip-end thickness (same ramp)
  if (merge){
    const th = merge.da * (1 - smoothstep(0, merge.rw, merge.a1)), c=Math.cos(th), s=Math.sin(th);
    const rot=(Pp)=>{ const dx=Pp[0]-merge.px, dy=Pp[1]-merge.py; return [merge.px+dx*c-dy*s, merge.py+dx*s+dy*c]; };
    deL=rot(pt.eL); deR=rot(pt.eR); dnx=pt.nx*c-pt.ny*s; dny=pt.nx*s+pt.ny*c;
  }
  if (pt.terminal && domeLOD > 0.02)   emitDome(deL, deR,  dnx,  dny, capLenT*S*domeLOD, pt.wEnd*fade*rampEnd, tEnd,   v1, v1 + capLenT*domeLOD, blur, lod); // tip
  if (pt.capLenR > 0 && domeLOD > 0.02) emitDome(pt.sL, pt.sR, -pt.nx, -pt.ny, capLenR*S*domeLOD, pt.wStart*fade, tStart, v0, v0 - capLenR*domeLOD, blur, lod); // mouth only now
  if (CAP) CAP.kind = 2;

  // hairs along both side edges: roots welded to the body (follow the swim), tips beat in a metachronal wave along v,
  // length scales with the segment's local thickness, and they DRAG from this part's own velocity through the water.
  // GROWTH GATE (H.Grow): no hairs until this growth fraction, then ramp to full over ~0.4 -> newborns stay bald.
  const grow = smoothstep(P.hairGrow, Math.min(0.99, P.hairGrow + 0.4), g);
  if (P.hair > 0 && part.red > 0.01 && grow > 0.001 && hairLOD > 0.01){
    const red = part.red, gLen = (part.length || 1) * g;   // grown segment length -> even hair spacing on babies too
    const n = Math.max(1, Math.round(gLen / P.hairSpace));
    const widS = Math.max(0.25, P.hairWid * S);
    const vx = part.velocity ? part.velocity.x : 0, vy = part.velocity ? part.velocity.y : 0;   // per-SEGMENT velocity
    for (let h=0; h<n; h++){
      const u = (h+0.5)/n;
      let L = bez(pt.sL,pt.c1L,pt.c2L,pt.eL,u), R = bez(pt.sR,pt.c1R,pt.c2R,pt.eR,u);
      if (merge){ const th=merge.da*(1-smoothstep(0,merge.rw,merge.a0+(merge.a1-merge.a0)*u)), c=Math.cos(th), s=Math.sin(th);  // hairs track the Y bend
        L=[merge.px+(L[0]-merge.px)*c-(L[1]-merge.py)*s, merge.py+(L[0]-merge.px)*s+(L[1]-merge.py)*c];
        R=[merge.px+(R[0]-merge.px)*c-(R[1]-merge.py)*s, merge.py+(R[0]-merge.px)*s+(R[1]-merge.py)*c]; }
      const M = mid(L,R);
      // hair LENGTH = local thickness * RED (gene trait) * growth-gate; brightness also gated -> smooth grow-in
      const lenS = P.hairLen * (lerp(pt.wStart, pt.wEnd, u) / 3.0) * red * grow * S;
      const beat = P.hairSway * Math.sin(lerp(v0,v1,u)*P.hairWave - hairTime*P.hairBeat);
      const hbright = grow * fade * hairLOD;   // fade with death AND with the LOD hair-fade (smooth zoom transition)
      const kb = (Math.floor(lerp(v0,v1,u)*13)*2) >>> 0;   // per-hair key from arc position (L=kb, R=kb|1)
      let lx=L[0]-M[0], ly=L[1]-M[1], ll=Math.hypot(lx,ly)||1; lx/=ll; ly/=ll;
      const [jlx,jly,jll] = hairJit(lx, ly, lenS, kb);
      emitHair(L[0],L[1], jlx, jly, jll, widS,  beat - P.hairDrag*(vx*(-jly) + vy*jlx), hbright);
      let rx=R[0]-M[0], ry=R[1]-M[1], rl=Math.hypot(rx,ry)||1; rx/=rl; ry/=rl;
      const [jrx,jry,jrl] = hairJit(rx, ry, lenS, kb|1);
      emitHair(R[0],R[1], jrx, jry, jrl, widS, -beat - P.hairDrag*(vx*(-jry) + vy*jrx), hbright);   // beat mirrored; drag physical
    }
    // hairs on the CAPS (heads): radiate from every rounded end -- the tip, and the mouth/branch shoulder. The tip cap
    // hairs must root on the SAME bent + thickness-ramped cap the dome draws (deL/deR/dnx/dny, wEnd*rampEnd), or they float
    // off a short/bent limb (the dome moved + thinned but the hairs stayed on the old full-width, un-bent edge).
    if (pt.terminal)    emitCapHairs(deL, deR,  dnx,  dny, capLenT*S, pt.wEnd*rampEnd, red, grow, fade*hairLOD, v1, vx, vy, S);
    if (pt.capLenR > 0) emitCapHairs(pt.sL, pt.sR, -pt.nx, -pt.ny, capLenR*S, pt.wStart, red, grow, fade*hairLOD, v0, vx, vy, S);
  }
}
const FOOD_TINT = [0.55, 0.78, 0.5];
function tessFood(f){
  const p = f.getPosition(); const [x,y] = toScreen(p.x, p.y); const S = sc();
  emitDisc(x, y, Math.max(1.2, 3.0*S), 2.4, FOOD_TINT, 0, 0);   // vBase, blur (junk/food never blur)
}

// buildSegs: append one creature's per-part draw records (depth slab + arc-based Y-merge) to `segs`. Shared by render() and
// the Copy-Swimmer capture, so the dumped geometry is exactly what the renderer draws (no separate path that could diverge).
function buildSegs(id, sb, ph, g, fade, S, segs, lodOverride){
  const base = pseudoDepth(id);
  // PER-INSTANCE cytoplasm/grain: shift this creature's body-space v by a big per-id constant so its Worley/grain samples a
  // different region of the (non-repeating, 2D-jittered) noise field -> every creature's pattern is unique instead of every
  // identical shape sharing one pattern. Same offset for all its parts (welding + intra-creature continuity preserved); it
  // also desyncs the hair beat per creature, which looks better. Content-addressed by id so it's stable frame to frame.
  const vOff = (((id * 2654435761) >>> 0) / 4294967296) * 600;
  // per-chain layering, BUT the TRUNK is forced to the front and every branch one layer BEHIND it -> the trunk's gel masks
  // the branch bases from the front (hides the merge transition). Branch limbs still layer over the body.
  const chain = new Int32Array(ph.numParts);
  const arc = new Float64Array(ph.numParts);   // arc-length (world) to each part's START -> body-space `v`
  let reach = 0;   // longest root->tip PATH length (world) -- a POSE-INDEPENDENT size (from fixed part lengths), so LOD
  for (let p=1;p<ph.numParts;p++){ const par = ph.parts[p].parent; chain[p] = ph.parts[p].branch ? p : chain[par]; arc[p] = arc[par] + ph.parts[par].length; const tip = arc[p] + ph.parts[p].length; if (tip > reach) reach = tip; }
  // LOD from the STABLE path length (not the flexing max-part-distance, which wobbled ~25% and made caps/hairs flicker).
  // T=75 calibrated so this matches the old rs/60 aggressiveness on average. Capture forces full detail via lodOverride.
  const lod = (lodOverride !== undefined) ? lodOverride : Math.max(0, Math.min(1, reach * S / 75));
  const trunkChain = chain[1];
  const rankOf = new Map([[trunkChain, 0]]); let nextRank = 1;
  for (let p=1;p<ph.numParts;p++){ const c=chain[p]; if (!rankOf.has(c)) rankOf.set(c, nextRank++); }
  const chainLen = new Map();   // total arc-length of each chain -> how much room a limb has to fade its thickness in
  for (let p=1;p<ph.numParts;p++){ const c=chain[p]; chainLen.set(c, (chainLen.get(c)||0) + ph.parts[p].length); }
  const trunkSlab = Math.floor(base * (K_SLABS - 1));   // whole-integer slab offsets: trunk in front, each branch >=1 behind
  for (let p=1;p<ph.numParts;p++){
    if (ph.parts[p].length <= 0) continue;
    const cid = chain[p];
    const slab = Math.min(K_SLABS-1, trunkSlab + rankOf.get(cid));
    let merge = null;
    if (cid !== trunkChain){
      const baseArc = arc[cid], bw = ph.parts[cid].width;              // branch base part
      const tp = ph.parts[ph.parts[cid].parent], tl = Math.hypot(tp.axis.x, tp.axis.y) || 1;   // trunk it attaches to
      const tx = tp.axis.x/tl, ty = tp.axis.y/tl;
      const bp = ph.parts[cid], bl = Math.hypot(bp.axis.x, bp.axis.y) || 1;                      // branch base direction
      const bnx = bp.axis.x/bl, bny = bp.axis.y/bl;
      let phi = Math.atan2(bny, bnx) - Math.atan2(ty, tx); phi = Math.atan2(Math.sin(phi), Math.cos(phi));
      if (phi > Math.PI/2) phi -= Math.PI; else if (phi < -Math.PI/2) phi += Math.PI;
      const da = -phi * Math.cos(phi);                                 // bend toward tangent, ->0 at perpendicular (no snap)
      const pv = parentPos(ph, cid), ps = toScreen(pv.x, pv.y);
      const a0 = arc[p] - baseArc;
      // rw = bend-fillet span (long, keeps the smooth Y). rampRw = the thickness fade-in span. Keep it GENTLE (bw*4) so the
      // base thickness gradient stays UNDER the rim threshold -> no junction rim line, and the cyto/grain rim (which rides on
      // the same thickness gradient) is untouched. BUT cap rampRw at the chain's OWN length so a SHORT limb still reaches full
      // thickness (no faded ghost) rather than ramping past its end. Long limbs (longer than bw*4) get the gentle ramp for
      // free; only genuinely short limbs pay a steeper ramp, and they're small. (Length-aware, per Karl.)
      const rampRw = Math.min(bw*4, Math.max(chainLen.get(cid), 1e-3));
      merge = { a0, a1: a0 + ph.parts[p].length, rw: bw*4, rampRw, px: ps[0], py: ps[1], da };
    }
    segs.push({ sb, ph, p, g, S, fade, slab, v0: arc[p]+vOff, v1: arc[p]+vOff + ph.parts[p].length, merge, lod });
  }
}

// captureCreatureGeom: run the SAME tessellation for one creature with CAP active, returning the exact screen-space triangles
// it draws (body strip + domes + hairs), tagged by part and kind. Buffers are snapshot/restored so the live draw is untouched.
function captureCreatureGeom(id, sb){
  const ph = sb._phenotype; if (!ph || !ph.parts) return null;
  const g = (sb._growthScale !== undefined) ? sb._growthScale : 1;
  const fade = fades.get(id) ?? 1, S = sc();
  const segs = []; buildSegs(id, sb, ph, g, fade, S, segs, 1);   // lodOverride=1: capture at FULL detail regardless of screen size
  const so = o, sho = ho;
  CAP = { tris: [], hairs: [], part: -1, kind: 0 };
  for (const s of segs) tessSegment(s.sb, s.ph, s.p, s.g, s.S, s.v0, s.v1, s.fade, s.merge);
  const out = { tris: CAP.tris, hairs: CAP.hairs };
  CAP = null; o = so; ho = sho;   // restore buffer cursors -> the next real render is unaffected
  return out;
}

// ================================================================== species clustering (engine-native junk-DNA gate)
// Cluster living swimbots on the junk genes [USED, NUM_GENES) with the engine's EXACT metric (sim = 1 - mean|Δ|/256),
// same-species iff sim > reproductiveIsolation. Clusters are tracked as PERSISTENT LINEAGES (membership-overlap match)
// with an EMA'd centroid, so a species' plate crawls with real drift instead of scrambling; three STICKY tile slots
// (hysteresis) hold species so tiles don't reshuffle. Recomputed every SPECIES_RECOMPUTE frames (deterministic).
const NJ = NUM_GENES - USED;         // 144 junk genes
const SPECIES_ISO = 0.9;             // = NON_REPRODUCING_JUNK_DNA_LIMIT (engine default); matches the birth gate exactly
const SPECIES_K = 24;                // hard cap on tracked reps (perf bound on N*K*NJ)
const SPECIES_RECOMPUTE = 1;         // recluster EVERY frame (~0.6ms at this pool size) -> smooth counts + fine drift
const TILE_ZOOM = 14;               // fixed shared zoom for all tiles -> tile fill is comparable across species
let frameCount = 0, nextSpeciesId = 1;
let tracked = new Map();           // id -> { ema:Float64Array(NJ), sig, count, rep, idset:Set, seed, misses } — persistent lineages
let slotIds = [null, null, null];  // the 3 tile slots -> a persistent species id (sticky, with hysteresis)
let speciesById = new Map(), speciesList = [];   // this recompute's clusters (by id; sorted by count for labels/tests)
const SIG_EMA = 0.08;              // centroid smoothing per recompute (now every frame) -> the plate CRAWLS, stays close
const SLOT_MARGIN = 1.3;           // a challenger must exceed the smallest slotted species by this factor to take its slot
const SPECIES_MATCH = 0.94;        // EMA-centroid similarity to treat a cluster as the SAME lineage across reclusters
function junkOf(sb){ const g = sb.getGenotype(); const a = new Float64Array(NJ); for (let k=0;k<NJ;k++) a[k] = g.getGeneValue(USED+k); return a; }
function junkSim(a, b){ let d = 0; for (let k=0;k<NJ;k++) d += Math.abs(a[k]-b[k]); return 1 - (d/256)/NJ; }   // engine metric (/BYTE_SIZE)
// 5-symbol species SIGNATURE from the USED (functional, body/brain) genes [0,USED) -- NOT the junk. Junk is neutral:
// it random-walks to a uniform ~127 equilibrium, so junk plates converged to "QQQQQ" and jittered (no structure). The
// used genes are under selection, so they carry real STRUCTURE. And we SAMPLE 5 individual genes (per-gene) rather than
// block-MEANS: a mean over ~a block averages back to the population mean (washes structure out), whereas 5 sampled genes
// keep it. base36 via a gamma curve over [0,255]; locality-preserving (close genome -> close plate by symbol distance).
// (Trade-off Karl accepted: founders start with RANDOM used genes, so there is no "00000" origin anymore.)
const SIG_ALPHA = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ', SIG_GAMMA = 0.4;
const SIG_SAMPLE = [0,1,2,3,4].map(i => Math.floor(USED * (i + 0.5) / 5));   // 5 used genes spread across [0,USED)
function signatureOf(vec){   // vec = a used-gene vector (or centroid); 5 sampled genes -> base36
  let s = '';
  for (const k of SIG_SAMPLE) s += SIG_ALPHA[Math.min(35, Math.round(Math.pow((vec[k] || 0) / 255, SIG_GAMMA) * 35))];
  return s;
}
function computeSpecies(){
  if (!world) return;
  // 1. cluster living bots -> clusters, each assigned to its MOST-similar rep above the isolation gate (K-capped)
  const reps = [];
  for (const [id, sb] of world._swimbots){
    if (!sb.getAlive()) continue;
    const ph = sb._phenotype; if (!ph || ph.numParts <= 1) continue;
    const jg = junkOf(sb);
    let best = null, bestS = SPECIES_ISO;
    for (const r of reps){ const s = junkSim(jg, r.seed); if (s > bestS){ bestS = s; best = r; } }
    if (best) best.members.push({ sb, jg });
    else if (reps.length < SPECIES_K) reps.push({ seed: jg, members: [{ sb, jg }] });
    else { let nb = reps[0], ns = -1; for (const r of reps){ const s = junkSim(jg, r.seed); if (s > ns){ ns = s; nb = r; } } nb.members.push({ sb, jg }); }
  }
  // 2. per cluster: junk centroid (lineage identity) + USED-gene centroid (the plate) + closest-to-mean rep + member set
  for (const r of reps){
    const mean = new Float64Array(NJ), meanUsed = new Float64Array(USED);
    for (const m of r.members){ for (let k=0;k<NJ;k++) mean[k] += m.jg[k];
      const gt = m.sb.getGenotype(); for (let k=0;k<USED;k++) meanUsed[k] += gt.getGeneValue(k); }   // per-gene (no per-member alloc)
    for (let k=0;k<NJ;k++) mean[k] /= r.members.length;
    for (let k=0;k<USED;k++) meanUsed[k] /= r.members.length;
    r.mean = mean; r.meanUsed = meanUsed; r.count = r.members.length; r.idset = new Set(r.members.map(m => m.sb));
    let best = null, bs = -1; for (const m of r.members){ const s = junkSim(m.jg, mean); if (s > bs){ bs = s; best = m.sb; } }
    r.newRep = best;
  }
  reps.sort((a, b) => b.count - a.count);
  // 3. match each cluster to a persistent lineage by EMA-CENTROID SIMILARITY, greedy largest-first. The centroid is
  //    steady even when the whole membership turns over between reclusters (a species' genetic centre barely moves), so
  //    this tracks a lineage far more stably than membership overlap does at the live recompute interval. None -> new id.
  const usedTracked = new Set();
  for (const r of reps){
    let bestId = null, bestS = SPECIES_MATCH;   // >0.94: stricter than the 0.9 isolation gate so distinct lineages don't merge
    for (const [tid, t] of tracked){ if (usedTracked.has(tid)) continue; const s = junkSim(r.mean, t.ema); if (s > bestS){ bestS = s; bestId = tid; } }
    r.id = bestId || nextSpeciesId++; usedTracked.add(r.id);
  }
  // 4. update each lineage: EMA its centroid so the plate CRAWLS (new lineages START at their centroid, not 00000 -- a
  //    splinter species is already diverged; only the founder line begins at 00000 and drifts out). Keep a continuous rep.
  const seen = new Set();
  for (const r of reps){
    seen.add(r.id);
    let t = tracked.get(r.id);
    if (!t){ t = { ema: Float64Array.from(r.mean), emaUsed: Float64Array.from(r.meanUsed) }; tracked.set(r.id, t); }
    else { for (let k=0;k<NJ;k++) t.ema[k] += SIG_EMA * (r.mean[k] - t.ema[k]);            // junk centroid (lineage identity)
           for (let k=0;k<USED;k++) t.emaUsed[k] += SIG_EMA * (r.meanUsed[k] - t.emaUsed[k]); }   // used centroid (the plate)
    t.misses = 0; t.seed = r.seed; t.idset = r.idset; t.count = r.count;
    if (!(t.rep && t.rep.getAlive() && r.idset.has(t.rep))) t.rep = r.newRep;
    t.sig = signatureOf(t.emaUsed); r.t = t;
  }
  for (const [tid, t] of tracked) if (!seen.has(tid) && ++t.misses > 4) tracked.delete(tid);   // retire long-absent lineages
  // 5. STICKY tile slots: a species holds its slot; free slots fill by size; one hysteresis swap/recompute (challenger
  //    must beat the smallest slotted species by SLOT_MARGIN) -> tiles stop reshuffling on every count wobble.
  for (let s=0;s<3;s++) if (slotIds[s] != null && !seen.has(slotIds[s])) slotIds[s] = null;
  const slotted = new Set(slotIds.filter(x => x != null));
  for (let s=0;s<3;s++) if (slotIds[s] == null){ const cand = reps.find(r => !slotted.has(r.id)); if (cand){ slotIds[s] = cand.id; slotted.add(cand.id); } }
  const cntOf = id => { const r = reps.find(x => x.id === id); return r ? r.count : 0; };
  let smin = -1, sminC = Infinity; for (let s=0;s<3;s++){ if (slotIds[s] == null) continue; const c = cntOf(slotIds[s]); if (c < sminC){ sminC = c; smin = s; } }
  const chall = reps.find(r => !slotted.has(r.id));
  if (smin >= 0 && chall && chall.count > sminC * SLOT_MARGIN){ slotIds[smin] = chall.id; }
  speciesById = new Map(reps.map(r => [r.id, r])); speciesList = reps;
}
// count + signature labels (HTML overlay; "counts first"). Follows the sticky slots.
const tileLabels = ['lab0','lab1','lab2'].map(id => document.getElementById(id));
function updateTileLabels(){
  for (let s = 0; s < 3; s++){
    const el = tileLabels[s]; if (!el) continue;
    const id = slotIds[s], r = id != null ? speciesById.get(id) : null;
    if (r && r.t){ el.innerHTML = `<span class="n">${r.count}</span><span class="sig">${r.t.sig}</span>`; el.hidden = false; }
    else el.hidden = true;
  }
}

// ================================================================== render
// Per-FRAME state, advanced ONCE per frame regardless of how many views render (main + species tiles). Hoisted out of
// renderView so detritus drift + death-fade bookkeeping don't advance 4x. See docs/PLAN-species-viewers.md.
function advanceFrame(){
  const clock = world ? world.getClock() : 0;
  hairTime = clock;
  // drift the floating detritus by ELAPSED SIM TICKS (dt) -> freezes on pause, scales with speed. modulo-wrap handles
  // any dt (a big jump at high speed / in the golden hook stays in-bounds).
  const dt = clock - lastJunkClock; lastJunkClock = clock;
  const nJunk = Math.floor(P.junk * MAX_JUNK);
  for (let i=0;i<nJunk;i++){ const j=junk[i]; j.x += j.vx*dt; j.y += j.vy*dt;
    j.x = ((j.x % P.pool) + P.pool) % P.pool; j.y = ((j.y % P.pool) + P.pool) % P.pool; }
  if (world){
    // death-fade bookkeeping: refresh refs from the live map, then fade the dead by elapsed SIM TICKS
    const nowClock = world.getClock();
    for (const [id, sb] of world._swimbots) known.set(id, sb);
    for (const [id, sb] of known){
      if (sb.getAlive()){
        // DECOMPOSE BEFORE DEATH: once a swimmer enters its old-age decline (the last OLD_AGE_DURATION ticks before
        // death) it thins/blurs while still ALIVE (and still twitching + slowing), reaching deathFadeFloor exactly at
        // death; it then dissolves the rest of the way post-death. Age-based -> only the genuinely dying decompose
        // (newborns/adults stay at 1); the engine's _timerDelta can't be used raw (it also dips at birth + when starving).
        const oldThresh = MAX_LIFESPAN - OLD_AGE_DURATION;
        const age = sb.getAge();
        const vit = age <= oldThresh ? 1 : Math.max(0, 1 - (age - oldThresh) / OLD_AGE_DURATION);
        fades.set(id, P.deathFadeFloor + (1 - P.deathFadeFloor) * vit);
        deathTick.delete(id); deathFade0.delete(id);
      } else {
        if (!deathTick.has(id)){ deathTick.set(id, nowClock); deathFade0.set(id, fades.get(id) ?? P.deathFadeFloor); }  // fade level AT death -> continue from there
        const f = (deathFade0.get(id) ?? 1) * (1 - (nowClock - deathTick.get(id)) / FADE_TICKS);
        if (f <= 0){ known.delete(id); fades.delete(id); deathTick.delete(id); deathFade0.delete(id); } else fades.set(id, f);
      }
    }
  }
}

// Render ONE view: a camera + viewport size into the pipeline -> screen. PURE per-view — reads the hoisted per-frame
// state (known/fades/junk positions), never mutates it. Sets cam/W/H for the view and RESTORES them (so build(),
// the wall, and the golden hook always see the canvas values). For the main view this is byte-identical to the old
// render(); species tiles will call it with a different cam + size.
function renderView(viewCam, vw, vh, set, regionX, regionY, drawWall = true, roundPx = 0, onlyBot = null){
  if (!gl) return;
  const _cam = cam, _W = W, _H = H;
  cam = viewCam; W = vw; H = vh;
  // this view's offscreen pipeline; same local names the body already uses, so the pipeline code is unchanged
  const { slabFBO, slabTex, hairFBO, hairTex, accA, accB, sceneFBO, sceneTex, bloomAFBO, bloomA, bloomBFBO, bloomB } = set;
  try {
  o = 0; ho = 0;
  // ---- tessellate every creature ONCE, bucketed into K depth slabs (sorted front->back); food joins the deepest slab
  const slabStart = new Array(K_SLABS).fill(0), segCount = new Array(K_SLABS).fill(0);   // segments (cyto/grain)
  const junkStart = new Array(K_SLABS).fill(0), junkCount = new Array(K_SLABS).fill(0);  // detritus + food (plain)
  const hairStart = new Array(K_SLABS).fill(0), hairCount = new Array(K_SLABS).fill(0);
  const nJunk = Math.floor(P.junk * MAX_JUNK);
  if (world){
    const S = sc();
    const segs = [];
    const mW = W + 40, mH = H + 40;   // small viewport margin
    for (const [id, sb] of known){
      if (onlyBot && sb !== onlyBot) continue;                        // species tile: render ONLY the representative
      const ph = sb._phenotype; if (!ph || !ph.parts || ph.numParts <= 1) continue;
      const g = (sb._growthScale !== undefined) ? sb._growthScale : 1;
      // FRUSTUM CULL: skip any creature whose screen bounding box is fully off-view. The pool grows toward maxPopulation
      // (2000), and the whole pool was tessellated+drawn every frame regardless of zoom -> zoomed in with a grown pool was
      // slow even though only a few creatures are visible. Bound = farthest part from the swimmer centre (+ hair/cap slack).
      const c = sb.getPosition();
      let wr = 0; for (let q=1;q<ph.numParts;q++){ const dx=ph.parts[q].position.x-c.x, dy=ph.parts[q].position.y-c.y, d=dx*dx+dy*dy; if (d>wr) wr=d; }
      const rs = (Math.sqrt(wr) + 30) * S;   // screen bounding radius (+ slack for hairs/caps) -- CULL bound only
      const cs = toScreen(c.x, c.y);
      if (cs[0]+rs < -40 || cs[0]-rs > mW || cs[1]+rs < -40 || cs[1]-rs > mH) continue;   // off-screen -> skip
      // LOD is computed INSIDE buildSegs from the pose-independent path length (see there): dome-skip below lod 0.4, hairs
      // below 0.5, strip steps + dome resolution scale with lod. Domes are the dominant zoom-out cost (~half the geometry)
      // and invisible on tiny creatures, so at full zoom-out this is ~15x fewer triangles; detail returns as you zoom in.
      buildSegs(id, sb, ph, g, fades.get(id) ?? 1, S, segs);
    }
    segs.sort((a,b)=>a.slab-b.slab);
    let si = 0;
    for (let k=0;k<K_SLABS;k++){
      slabStart[k] = o/9; hairStart[k] = ho/3;
      while (si<segs.length && segs[si].slab===k){ const s=segs[si]; tessSegment(s.sb, s.ph, s.p, s.g, s.S, s.v0, s.v1, s.fade, s.merge, s.lod); si++; }  // body -> buf, hairs -> hairBuf
      segCount[k] = (o/9) - slabStart[k]; hairCount[k] = (ho/3) - hairStart[k];
      // plain (no cyto/grain) stuff for this slab: floating detritus at this depth, + food in the deepest slab
      junkStart[k] = o/9;
      const S = sc();
      for (let i=0;i<nJunk;i++){ const j=junk[i]; if (j.slab!==k) continue; const [jx,jy]=toScreen(j.x,j.y); emitDisc(jx, jy, j.r*S, j.th*P.junkOpacity, j.tint, 0, 0); }
      if (k===K_SLABS-1){ for (const f of world._foodBits.values()){ if (f.getAlive()) tessFood(f); } }
      junkCount[k] = (o/9) - junkStart[k];
    }
  }
  gl.viewport(0, 0, W, H);
  gl.bindVertexArray(bodyVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, bodyVBO);
  gl.bufferData(gl.ARRAY_BUFFER, buf.subarray(0, o), gl.DYNAMIC_DRAW);   // upload all body slabs once
  gl.bindVertexArray(null);
  if (ho > 0){                                                          // upload all hair slabs once
    gl.bindVertexArray(hairVAO); gl.bindBuffer(gl.ARRAY_BUFFER, hairVBO);
    gl.bufferData(gl.ARRAY_BUFFER, hairBuf.subarray(0, ho), gl.DYNAMIC_DRAW);
    gl.bindVertexArray(null);
  }

  // ---- clear the FRONT accumulator (emitted=0, frontAbsorb=0); it seeds the front-to-back sweep ----
  let prev = accA, next = accB;
  gl.bindFramebuffer(gl.FRAMEBUFFER, prev.fbo);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);

  // ---- sweep slabs front -> back: render each slab's thickness, then fold it into the running composite ----
  for (let k=0;k<K_SLABS;k++){
    gl.bindFramebuffer(gl.FRAMEBUFFER, slabFBO);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND); gl.blendEquation(gl.FUNC_ADD); gl.blendFunc(gl.ONE, gl.ONE);
    gl.bindVertexArray(bodyVAO);
    if (segCount[k] > 0){   // creature segments -> cytoplasm + grain
      gl.useProgram(bodyProg); gl.uniform2f(uBodyRes, W, H);
      gl.uniform1f(uBodyCyto, P.cyto); gl.uniform1f(uBodyCells, P.cells); gl.uniform1f(uBodyLighten, P.lighten);
      gl.uniform1f(uBodyGrain, P.grain); gl.uniform1f(uBodyGrainScale, P.grainScale); gl.uniform1f(uBodySat, P.desat);
      gl.uniform1f(uBodyTime, hairTime); gl.uniform1f(uBodyCytoDrift, P.cytoDrift);
      gl.drawArrays(gl.TRIANGLES, slabStart[k], segCount[k]);
    }
    if (junkCount[k] > 0){   // detritus + food -> plain thickness discs (no cyto/grain)
      gl.useProgram(junkProg); gl.uniform2f(uJunkRes, W, H); gl.uniform1f(uJunkSoft, P.junkSoft);
      gl.drawArrays(gl.TRIANGLES, junkStart[k], junkCount[k]);
    }
    gl.bindVertexArray(null);
    gl.disable(gl.BLEND);
    // this slab's hairs -> hairTex (additive glow; the resolve then depth-attenuates it)
    gl.bindFramebuffer(gl.FRAMEBUFFER, hairFBO);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    if (P.hair > 0 && hairCount[k] > 0){
      gl.useProgram(hairProg);
      gl.uniform2f(uHairRes, W, H); gl.uniform3f(uHairColor, 1.0, 1.0, 0.97); gl.uniform1f(uHairBright, P.hair);
      gl.enable(gl.BLEND); gl.blendEquation(gl.FUNC_ADD); gl.blendFunc(gl.ONE, gl.ONE);
      gl.bindVertexArray(hairVAO);
      gl.drawArrays(gl.TRIANGLES, hairStart[k], hairCount[k]);
      gl.bindVertexArray(null); gl.disable(gl.BLEND);
    }
    // resolve: prev accumulator + this slab (body + hairs) -> next accumulator
    gl.bindFramebuffer(gl.FRAMEBUFFER, next.fbo);
    gl.useProgram(resolveProg);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, slabTex);  gl.uniform1i(uR.uSlab, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, prev.out); gl.uniform1i(uR.uPrevOut, 1);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, prev.fa);  gl.uniform1i(uR.uPrevFA, 2);
    gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, hairTex);  gl.uniform1i(uR.uHairTex, 3);
    gl.uniform2f(uR.uRes, W, H); gl.uniform1f(uR.uField, P.field); gl.uniform1f(uR.uDensity, P.density);
    gl.uniform1f(uR.uOpacity, P.opacity); gl.uniform1f(uR.uRim, P.rim); gl.uniform1f(uR.uSub, P.subsurface);
    gl.uniform1f(uR.uScaleRatio, sc() / SC_REF);
    gl.bindVertexArray(emptyVAO); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.bindVertexArray(null);
    const tmp = prev; prev = next; next = tmp;   // prev now holds the just-written composite
  }

  // ---- final: backlight through all gel + accumulated emission -> sceneTex (so bloom can post-process it) ----
  gl.bindVertexArray(emptyVAO);
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO);
  gl.useProgram(finalProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, prev.out); gl.uniform1i(uF.uOut, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, prev.fa);  gl.uniform1i(uF.uFA, 1);
  gl.uniform2f(uF.uRes, W, H); gl.uniform1f(uF.uField, P.field);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // (hairs are folded into each slab's resolve above, so they depth-attenuate)

  // ---- bloom: bright-pass -> blur H -> blur V, then composite scene + bloom -> screen ----
  if (P.bloom > 0){
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomAFBO);
    gl.useProgram(brightProg); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.uniform1i(uBr.uScene, 0); gl.uniform1f(uBr.uThresh, P.bloomThresh); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.useProgram(blurProg);
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomBFBO); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, bloomA);
    gl.uniform1i(uBl.uTex, 0); gl.uniform2i(uBl.uDir, 3, 0); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomAFBO); gl.bindTexture(gl.TEXTURE_2D, bloomB);
    gl.uniform2i(uBl.uDir, 0, 3); gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  // ---- COMPOSITE this view into its REGION of the canvas (viewport = region; uOrigin maps fragcoord -> view texels) ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(regionX, regionY, W, H);
  gl.useProgram(postProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneTex); gl.uniform1i(uPo.uScene, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomA);   gl.uniform1i(uPo.uBloom, 1);
  gl.uniform1f(uPo.uStrength, P.bloom);   // 0 => bloom (possibly stale) contributes nothing
  gl.uniform2i(uPo.uOrigin, regionX, regionY);
  gl.uniform2f(uPo.uViewSize, W, H); gl.uniform1f(uPo.uRound, roundPx);   // rounded corners (same radius on every view)
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindVertexArray(null);

  // ---- wall marking the world boundary: a FIXED-WORLD-THICKNESS frame drawn ENTIRELY OUTSIDE the play area (never
  //      covers it), so it scales with zoom -- ~5px when the whole pool fits (zoom 1) and thicker as you zoom in. ----
  //      SKIPPED for tiles: at tile zoom the wall is huge (thick*zoom) and its darkening quads blacken a tile whose
  //      specimen sits near a pool edge. Tiles are interior close-ups; the boundary isn't meaningful there.
  if (drawWall) {
    const T = P.wallThick * cam.zoom;   // wall thickness (screen px): P.wallThick at zoom 1, scales with zoom
    const a = toScreen(0,0), c = toScreen(P.pool, P.pool);
    const x0=Math.min(a[0],c[0]), x1=Math.max(a[0],c[0]), y0=Math.min(a[1],c[1]), y1=Math.max(a[1],c[1]);
    const R=(rx0,ry0,rx1,ry1)=>[rx0,ry0, rx1,ry0, rx1,ry1,  rx0,ry0, rx1,ry1, rx0,ry1];
    gl.useProgram(boxProg); gl.uniform2f(uBoxRes, W, H);
    gl.enable(gl.BLEND); gl.blendEquation(gl.FUNC_ADD); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindVertexArray(boxVAO); gl.bindBuffer(gl.ARRAY_BUFFER, boxVBO);
    // 1) DARKEN everything outside the wall's outer edge (semi-transparent black; clipped to the canvas). Four quads that
    //    tile the outside region without overlap, so the alpha darkening is even (no double-darkened seams).
    if (P.wallDark > 0){
      const ox0=x0-T, oy0=y0-T, ox1=x1+T, oy1=y1+T;
      const dv = new Float32Array([
        ...R(0, 0,   W,   oy0),   // above the wall
        ...R(0, oy1, W,   H),     // below
        ...R(0, oy0, ox0, oy1),   // left
        ...R(ox1, oy0, W, oy1),   // right
      ]);
      gl.uniform4f(uBoxColor, 0, 0, 0, P.wallDark);
      gl.bufferData(gl.ARRAY_BUFFER, dv, gl.DYNAMIC_DRAW);
      gl.drawArrays(gl.TRIANGLES, 0, dv.length/2);
    }
    // 2) the WALL frame itself (opaque black), just OUTSIDE the play area [x0,x1]x[y0,y1] -- never covers the interior
    const bv = new Float32Array([
      ...R(x0-T, y0-T, x1+T, y0),   // top
      ...R(x0-T, y1,   x1+T, y1+T), // bottom
      ...R(x0-T, y0,   x0,   y1),   // left
      ...R(x1,   y0,   x1+T, y1),   // right
    ]);
    gl.uniform4f(uBoxColor, 0, 0, 0, 1.0);
    gl.bufferData(gl.ARRAY_BUFFER, bv, gl.DYNAMIC_DRAW);
    gl.drawArrays(gl.TRIANGLES, 0, bv.length/2);
    gl.bindVertexArray(null); gl.disable(gl.BLEND);
  }
  } finally { cam = _cam; W = _W; H = _H; }   // restore the active view to the canvas view
}

// The whole frame: advance per-frame state once, clear the canvas, then render the main view into the left 768^2.
// (Species tiles render into the right 256-wide column next — step 3.)
function render(){
  if (!gl) return;
  advanceFrame();
  if (world && (frameCount % SPECIES_RECOMPUTE) === 0){ computeSpecies(); updateTileLabels(); }   // recluster + refresh tiles
  frameCount++;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, CANVAS_W, CANVAS_H);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);          // clear regions not covered by a view
  renderView(cam, VIEW_MAIN, VIEW_MAIN, mainSet, 0, 0, true, VIEW_ROUND);   // main micrograph: left 768^2 (GL origin bottom-left)
  // three species tiles, stacked in the right column (top = largest species). Fixed shared zoom -> comparable sizes.
  for (let s = 0; s < 3; s++){
    const id = slotIds[s]; if (id == null) continue;                 // empty slot -> black tile
    const r = speciesById.get(id); if (!r || !r.t) continue;
    let rep = r.t.rep;
    if (!rep || !rep.getAlive()){                                    // rep died between reclusters -> re-pick a living member
      const alt = r.members.find(m => m.sb.getAlive()); if (!alt) continue;
      rep = r.t.rep = alt.sb;
    }
    const c = rep.getPosition();
    renderView({ x: c.x, y: c.y, zoom: TILE_ZOOM }, VIEW_SMALL, VIEW_SMALL, smallSet, VIEW_MAIN, VIEW_SMALL * (2 - s), false, VIEW_ROUND, rep);
  }
  // ---- 5px black gutters between the views (main | tile-column, and between the three tiles) ----
  {
    const G = 5, h = G / 2;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, CANVAS_W, CANVAS_H);
    gl.useProgram(boxProg); gl.uniform2f(uBoxRes, CANVAS_W, CANVAS_H); gl.uniform4f(uBoxColor, 0, 0, 0, 1);
    const R = (x0,y0,x1,y1) => [x0,y0, x1,y0, x1,y1, x0,y0, x1,y1, x0,y1];   // screen space (top-left origin)
    const g = new Float32Array([
      ...R(VIEW_MAIN - h, 0, VIEW_MAIN + h, CANVAS_H),                    // vertical: main | column
      ...R(VIEW_MAIN, VIEW_SMALL - h, CANVAS_W, VIEW_SMALL + h),          // horizontal: tile 0 | 1
      ...R(VIEW_MAIN, VIEW_SMALL*2 - h, CANVAS_W, VIEW_SMALL*2 + h),      // horizontal: tile 1 | 2
    ]);
    gl.bindVertexArray(boxVAO); gl.bindBuffer(gl.ARRAY_BUFFER, boxVBO);
    gl.bufferData(gl.ARRAY_BUFFER, g, gl.DYNAMIC_DRAW);
    gl.drawArrays(gl.TRIANGLES, 0, g.length / 2);
    gl.bindVertexArray(null);
  }
}

let loopStopped = false;   // golden capture stops the rAF loop ENTIRELY (running only gates ticks, not render)
function loop(){
  if (loopStopped) return;
  if (running && world){ for (let i=0;i<ticksPerFrame;i++) world.tick(); }
  render();
  requestAnimationFrame(loop);
}

// ================================================================== controls
document.getElementById('play').onclick = (e)=>{ running=!running; e.target.textContent = running?'Pause':'Play'; };
document.getElementById('reset').onclick = ()=>{ seed++; build(); };
document.getElementById('seedIn').onchange = (e)=>{ const v=parseInt(e.target.value,10); seed=Number.isFinite(v)&&v>=0?v:0; build(); };
const speed=document.getElementById('speed'); speed.oninput=()=>{ ticksPerFrame=+speed.value; document.getElementById('speedv').textContent=ticksPerFrame+'×'; };
cv.addEventListener('wheel', (e)=>{ e.preventDefault(); const f=Math.exp(-e.deltaY*0.0015); cam.zoom=Math.max(0.5, Math.min(60, cam.zoom*f)); }, {passive:false});
let dragging=false, lastX=0, lastY=0;
cv.addEventListener('mousedown', (e)=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; cv.classList.add('drag'); });
window.addEventListener('mouseup', ()=>{ dragging=false; cv.classList.remove('drag'); });
window.addEventListener('mousemove', (e)=>{ if(!dragging) return; const s=sc(); cam.x -= (e.clientX-lastX)/s; cam.y -= (e.clientY-lastY)/s; lastX=e.clientX; lastY=e.clientY; });


// ---- deterministic golden-capture hook (INERT unless called; see docs/PLAN-visual-goldens.md) ----
// Stops the rAF loop, rebuilds at a fixed seed, advances/renders a fixed amount, returns raw default-framebuffer RGBA.
// The render is a pure function of (seed, ticks, frames, opts); no wall-clock/random/DPR anywhere.
//   camOv  = {x?,y?,zoom?,focus?}  pick a view (focus:'biggest' centres on the largest grown living specimen).
//   opts.interleave = N > 0  => advance N ticks BETWEEN renders (tick N, render, repeat) so the death-fade path
//     (deathTick/fades, updated inside render()) actually populates — a plain ticks-then-render never exercises it.
// Returns {w,h,b64, thickFmt:'RGBA16F'|'RGBA8', floatRT, fading} (fading = count of mid-fade dead ghosts in-frame).
window.__golden = function(s, ticks, frames, camOv, opts){
  opts = opts || {};
  loopStopped = true; running = false;
  seed = (s>>>0); cam.zoom = 6; build();
  gl.disable(gl.DITHER);
  const applyCam = () => {
    if (!camOv) return;
    cam = { x: camOv.x ?? P.pool/2, y: camOv.y ?? P.pool/2, zoom: camOv.zoom ?? 6 };
    if (camOv.focus === 'biggest' && world){      // centre on the largest grown living specimen (most grain to judge)
      let best=null, bestR=-1;
      for (const [id, sb] of world._swimbots){
        if (!sb.getAlive()) continue;
        const ph = sb._phenotype; if (!ph || ph.numParts <= 1) continue;
        if ((sb._growthScale ?? 1) < 0.9) continue;
        const c = sb.getPosition(); let wr=0;
        for (let q=1;q<ph.numParts;q++){ const dx=ph.parts[q].position.x-c.x, dy=ph.parts[q].position.y-c.y, d=dx*dx+dy*dy; if (d>wr) wr=d; }
        if (wr > bestR){ bestR=wr; best=c; }
      }
      if (best){ cam.x = best.x; cam.y = best.y; }
    }
  };
  const T = ticks|0, every = opts.interleave|0;
  if (every > 0){                                 // interleaved tick->render (exercises death-fade)
    applyCam();                                   // static cam across the interleave
    let done = 0;
    while (done < T){ const step = Math.min(every, T - done); for (let i=0;i<step;i++) world.tick(); done += step; render(); }
    if (T === 0) render();
  } else {
    for (let i=0; i<T; i++) world.tick();
    applyCam();                                   // apply AFTER ticks so focus sees settled positions
    for (let f=0; f<Math.max(1, frames|0); f++) render();
  }
  let fading = 0; for (const v of fades.values()) if (v > 0 && v < 1) fading++;
  const w = cv.width, h = cv.height, px = new Uint8Array(w*h*4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let str=''; for (let i=0;i<px.length;i+=8192) str += String.fromCharCode.apply(null, px.subarray(i, i+8192));
  const floatRT = !!(thickFmt && thickFmt.internal === gl.RGBA16F);
  const species = speciesList.slice(0,4).map(r => ({ n: r.count, sig: r.t ? r.t.sig : null,
    alive: !!(r.t && r.t.rep && r.t.rep.getAlive()) }));
  return { w, h, b64: btoa(str), thickFmt: floatRT ? 'RGBA16F' : 'RGBA8', floatRT, fading, species };
};

function boot(){
  if (gl){ initGL(); build(); requestAnimationFrame(loop); }   // params are baked into P; no live panel / runtime file
}
boot();
</script>
