<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GenePool — micrograph (GL)</title>
<style>
  @font-face { font-family: 'OCR A'; src: url('fonts/OCRA.ttf') format('truetype'); font-display: swap; }   /* self-hosted, GPL/free */
  /* Quicksand (OFL, variable) = the app CHROME font (bottom bar + K/graph panels): rounded/soft, to contrast the boxy
     OCR A the VIEWERS keep for specimen data. One variable woff2 covers the 300-700 weight axis. */
  @font-face { font-family: 'Quicksand'; font-weight: 300 700; src: url('fonts/Quicksand.woff2') format('woff2'); font-display: swap; }
  :root { color-scheme: dark; --ui-font: 'Quicksand', 'Segoe UI', system-ui, sans-serif; }   /* chrome font stack */
  body { margin: 0; background: #0b0e13; color: #cfd6e0; font: 13px/1.5 "OCR A", ui-monospace, "SF Mono", Menlo, monospace; }
  button, input, select, textarea, h1 { font-family: inherit; }   /* whole app uses OCR A ("our new font"), self-hosted above */
  header { padding: 8px 14px; background: #11161f; border-bottom: 1px solid #1e2733; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 8px; }
  h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; letter-spacing: .02em; }
  label { display: inline-flex; gap: 6px; align-items: center; user-select: none; font-size: 12px; }
  button { background: #1c2836; color: #cfd6e0; border: 1px solid #2b3a4d; border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  button:hover { background: #24344a; }
  /* video record button: a red circle icon; pulses while recording */
  .vidrec { display: inline-flex; align-items: center; justify-content: center; }   /* sized with the speed buttons (see #scrubbar rule) */
  .vidrec::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: #e03b3b; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  .vidrec[hidden] { display: none; }   /* author display:inline-flex beats UA [hidden] -> override so it stays hidden in the browser */
  .vidrec.recording::before { animation: recpulse 1s ease-in-out infinite; }
  @keyframes recpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  body.desktop #seedLabel { display: none; }   /* desktop: the bottom-bar SEED/FILE toggle owns seed selection */
  input[type=number] { width: 66px; background: #0b0e13; color: #cfd6e0; border: 1px solid #2b3a4d; border-radius: 6px; padding: 3px 6px; }
  .hud { margin-left: auto; font-variant-numeric: tabular-nums; color: #8fa0b5; }
  .hud b { color: #cfd6e0; font-weight: 600; }
  .params { color: #8fa0b5; }
  #err { color: #ff8f8f; }
  #wrap { display: flex; justify-content: center; padding: 14px; }
  #stage { position: relative; display: flex; gap: 5px; line-height: 0; }   /* main canvas | species panel */
  #canvasBox { position: relative; line-height: 0; }                        /* holds #cv + the absolute #labMain */
  #cv { border-radius: 12px; box-shadow: 0 6px 30px rgba(0,0,0,.5); cursor: grab; touch-action: none; }
  #cv.drag { cursor: grabbing; }
  #species { width: 256px; height: 768px; overflow-y: auto; scrollbar-gutter: stable; line-height: normal;
    background: #0b0e13; border-radius: 12px; padding: 0 0 4px; box-sizing: border-box; }   /* scrollable list of ALL species; no top pad -> first card sits flush with the canvas top */
  #species .srow:first-child { margin-top: 0; }   /* first entry's top aligns perfectly with the top of the main view */
  /* The row is a SINGLE grid cell holding both the info and the mini, STACKED. Collapsed: the mini is clipped to 0 and
     the card (the row's field-vignette bg) shows, sized by the info. Expanded: the mini reveals to the square and the
     info overlays its top-left at the SAME (8,8) inset -> it lines up as it opens/closes. The card bg is the SAME backlit
     field vignette the live micrograph draws -- warm-white centre rgb(174,176,167) darkening radially to the edges. */
  /* The row IS the live mini "display". It GROWS: the mini fills the row and its height animates from a small collapsed
     box to a full square (100cqw); object-fit:fill squashes the square render into the current rect, so the backlit
     vignette always fills + re-centres in the visible rectangle -- it reads as the display growing. --srow-bg (the same
     field vignette, gain/gamma-toned) shows behind until the mini has rendered. Info overlays the top-left in both states. */
  #species .srow { position: relative; margin: 6px 8px; cursor: pointer; container-type: inline-size; border-radius: 12px; overflow: hidden;
    background: var(--srow-bg, radial-gradient(ellipse at 50% 50%, rgb(174,176,167) 0%, rgb(163,165,156) 61%, rgb(141,143,134) 100%)); box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  #species .srow:hover { box-shadow: 0 1px 8px rgba(0,0,0,.6); }
  #species .srow > .info { position: absolute; top: 8px; left: 8px; z-index: 1; box-sizing: border-box;
    color: #000; font-family: "OCR A", ui-monospace, "SF Mono", Menlo, monospace; line-height: 1.15; }
  #species .srow .info .plate { margin-top: 0; }
  #species .srow > .miniwrap { height: 66px; overflow: hidden; transition: height 340ms cubic-bezier(0.6, 0, 0.9, 0.1); }
  #species .srow.exp > .miniwrap { height: 100cqw; }   /* the "screen" grows to a square (= row width); the --srow-bg vignette shows the whole time */
  #species .srow .miniclip { height: 100cqw; }         /* the square render area, top-anchored + clipped by the growing miniwrap (NOT scaled) */
  #species .srow canvas.mini { display: block; width: 100%; height: 100%; border-radius: 12px;
    opacity: 0; transition: opacity 340ms cubic-bezier(0.6, 0, 0.9, 0.1); }   /* swimmer + effects FADE IN as the viewer comes online; collapsed = vignette only */
  #species .srow.exp canvas.mini { opacity: 1; }
  /* a NEW species row fades in as the rows below slide down (FLIP) to make room */
  #species .srow.entering { animation: rowIn 340ms cubic-bezier(.6,0,.9,.1); }
  @keyframes rowIn { from { opacity: 0; } to { opacity: 1; } }
  /* species-tile count labels: HTML overlay over the right column (NOT drawn into the canvas, so goldens stay text-free) */
  /* science-lab label: black, no shadow, technical monospace (IBM Plex Mono) -> reads like specimen data */
  .tileLabel { position: absolute; left: 12px; text-align: left; pointer-events: none; line-height: 1.25;
    color: #000; font-family: "OCR A", ui-monospace, "SF Mono", Menlo, monospace; }
  /* .n / .d NOT scoped to .tileLabel -- reused in the #species .info blocks too */
  .crow { display: flex; align-items: center; gap: 7px; }   /* population count + lifespan circles on one row */
  .n { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .circs { display: inline-flex; gap: 3px; }
  .circ { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #35c46a; }   /* lifespan: 0-3 green circles */
  .dbar { width: 90px; height: 7px; margin-top: 3px; background: rgba(128,128,128,.22); border-radius: 2px; overflow: hidden; }  /* diversity gauge: max = plate width */
  .dfill { height: 100%; background: #000; }   /* INVERTED: 0 diversity -> full black bar, 100 diversity -> empty */
  /* license plate as a colour barcode: one cell per character, hue = that character's value (0-9A-Z -> around the wheel).
     NOT scoped to .tileLabel -- the plate is reused bare in the flowed .srow list rows too. */
  .plate { display: inline-flex; gap: 0; margin-top: 3px; }
  .cell { display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    width: 18px; height: 20px; font-size: 13px; font-weight: 600; color: #000; overflow: hidden; }
  .cell .g { display: block; width: 18px; height: 20px;   /* glyph is a pre-centred bitmap (see measurePlateGlyphs) */
    background-repeat: no-repeat; background-position: center; background-size: 18px 20px; }
  #labMain { top: 12px; left: 12px; }   /* total population, top-LEFT of the main view (anchored to #canvasBox) */
  /* selection ring: a thin black circle ~10% larger than the selected swimmer, centred on him. Its WORLD size is frozen at
     select (updateSelRing sets width/height each frame from the frozen radius x zoom -> the circle scales with zoom but the
     1.5px line stays thin at every zoom; transform:scale would fatten the line). */
  #selClip { position: absolute; inset: 0; z-index: 4; overflow: hidden; pointer-events: none; border-radius: 12px; }   /* clip the ring to the main view (matches #cv's rounded corners) so it never spills onto the species panel */
  #selRing { position: absolute; box-sizing: border-box; border: 0.75px solid #000; border-radius: 50%; transform: translate(-50%, -50%); }
  #selRing[hidden] { display: none; }
  /* debug FPS/hair HUD, top-RIGHT of the main view (DOM overlay -> does not touch the canvas goldens) */
  #fpsHud { position: absolute; top: 12px; right: 12px; z-index: 5; pointer-events: none; font: 11px "OCR A", ui-monospace, "SF Mono", Menlo, monospace;
    color: #7fd0a0; background: #0b0e13cc; padding: 2px 7px; border-radius: 5px; font-variant-numeric: tabular-nums; }
  /* scrub/playback bottom bar (desktop only) */
  #scrubbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; align-items: center; gap: 14px;
    padding: 8px 16px; background: #0d1117f2; border-top: 1px solid #1e2733; backdrop-filter: blur(4px);
    font: 500 13px var(--ui-font); color: #9fb0c3; }
  #scrubbar label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #scrubbar #sbSlider { flex: 1; min-width: 120px; }
  #scrubbar button { min-width: 36px; cursor: pointer; }
  #scrubbar #sbSource { display: inline-flex; align-items: center; gap: 6px; }
  #scrubbar #sbModeToggle { min-width: 52px; font-weight: 600; letter-spacing: 0.06em; }   /* the SEED/FILE toggle */
  #scrubbar #sbFileBtns { display: inline-flex; gap: 4px; }
  #scrubbar #sbFileBtns[hidden] { display: none; }   /* author display:inline-flex beats the UA [hidden] rule -> override so SEED mode hides LOAD/SAVE */
  #scrubbar #sbTime { font-variant-numeric: tabular-nums; min-width: 172px; text-align: right; color: #c7d3e0; }
  #scrubbar #sbSpeeds { display: inline-flex; align-items: center; gap: 4px; }
  /* record + play + all FF buttons: ONE identical size, glyphs flex-centred (line-height:1 removes the line-box slack that
     was throwing the play triangle off vertically). */
  #scrubbar .sbSpeed, #scrubbar .vidrec { box-sizing: border-box; width: 44px; height: 30px; min-width: 44px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center; line-height: 1;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; }   /* NOT OCR-A: it lacks the ▶ glyph, and mixing its line metrics with the fallback glyph threw the triangle off vertically */
  /* 2-4x: negative letter-spacing overlaps the glyphs, but a browser keeps the trailing letter-space after the LAST
     glyph too, so the cluster centres 0.17em right of true centre. A padding-right of one full letter-space shifts the
     centring box back left by exactly that -- and since the trailing space is always ONE letter-space regardless of
     count, this single rule centres 2x, 3x and 4x identically. */
  #scrubbar .sbSpeed[data-n="1"], #scrubbar .sbSpeed[data-n="2"], #scrubbar .sbSpeed[data-n="3"] {
    letter-spacing: -0.34em; padding-right: 0.34em; }
  /* single ▶ (1×): no overlap; nudge right to optically centre the left-heavy right-pointing glyph */
  #scrubbar .sbSpeed[data-n="0"] { padding-left: 2px; }
  #scrubbar .sbSpeed.active { background: #2e7d5b; border-color: #3aa06f; color: #fff; }
  /* desktop app: the main micrograph FILLS the window (the browser keeps the fixed 768^2 layout -> goldens unchanged) */
  body.desktop { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  body.desktop #wrap { flex: 1; min-height: 0; padding: 8px; }
  body.desktop #stage { flex: 1; min-height: 0; }
  body.desktop #canvasBox { flex: 1; min-width: 0; }
  body.desktop #cv { width: 100%; height: 100%; border-radius: 12px; box-shadow: none; }
  body.desktop #species { height: auto; align-self: stretch; }   /* list keeps its 256px width; fills the height */
  body.desktop #scrubbar { position: static; }                    /* in normal flow at the bottom (not overlaying the fill) */
  /* live constants editor (K): a tall thin fixed column on the LEFT. Scroll region + pinned buttons. */
  #kpanel { position: fixed; top: 8px; left: 8px; bottom: 8px; width: 214px; z-index: 60; display: flex; flex-direction: column;
    background: #0d1117f2; border: 1px solid #1e2733; border-radius: 10px; backdrop-filter: blur(4px);
    font: 500 12px var(--ui-font); color: #9fb0c3; box-shadow: 0 6px 30px rgba(0,0,0,.5); }
  #kpanel[hidden] { display: none; }   /* author display:flex beats the UA [hidden] rule -> MUST override explicitly */
  #kpanelRows { flex: 1; overflow-y: auto; scrollbar-gutter: stable; padding: 8px 8px 4px; }
  #kpanel .krow { display: grid; grid-template-columns: 56px 1fr 46px; align-items: center; gap: 5px; margin-bottom: 3px; }
  #kpanel .klabel { color: #8fa0b5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #kpanel .krow input[type=range] { width: 100%; min-width: 0; margin: 0; }
  #kpanel .krow input[type=number] { width: 46px; background: #0b0e13; color: #cfd6e0; border: 1px solid #2b3a4d; border-radius: 5px; padding: 2px 3px; font: 500 11px var(--ui-font); }
  #kpanelBtns { display: flex; gap: 6px; padding: 8px; border-top: 1px solid #1e2733; }
  #kpanelBtns button { flex: 1; background: #1c2836; color: #cfd6e0; border: 1px solid #2b3a4d; border-radius: 6px; padding: 6px 4px; cursor: pointer; font-size: 11px; }
  #kpanelBtns button:hover { background: #24344a; }
  /* whole-timeline history graph (G): a glass panel overlaying the main view, same material as #kpanel. */
  #graph { position: absolute; top: 22px; left: 22px; right: 22px; bottom: 22px; z-index: 40; display: flex; flex-direction: column;
    background: #0d1117f2; border: 1px solid #1e2733; border-radius: 10px; backdrop-filter: blur(4px);
    font: 500 12px var(--ui-font); color: #9fb0c3; box-shadow: 0 6px 30px rgba(0,0,0,.5); }
  #graph[hidden] { display: none; }   /* author display:flex beats the UA [hidden] rule -> MUST override explicitly */
  #graphHead { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 9px 14px; border-bottom: 1px solid #1e2733; }
  #graphTitle { color: #8fa0b5; letter-spacing: 0.14em; font-size: 11px; }
  #graphLegend { display: inline-flex; gap: 14px; letter-spacing: 0.06em; }
  #graphLegend .glg { display: inline-flex; align-items: center; gap: 6px; color: #8fa0b5; }
  #graphLegend .sw { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }
  #graphLegend .sw.pop { background: #d9a441; color: #d9a441; }
  #graphLegend .sw.food { background: #7fd0a0; color: #7fd0a0; }
  #graphLegend .sw.div { background: #6cb8e6; color: #6cb8e6; }
  #graphLegend .sw.life { background: #cf8fd4; color: #cf8fd4; }
  #graphLegend .glg { cursor: pointer; transition: opacity 120ms; }   /* click to pick which metric labels the left axis */
  #graphLegend .glg:not(.sel) { opacity: 0.45; }                      /* the selected metric stays lit; others dim */
  #graphPlot { position: relative; flex: 1; min-height: 0; }
  #graphCanvas { display: block; width: 100%; height: 100%; }
  #graphEmpty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #5c6b80; letter-spacing: 0.08em; }
  #graphEmpty[hidden] { display: none; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>GenePool · micrograph <span style="color:#5c6b80">· WebGL2</span></h1>
    <button id="play">Pause</button>
    <button id="reset">Reset</button>
    <label id="seedLabel">Seed <input id="seedIn" type="number" min="0" step="1" value="1"></label>   <!-- browser only; desktop uses the bottom-bar SEED/FILE toggle -->

    <label>Speed <input id="speed" type="range" min="1" max="60" value="3"> <span id="speedv">3×</span></label>

  </div>
  <div class="row"><span id="err"></span> <span style="color:#5c6b80">scroll = zoom · drag = pan</span></div>
</header>
<div id="wrap"><div id="stage">
  <div id="canvasBox"><canvas id="cv" width="768" height="768"></canvas>
    <div class="tileLabel" id="labMain"></div>
    <div id="selClip"><div id="selRing" hidden></div></div>   <!-- selRing = thin ring around the selected swimmer (frozen size, tracks him); clipped to the main view so it can't spill onto the species panel -->
    <div id="fpsHud" hidden></div>   <!-- hidden by default; press F to toggle (see keydown handler) -->
    <!-- whole-timeline history graph (population + food); overlays the main view, toggle with the G key. -->
    <div id="graph" hidden>
      <div id="graphHead">
        <span id="graphTitle">TIMELINE</span>
        <span id="graphLegend">
          <span class="glg sel" data-m="pop"><i class="sw pop"></i>POPULATION</span>
          <span class="glg" data-m="food"><i class="sw food"></i>FOOD</span>
          <span class="glg" data-m="div"><i class="sw div"></i>DIVERSITY</span>
          <span class="glg" data-m="life"><i class="sw life"></i>LIFESPAN</span>
        </span>
      </div>
      <div id="graphPlot"><canvas id="graphCanvas"></canvas><div id="graphEmpty" hidden>no timeline yet</div></div>
    </div>
  </div>
  <div id="species"></div>
</div></div>
<footer id="scrubbar" hidden>
  <!-- SEED/FILE toggle: click the label to switch. SEED shows the seed input; FILE shows LOAD + SAVE (state file). -->
  <span id="sbSource">
    <button id="sbModeToggle" title="switch between Seed and File">SEED</button>
    <input id="sbSeed" type="number" min="0" step="1" value="1">
    <span id="sbFileBtns" hidden><button id="sbLoad">LOAD</button> <button id="sbSave">SAVE</button></span>
  </span>
  <span id="sbSpeeds">
    <button id="vidRec" class="vidrec" title="record a video of the viewer (click to start, click to stop)"></button>
    <button class="sbSpeed" data-n="0" title="play 1×">▶</button>
    <button class="sbSpeed" data-n="1" title="fast 2×">▶▶</button>
    <button class="sbSpeed" data-n="2" title="faster 4×">▶▶▶</button>
    <button class="sbSpeed" data-n="3" title="fastest 8×">▶▶▶▶</button>
  </span>
  <input id="sbSlider" type="range" min="0" max="0" value="0" step="1">
  <span id="sbTime">00:00 / 00:00</span>
</footer>
<!-- live visual-constants editor; toggle with the K key ("kConstants"). Rows are built from SPEC in JS. -->
<aside id="kpanel" hidden>
  <div id="kpanelRows"></div>
  <div id="kpanelBtns">
    <button id="kReset" title="revert to your last saved set">Reset to defaults</button>
    <button id="kSave" title="make the current look your default (persists)">Save to defaults</button>
  </div>
</aside>

<script type="module">
import { World } from './engine/world.js';
import { Genotype } from './engine/genotype.js';
import { createSpeciesAnalyzer, SIG_ALPHA, SPECIES_ISO } from './engine/analysis/species.mjs';
import { makeStandardWorld } from './engine/pool-seed.mjs';

const NUM_GENES = 256, USED = 112, YOUNG_AGE = 1000, MAX_LIFESPAN = 40000, EGG_SIZE = 5, SPLINE = 0.4;
const cv = document.getElementById('cv');
let CANVAS_W = cv.width, CANVAS_H = cv.height;      // backing-store size; the desktop app resizes these to FILL the window
const VIEW_MAIN = 768, VIEW_SMALL = 256;           // browser main micrograph = 768^2; species tiles = 256^2
const VIEW_ROUND = 12;                              // corner radius (px) — SAME on every view (main + tiles)
let mainW = VIEW_MAIN, mainH = VIEW_MAIN, mainRound = VIEW_ROUND;   // dynamic MAIN view (desktop fills the window); = VIEW_MAIN/round in the browser
let W = cv.width, H = cv.height;                    // ACTIVE view size — renderView sets this per view, then restores
const errEl = document.getElementById('err');

function mulberry32(seed){let a=seed>>>0;return()=>{a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function diskPoint(rng, cx, cy, r){ const rad = 2*Math.PI*rng(); const mag = r*Math.sqrt(rng()); return { x: cx + Math.cos(rad)*mag, y: cy + Math.sin(rad)*mag }; }
const lerp=(a,b,t)=>a+(b-a)*t, mid=(a,b)=>[(a[0]+b[0])*0.5,(a[1]+b[1])*0.5];
const lerp3=(a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const smoothstep=(a,b,x)=>{ const t=Math.max(0,Math.min(1,(x-a)/(b-a))); return t*t*(3-2*t); };
function bez(a,b,c,d,t){ const m=1-t, m2=m*m, t2=t*t; const w0=m2*m,w1=3*m2*t,w2=3*m*t2,w3=t2*t;
  return [ w0*a[0]+w1*b[0]+w2*c[0]+w3*d[0], w0*a[1]+w1*b[1]+w2*c[1]+w3*d[1] ]; }

// ------------------------------------------------------------------ live look/params
const P = {
  pool: 3000, n: 220, food: 700,
  // --- defaults baked from Karl's tuned "Save Defaults" (2026-09-02); the live slider panel + runtime file were removed ---
  field: 0.68,      // condenser backlight brightness (0..1)
  density: 0.45,    // tinted (Beer-Lambert) absorption scale -- how strongly the gel eats its complementary colour
  opacity: 0.05,    // flat colourless absorption -- milky/opaque even for pale gel (independent of tint)
  lighten: 0.7,     // mix segment pigment toward white -> less tinted absorption, brighter specimen
  desat: 0.75,      // desaturate the rendered body colour toward grey (render only; hair/cyto/grain stay raw)
  rim: 1.05,        // refractive Becke-line rim strength
  subsurface: 0.6,  // how much the gel re-emits its own tint
  cyto: 0.25,       // cytoplasm: strength of the cellular density spots
  cells: 0.3,       // cytoplasm: cell frequency (bigger = smaller, denser spots)
  cytoDrift: 0.02,  // cytoplasm: gentle streaming speed (world units of drift per sim tick; 0 = static)
  grain: 0.25,      // grain: fine density speckle strength (driven by the blue component)
  grainScale: 2.0,  // grain fineness (bigger = finer)
  junk: 1.0,        // floating detritus amount (0..1 of the seeded pool)
  junkOpacity: 0.225, // detritus density/darkness (-25% visibility)
  junkSoft: 6.0,    // detritus edge softness (0.5 = sharp, higher = soft/out-of-focus) [Karl: doubled 3->6]
  hair: 0.15,       // hairs: glow brightness (0 = off)
  hairLen: 4,       // hair length (world units)
  hairSpace: 1,     // spacing between hairs along the perimeter (world units; smaller = denser)
  hairWid: 0.35,    // hair strand thickness (world units at the root)
  hairSway: 0.8,    // hair beat amplitude (radians of tip deflection)
  hairBeat: 0.06,   // beat speed (per sim tick)
  hairWave: 0.12,   // metachronal wavelength along the body (per world arc-unit)
  hairDrag: 1.0,    // how much the hairs trail/bend from the part's motion through the water
  hairLenJit: 0.35, // per-hair random LENGTH variation (fraction, +/-): each strand a bit longer/shorter
  hairAngJit: 0.30, // per-hair random ANGLE offset (radians, +/-): each strand splays a bit differently
  hairGrow: 0.38,   // growth fraction at which hairs start appearing (baby-hair gate; ramps to full ~0.4 above it)
  bloom: 0.2,       // full-image bloom strength (0 = off)
  bloomThresh: 0,   // brightness above which pixels bloom
  deathBlur: 2.5,   // soft-focus blur on dying swimmers (edge-feather exponent added as they fade out)
  deathFadeFloor: 0.45, // decompose BEGINS before death: a dying swimmer (aging/starving) fades toward this while still
                        // alive & twitching, reaching it at the moment of death, then dissolves the rest of the way to 0
  wallThick: 11,    // world-boundary wall thickness (screen px at zoom 1; scales with zoom)
  wallDark: 0.2,    // darkening of the region OUTSIDE the wall (0 = none .. 1 = black)
  hairFade: 0.1,    // LOD hair fade-out band width (larger = hairs fade over a wider zoom range = gentler)
  // --- final tone (POST_FS, applies to the main view AND the species minis) + license-plate brightness (DOM) ---
  gain: 1.0,        // output brightness multiply (1 = identity)
  gamma: 1.0,       // output gamma (1 = identity; >1 lifts midtones)
  plateBg: 0.74,    // species license-plate cell background brightness (oklch L, 0..1)
  plateInk: 0.0,    // species license-plate LETTER brightness (0 = black .. 1 = white)
  camSmooth: 0.125, // tracking-camera follow time constant, seconds (higher = smoother/steadier on a jittery swimmer,
                    // more lag on real travel; lower = snappier). A = 1-exp(-dt/camSmooth); 0.125 == the old -8*dt.
};
// Factory snapshot for the K-panel Reset baseline. MUST be taken here, BEFORE any localStorage merge (else Reset +
// the golden capture would key off a saved set instead of the baked look). See docs/PLAN-kconstants-panel.md.
const DEFAULTS = { ...P };

let seed = 1, world = null, running = true, ticksPerFrame = 3;
let cam = { x: P.pool/2, y: P.pool/2, zoom: 6 };
// Unified smoothing (Karl "A"): every input writes the TARGET camera; updateCamera eases the real `cam` toward it each
// frame (exp, time constant P.camSmooth). Drag/wheel/track all flow through the one smoother -> a cohesive, weighty feel
// with a little "give" on the grab. Hard camera resets (build/loadWorld) must re-sync camT so the ease doesn't fight them.
let camT = { x: cam.x, y: cam.y, zoom: cam.zoom };
// --- swimmer selection + camera animation (see docs/PLAN-swimmer-selection.md) ---
let selectedSb = null;            // the selected/tracked swimbot (a live World object; nulled on death/deselect/world-rebuild)
let selectionOpenedId = null;     // species-row id that selection auto-opened (provenance, so deselect closes only that one)
// camAnim.phase: 'idle' | 'zoom' (fixed-duration zoom-to) | 'track' (damped follow). tracking = keep following after zoom-to.
let camAnim = { phase: 'idle', tracking: false, t: 0, dur: 0.8, fromX: 0, fromY: 0, fromLZ: 0 };   // dur = zoom-to seconds (gentle, not whiplashy)
function fitZoom(){ return Math.min(W, H) / P.pool; }
function sc(){ return fitZoom() * cam.zoom; }
let SC_REF = (VIEW_MAIN / P.pool) * 6;   // reference scale (main view @ default zoom) -> rim brightness normalized to it; reset in build()
function toScreen(wx, wy){ const s = sc(); return [ (wx - cam.x)*s + W/2, (wy - cam.y)*s + H/2 ]; }

// ================================================================== WebGL2 setup
const gl = cv.getContext('webgl2', { antialias:false, premultipliedAlpha:false, alpha:false });
if (!gl){ errEl.textContent = 'WebGL2 not available in this browser.'; }

// half-float render target so thickness can accumulate past 1.0 (additive). iOS-safe: 16F + core blend (no float-blend ext).
let thickFmt = null;
if (gl){
  if (gl.getExtension('EXT_color_buffer_float')) thickFmt = { internal: gl.RGBA16F, type: gl.HALF_FLOAT };
  else if (gl.getExtension('EXT_color_buffer_half_float')) thickFmt = { internal: gl.RGBA16F, type: gl.HALF_FLOAT };
  else thickFmt = { internal: gl.RGBA8, type: gl.UNSIGNED_BYTE }; // fallback: thickness clips at 1 (degraded, still renders)
}

function makeShader(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)){ const log = gl.getShaderInfoLog(s); console.error('[shader]', log, '\n', src); errEl.textContent = 'Shader error: '+log; }
  return s;
}
function makeProgram(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, makeShader(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, makeShader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)){ const log = gl.getProgramInfoLog(p); console.error('[link]', log); errEl.textContent = 'Link error: '+log; }
  return p;
}

// --- body pass: tessellated segment geometry -> half-float thickness buffer (additive) ---
const BODY_VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;   // screen pixels
layout(location=1) in float aCU;   // profile coord across the segment: -1 edge .. 0 spine .. +1 edge
layout(location=2) in float aRad;  // local half-width (world units) = thickness radius at the spine
layout(location=4) in float aV;    // arc-length ALONG the body (world units) -- the other axis of body-space
layout(location=3) in vec3 aTint;  // gel pigment 0..1
layout(location=5) in float aBlur; // death soft-focus amount (0 alive -> higher as it dies)
uniform vec2 uRes;
out float vCU; out float vRad; out float vV; out vec3 vTint; out float vBlur;
void main(){
  vCU = aCU; vRad = aRad; vV = aV; vTint = aTint; vBlur = aBlur;
  vec2 clip = vec2(aPos.x / uRes.x * 2.0 - 1.0, 1.0 - aPos.y / uRes.y * 2.0);
  gl_Position = vec4(clip, 0.0, 1.0);
}`;
const BODY_FS = `#version 300 es
precision highp float;
in float vCU; in float vRad; in float vV; in vec3 vTint; in float vBlur;
uniform float uCyto, uCells, uLighten, uSat;   // cytoplasm amount, cell freq, lighten-to-white, desaturate (render only)
uniform float uGrain, uGrainScale;             // grain amount + fineness (driven by the BLUE component)
uniform float uTime, uCytoDrift;               // sim clock + gentle cytoplasmic-streaming speed (0 = static)
out vec4 frag;   // vTint carries the RAW genome colour; hair/cyto/grain read it raw, appearance is lit+desaturated below

// integer hash (uint mul/xor/shift) -> bit-identical on every GPU/CPU/JIT backend (arm64 LLVM == x86-64 Subzero),
// so goldens match cross-arch. Replaces fract(sin()*k), whose transcendentals diverge across backends. Callers pass
// integer-valued cell corners; float()+÷ below are IEEE-exact. (docs/PLAN-visual-goldens.md)
vec2 hash2(vec2 p){
  uvec2 q = uvec2(ivec2(p));                                  // exact for integer p; negatives wrap (defined int->uint)
  uint h = q.x*374761393u + q.y*668265263u; h = (h ^ (h >> 13u)) * 1274126177u; h ^= (h >> 16u);
  uint g = h*2246822519u; g = (g ^ (g >> 15u)) * 3266489917u; g ^= (g >> 13u);
  return vec2(float(h), float(g)) / 4294967296.0;             // -> [0,1)^2
}
// smooth value noise: interpolate the per-cell hash across cell corners -> no hard square grid, organic grain
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  float a = hash2(i).x, b = hash2(i+vec2(1.0,0.0)).x, c = hash2(i+vec2(0.0,1.0)).x, d = hash2(i+vec2(1.0,1.0)).x;
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
// Worley / cellular noise: distance to the nearest jittered feature point (small => near a cell centre)
float worley(vec2 p){
  vec2 i = floor(p), f = fract(p); float d = 8.0;
  for (int y=-1;y<=1;y++) for (int x=-1;x<=1;x++){
    vec2 g = vec2(float(x),float(y)); vec2 o = hash2(i+g); vec2 r = g+o-f; d = min(d, dot(r,r));
  }
  return sqrt(d);
}

void main(){
  // rounded cross-section: full radius at the spine, feathering to 0 at the edges. DEATH BLUR raises the falloff
  // exponent (soft-focus edges) and the detail factor washes out cyto/grain as it dies.
  float soft = 0.5 + vBlur;
  float detail = 1.0 - clamp(vBlur, 0.0, 1.0);
  float th = vRad * pow(max(0.0, 1.0 - vCU*vCU), soft);

  // CYTOPLASM: cellular spots of higher density in BODY-SPACE. u across = cu*radius (world units), v along = arc length.
  // Both in world units so cells are isotropic; welded to the material, so they flex with the body. No animation.
  if (uCyto > 0.0){
    float uW = vCU * vRad;
    // gentle cytoplasmic streaming: drift the sample slowly over sim time (mostly ALONG the body, a little across) so the
    // cells flow instead of sitting static. Welded per-instance offset is already baked into vV, so each creature flows its
    // own pattern. (bounded well within float precision for any realistic clock.)
    vec2 flow = vec2(uTime * uCytoDrift * 0.5, uTime * uCytoDrift);
    float f1 = worley((vec2(uW, vV) + flow) * uCells);
    float spot = 1.0 - smoothstep(0.0, 0.5, f1);            // 1 at cell centres, 0 between
    float interior = 1.0 - smoothstep(0.6, 1.0, abs(vCU));  // fade out near the silhouette so the rim stays clean
    th *= 1.0 + uCyto * vTint.g * spot * interior * detail; // cytoplasm attenuated by RAW GREEN (washed out on death)
  }

  // GRAIN: fine per-cell density speckle in body-space, attenuated by the segment's BLUE component. Symmetric
  // (light + dark specks), interior-faded so the silhouette/rim stays clean. Composes on top of the cytoplasm.
  if (uGrain > 0.0){
    float interior = 1.0 - smoothstep(0.6, 1.0, abs(vCU));
    vec2 gc = vec2(vCU * vRad, vV) * uGrainScale;
    float gr = 0.55*vnoise(gc) + 0.30*vnoise(gc*2.3 + 19.7) + 0.15*vnoise(gc*4.7 + 5.1);   // fBm: plain noise, a few octaves
    th *= 1.0 + uGrain * vTint.b * (gr - 0.5) * 2.0 * interior * detail;   // grain by RAW BLUE (washed out on death)
  }

  // BODY APPEARANCE (render only): raw genome colour -> lighten toward white -> desaturate toward grey
  vec3 col = vTint * (1.0 - uLighten) + uLighten;
  col = mix(col, vec3(dot(col, vec3(0.299, 0.587, 0.114))), uSat);
  frag = vec4(col * th, th);
}`;

// INSTANCED dome cap: one instance per rounded cap; the VS expands a fixed DOME_R x DOME_C grid (GL_TRIANGLES) into the
// same ellipsoidal cap emitDome built on the CPU, and outputs the SAME per-vertex attribs as BODY_VS -> pairs with the
// UNCHANGED BODY_FS. Cross-arch-safe by construction: the ring profile sqrt(1-a^2) and the column coords are precomputed
// on the CPU (byte-identical float32) and passed as uniform arrays, and wBase/uAcross are baked per-instance -> the VS
// uses ONLY +,-,* (no sqrt/div/trig), so the floor/fract noise inputs (cu, rad, v) are identical on every backend.
const DOME_R = 16, DOME_C = 24;   // rings x cross (>= the old aspect-redistribution peak in BOTH axes; idle GPU, fixed)
const STEPS = 10;                 // body-strip sub-steps (declared here: the BODY_INST_VS template literal reads it)
const DOME_INST_VS = `#version 300 es
precision highp float;
layout(location=0) in vec4 a0;   // center.xy , uAcross.xy (unit across-width dir)
layout(location=1) in vec4 a1;   // axis.xy , wBase , capLenScreen
layout(location=2) in vec4 a2;   // radWorld , blur , vBase , vTip
layout(location=3) in vec4 a3;   // tint.rgb , (pad)
uniform vec2 uRes;
uniform float uProf[${DOME_R + 1}];   // sqrt(1-a^2) at each ring a=k/DOME_R  (CPU-precomputed, byte-identical)
uniform float uCol[${DOME_C + 1}];    // across coord -1..+1 at each column                (CPU-precomputed)
out float vCU; out float vRad; out float vV; out vec3 vTint; out float vBlur;
void main(){
  vec2 center = a0.xy, uAcross = a0.zw, axis = a1.xy;
  float wBase = a1.z, capLen = a1.w, radWorld = a2.x, blur = a2.y, vBase = a2.z, vTip = a2.w;
  int tri = gl_VertexID / 3, corner = gl_VertexID - tri*3, quad = tri >> 1, whichTri = tri & 1;
  int ring = quad / ${DOME_C}, col = quad - ring*${DOME_C};                 // DOME_R rings x DOME_C cols
  // corner -> (ring index rOff 0/1 , col index cOff 0/1) reproducing quad(A=(0,0),B=(0,1),C=(1,1),D=(1,0)) as tri ABC + ACD
  int rOff, cOff;
  if (whichTri == 0){ rOff = (corner==2)?1:0;              cOff = (corner==0)?0:1; }   // tri ABC: A(r0,c0) B(r0,c1) C(r1,c1)
  else              { rOff = (corner==0)?0:1;              cOff = (corner==1)?1:0; }   // tri ACD: A(r0,c0) C(r1,c1) D(r1,c0)
  float a = float(ring + rOff) / float(${DOME_R});          // exact (DOME_R is a power of two)
  float prof = uProf[ring + rOff];                          // sqrt(1-a^2), CPU-exact -> no GPU sqrt
  float cc = uCol[col + cOff];                              // across coord, CPU-exact -> no GPU div
  float rr = wBase * prof;                                  // screen half-width of this ring
  vec2 pos = center + axis * (capLen * a) + uAcross * (cc * rr);
  vCU = cc; vRad = radWorld * prof; vV = vBase + (vTip - vBase) * a;   // a+(b-a)*t form (matches JS lerp)
  vTint = a3.rgb; vBlur = blur;
  gl_Position = vec4(pos.x / uRes.x * 2.0 - 1.0, 1.0 - pos.y / uRes.y * 2.0, 0.0, 1.0);
}`;

// INSTANCED body strip: one instance per part; the VS expands a 3-col x (STEPS+1)-row grid (GL_TRIANGLES, 120 verts) into
// the SAME flexed ribbon emitStrip built on the CPU, outputting the SAME per-vertex attribs as BODY_VS -> pairs with the
// UNCHANGED BODY_FS. Cross-arch discipline: u samples come from a uniform (byte-identical), the branch bend uses a
// POLYNOMIAL sincos (no GPU trig), and the Bezier is the exact Bernstein form (u=0->start, u=1->end exact -> welds to the
// CPU dome base). Only the smoothstep divisions (bend/ramp, merge parts only) remain per-backend -> verified at the gate.
const BODY_INST_VS = `#version 300 es
precision highp float;
layout(location=0) in vec4 a0v;   // sL.xy , sR.xy
layout(location=1) in vec4 a1v;   // c1L.xy , c2L.xy
layout(location=2) in vec4 a2v;   // eL.xy , c1R.xy
layout(location=3) in vec4 a3v;   // c2R.xy , eR.xy
layout(location=4) in vec4 a4v;   // wStart , wEnd , fade , blur
layout(location=5) in vec4 a5v;   // v0 , v1 , hasMerge , da
layout(location=6) in vec4 a6v;   // tStart.rgb , px
layout(location=7) in vec4 a7v;   // tEnd.rgb , py
layout(location=8) in vec4 a8v;   // rw , rampRw , mergeA0 , mergeA1
uniform vec2 uRes;
uniform float uU[${STEPS + 1}];   // u = ring/STEPS samples (CPU-precomputed, byte-identical -> stable lerps)
out float vCU; out float vRad; out float vV; out vec3 vTint; out float vBlur;
void sincos(float x, out float s, out float c){          // poly over [-pi/2,pi/2] (~1e-6), +,-,* only -> cross-arch stable
  float x2 = x*x;
  s = x * (1.0 - x2*(0.16666667 - x2*(0.00833333 - x2*0.00019841)));
  c = 1.0 - x2*(0.5 - x2*(0.04166667 - x2*(0.00138889 - x2*0.00002480)));
}
vec2 bez2(vec2 A, vec2 B, vec2 C, vec2 D, float t){      // Bernstein (matches JS bez op order); exact at t=0 and t=1
  float m=1.0-t, m2=m*m, t2=t*t; float w0=m2*m, w1=3.0*m2*t, w2=3.0*m*t2, w3=t2*t;
  return A*w0 + B*w1 + C*w2 + D*w3;
}
void main(){
  vec2 sL=a0v.xy, sR=a0v.zw, c1L=a1v.xy, c2L=a1v.zw, eL=a2v.xy, c1R=a2v.zw, c2R=a3v.xy, eR=a3v.zw;
  float wStart=a4v.x, wEnd=a4v.y, fade=a4v.z, blur=a4v.w;
  float v0=a5v.x, v1=a5v.y, hasMerge=a5v.z, da=a5v.w;
  vec3 tStart=a6v.xyz, tEnd=a7v.xyz; vec2 piv=vec2(a6v.w, a7v.w);
  float rw=a8v.x, rampRw=a8v.y, mA0=a8v.z, mA1=a8v.w;
  int tri=gl_VertexID/3, corner=gl_VertexID-tri*3, quad=tri>>1, whichTri=tri&1, rowgap=quad>>1, hf=quad&1;   // hf: 0=left half,1=right ('half' is reserved)
  int ringSel = (whichTri==0) ? ((corner==2)?1:0) : ((corner==0)?0:1);   // prev(0)/cur(1) ring, matches quad(A,B,C)+(A,C,D)
  int ring = rowgap + ringSel;
  int cuInt = (hf==0) ? ((whichTri==0) ? ((corner==0)?-1:0) : ((corner==1)?0:-1))
                      : ((whichTri==0) ? ((corner==0)?0:1) : ((corner==1)?1:0));
  float u = uU[ring];
  float th=0.0, ramp=1.0;
  if (hasMerge > 1.5){ ramp = 1.0 - smoothstep(1.0 - rampRw, 1.0, u); }   // END-fade: an under-going part (a parent tucking beneath an over-branch's cap) thins to 0 near its TIP -- symmetric to the branch base ramp
  else if (hasMerge > 0.5){ float arc = mA0 + (mA1-mA0)*u; th = da*(1.0 - smoothstep(0.0, rw, arc)); ramp = smoothstep(0.0, rampRw, arc); }
  float bs, bc; sincos(th, bs, bc);
  vec2 Lp = bez2(sL,c1L,c2L,eL,u), Rp = bez2(sR,c1R,c2R,eR,u);
  if (hasMerge > 0.5){
    vec2 dL=Lp-piv; Lp = piv + vec2(dL.x*bc - dL.y*bs, dL.x*bs + dL.y*bc);
    vec2 dR=Rp-piv; Rp = piv + vec2(dR.x*bc - dR.y*bs, dR.x*bs + dR.y*bc);
  }
  vec2 pos = (cuInt<0) ? Lp : (cuInt>0) ? Rp : (Lp+Rp)*0.5;
  vCU = float(cuInt);
  vRad = (wStart + (wEnd-wStart)*u) * fade * ramp;
  vV = v0 + (v1-v0)*u;
  vTint = tStart + (tEnd-tStart)*u;
  vBlur = blur;
  gl_Position = vec4(pos.x/uRes.x*2.0 - 1.0, 1.0 - pos.y/uRes.y*2.0, 0.0, 1.0);
}`;

// fullscreen triangle (attributeless) -- shared by the resolve and final passes
const COMP_VS = `#version 300 es
precision highp float;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); // (0,0)(2,0)(0,2) fullscreen triangle
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

// --- per-slab RESOLVE pass (front to back): fold ONE depth slab into the running composite ---
// Pure absorption is order-independent, so we only need ordering for EMITTED light (rim + subsurface): this slab's
// emission is dimmed by exp(-frontAbsorb), the gel already accumulated in nearer slabs. Two MRT outputs:
//   0 = running emitted colour   1 = running absorb*thickness (frontAbsorb for the slabs behind this one)
const RESOLVE_FS = `#version 300 es
precision highp float;
uniform sampler2D uSlab, uPrevOut, uPrevFA, uHairTex;
uniform vec2 uRes;
uniform float uField, uDensity, uRim, uSub, uOpacity, uScaleRatio;
layout(location=0) out vec4 outColor;
layout(location=1) out vec4 outFA;

float slabTh(ivec2 p){ return texelFetch(uSlab, p, 0).a; }

void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy);
  vec4 slab = texelFetch(uSlab, ip, 0);
  vec3 prevOut = texelFetch(uPrevOut, ip, 0).rgb;   // emission from nearer slabs
  vec3 prevFA  = texelFetch(uPrevFA,  ip, 0).rgb;   // absorb*thickness of nearer slabs (gel in front)
  vec3 hairE   = texelFetch(uHairTex, ip, 0).rgb;   // THIS slab's hair glow (rim-coloured)
  vec3 atten = exp(-prevFA);                         // everything this slab emits is dimmed by the gel in front of it
  float th = slab.a;
  if (th <= 1e-4){
    // no body gel here, but hairs stick out past the silhouette -> still add their (depth-attenuated) glow
    outColor = vec4(prevOut + hairE * atten, 1.0);
    outFA = vec4(prevFA, 1.0); return;
  }

  vec3 tint = clamp(slab.rgb / th, 0.0, 1.0);
  // tinted absorption (a gel eats its complement) + flat colourless opacity (makes even white gel milky/opaque)
  vec3 absorb = (vec3(1.0) - tint) * uDensity + vec3(uOpacity);

  // this slab's emitted light: subsurface glow + refractive Becke rim (from THIS slab's own thickness edges)
  vec3 sub = tint * (1.0 - exp(-th * 0.04)) * uSub * uField * 0.5;
  // gradient measured per pixel -> multiply by the zoom ratio so the rim brightness is per-WORLD-unit (scale-invariant).
  // The line still widens as you zoom in (more pixels fall inside the edge); only its brightness is held steady.
  float grad = length(vec2(slabTh(ip+ivec2(1,0)) - slabTh(ip-ivec2(1,0)),
                           slabTh(ip+ivec2(0,1)) - slabTh(ip-ivec2(0,1)))) * uScaleRatio;
  vec3 rim = vec3(1.0, 1.0, 0.97) * (smoothstep(0.15, 2.5, grad) * uRim * 0.6 * uField);

  // subsurface glow stays STEADY (must not pop as others drift over it). Rim AND hairs are depth-ordered -- dimmed by
  // the gel nearer than this slab -> overlapping swimmers no longer stack their hairs into blown-out hot spots.
  outColor = vec4(prevOut + sub + (rim + hairE) * atten, 1.0);
  outFA    = vec4(prevFA + absorb * th, 1.0);
}`;

// --- FINAL pass: backlight through all the gel (order-independent) + all the accumulated emission, over the field ---
const FINAL_FS = `#version 300 es
precision highp float;
uniform sampler2D uOut, uFA;
uniform vec2 uRes;
uniform float uField;
out vec4 frag;
void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy);
  vec3 emitted = texelFetch(uOut, ip, 0).rgb;
  vec3 totalAbsorb = texelFetch(uFA, ip, 0).rgb;   // absorb*thickness summed over every slab

  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 field = uField * vec3(0.99, 1.0, 0.95);
  field *= 1.0 - smoothstep(0.35, 0.98, distance(uv, vec2(0.5))) * 0.5;

  frag = vec4(field * exp(-totalAbsorb) + emitted, 1.0);   // Beer-Lambert backlight + emission
}`;

// --- BLOOM: bright-pass -> separable blur -> add back over the scene (full-image glow) ---
const BRIGHT_FS = `#version 300 es
precision highp float;
uniform sampler2D uScene; uniform float uThresh;
out vec4 frag;
void main(){
  vec3 c = texelFetch(uScene, ivec2(gl_FragCoord.xy), 0).rgb;
  float b = max(max(c.r, c.g), c.b);
  frag = vec4(c * (max(0.0, b - uThresh) / max(b, 1e-4)), 1.0);   // keep only the bright excess
}`;
const BLUR_FS = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform ivec2 uDir;   // per-tap pixel step (H then V)
out vec4 frag;
void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy);
  vec3 s = texelFetch(uTex, ip, 0).rgb * 0.204164;
  s += (texelFetch(uTex, ip+uDir,    0).rgb + texelFetch(uTex, ip-uDir,    0).rgb) * 0.180174;
  s += (texelFetch(uTex, ip+uDir*2,  0).rgb + texelFetch(uTex, ip-uDir*2,  0).rgb) * 0.123832;
  s += (texelFetch(uTex, ip+uDir*3,  0).rgb + texelFetch(uTex, ip-uDir*3,  0).rgb) * 0.066282;
  s += (texelFetch(uTex, ip+uDir*4,  0).rgb + texelFetch(uTex, ip-uDir*4,  0).rgb) * 0.027631;
  frag = vec4(s, 1.0);
}`;
const POST_FS = `#version 300 es
precision highp float;
uniform sampler2D uScene, uBloom; uniform float uStrength;
uniform ivec2 uOrigin;     // composite: this view fills a REGION of the canvas -> map window fragcoord back to view texels
uniform vec2 uViewSize;    // view size (px) for the rounded-corner mask
uniform float uRound;      // corner radius (px); same for every view so all four match
uniform float uGain, uGamma;   // final tone (both main + minis): brightness gain then gamma, BEFORE the corner mask
out vec4 frag;
void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy) - uOrigin;
  vec3 c = texelFetch(uScene, ip, 0).rgb + texelFetch(uBloom, ip, 0).rgb * uStrength;
  if (uGain != 1.0 || uGamma != 1.0) c = pow(max(c * uGain, 0.0), vec3(1.0 / uGamma));   // identity at (1,1) -> goldens byte-identical
  if (uRound > 0.0){                                       // rounded-box SDF -> mask corners to the (black) canvas
    vec2 hs = uViewSize * 0.5;
    vec2 q = abs((vec2(ip) + 0.5) - hs) - hs + vec2(uRound);
    float sd = min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - uRound;
    c *= 1.0 - smoothstep(-0.75, 0.75, sd);               // ~1.5px antialiased edge
  }
  frag = vec4(c, 1.0);
}`;

// --- world-boundary box: flat-colour screen-space quads drawn on top ---
const BOX_VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;
uniform vec2 uRes;
void main(){ gl_Position = vec4(aPos.x/uRes.x*2.0-1.0, 1.0-aPos.y/uRes.y*2.0, 0.0, 1.0); }`;
const BOX_FS = `#version 300 es
precision highp float;
uniform vec4 uColor;
out vec4 frag;
void main(){ frag = uColor; }`;   // rgba -> alpha lets the outside-wall darkening be semi-transparent

// --- hairs: thin glowing rim-coloured strands, drawn additively on top of the composite (instanced arc strip). ---
// HAIRS: ONE quad (2 triangles) per strand, curve drawn PER-PIXEL in the fragment shader. A vertex shader can only move
// vertices you give it (a quad is always straight), so the curve lives in the FS: the VS emits an oriented bounding quad
// in the hair's local frame (x=along d0, y=along nrm) and passes the fragment's local coords; the FS computes the exact
// distance to the true arc centerline + tapered half-width and paints it with a ~1px soft edge (free AA, facet-free at
// ANY zoom). theta~0 -> straight capsule (no atan, the common+stable case). One instance per strand: 8 floats
// {root, dir, len, wid(half-width@root), theta(total bend), bright} in screen space. Chosen over a tessellated arc strip
// after measuring both on the real GPU: perf-identical (hairs are CPU-bound, not GPU-bound) but this is smoother + simpler.
const HAIR_SDF_VS = `#version 300 es
precision highp float;
layout(location=0) in vec4 p0;   // rx,ry root , nx,ny dir
layout(location=1) in vec4 p1;   // len, wid(half-width at root), theta(total bend), bright
uniform vec2 uRes;
out vec2 vLocal;                                        // fragment position in the hair-local frame
flat out vec4 vHair;                                    // len, wid, theta, bright (constant per strand)
void main(){
  vec2 root = p0.xy; vec2 d0 = normalize(p0.zw); vec2 nrm = vec2(-d0.y, d0.x);
  float len = p1.x, wid = p1.y, theta = p1.z;
  float pad = wid + 1.0;                                // width + ~1px AA margin
  float B = 0.0; if (abs(theta) >= 1e-3){ float R = len/theta; B = R*(1.0 - cos(theta)); }  // centerline tip bulge (local y)
  float xmin = -pad, xmax = len + pad, ymin = min(0.0, B) - pad, ymax = max(0.0, B) + pad;
  float cx = float(gl_VertexID & 1), cy = float((gl_VertexID >> 1) & 1);   // strip 0..3 -> (0,0)(1,0)(0,1)(1,1)
  float lx = mix(xmin, xmax, cx), ly = mix(ymin, ymax, cy);
  vec2 P = root + d0*lx + nrm*ly;
  vLocal = vec2(lx, ly); vHair = vec4(len, wid, theta, p1.w);
  gl_Position = vec4(P.x/uRes.x*2.0 - 1.0, 1.0 - P.y/uRes.y*2.0, 0.0, 1.0);
}`;
const HAIR_SDF_FS = `#version 300 es
precision highp float;
in vec2 vLocal; flat in vec4 vHair;
uniform vec3 uColor; uniform float uBright;
out vec4 frag;
void main(){
  float x = vLocal.x, y = vLocal.y, len = vHair.x, wid = vHair.y, theta = vHair.z, bright = vHair.w;
  float f, d;                                           // f = along-strand param 0..1 ; d = perp distance to centerline
  if (abs(theta) < 1e-3){ f = x / len; d = abs(y); }    // straight capsule (common case; no atan, stable)
  else {
    float R = len / theta; vec2 vq = vec2(x, y - R);     // vector from arc centre C=(0,R)
    d = abs(length(vq) - abs(R));
    f = atan(R*vq.x, -R*vq.y) / theta;                   // signed swept angle / theta  (sign-correct for R<0)
  }
  if (f < 0.0 || f > 1.0) discard;
  float hw = wid * (1.0 - f);                            // tapered half-width (matches the strip)
  float cov = 1.0 - smoothstep(hw - 1.0, hw + 0.5, d);   // ~1px soft edge (free AA)
  if (cov <= 0.0) discard;
  frag = vec4(uColor * ((1.0 - f) * bright * uBright * cov), 1.0);   // taper intensity to the tip; additive
}`;

// --- junk/detritus: plain thickness discs (NO cytoplasm/grain), summed into the slab thickness like a tiny body ---
const JUNK_FS = `#version 300 es
precision highp float;
in float vCU; in float vRad; in vec3 vTint;
uniform float uSoft;   // edge falloff exponent: 0.5 = sharp (sqrt), higher = softer/feathered (out-of-focus)
out vec4 frag;
void main(){
  float th = vRad * pow(max(0.0, 1.0 - vCU*vCU), uSoft);
  frag = vec4(vTint * th, th);
}`;

const K_SLABS = 8;   // depth slabs for front-to-back compositing (more = finer occlusion ordering, more passes)
let resolveProg=null, finalProg=null;
const uR = {}, uF = {};                  // resolve / final uniform locations
let mainSet=null, smallSet=null;   // per-VIEW FBO sets (makeFBOSet): { slabTex/FBO, accA/B (MRT), hairTex/FBO, sceneTex/FBO, bloomA/B(+FBO) }. Main=768^2, small=256^2.
let bodyVAO=null, bodyVBO=null, emptyVAO=null;
let hairInstVAO=null, hairInstVBO=null;   // per-strand instance data (8 floats/hair)
let hairSdfProg=null, uSdfRes=null, uSdfColor=null, uSdfBright=null;   // hair program: 2-tri quad, arc+taper in the FS
let domeProg=null, uDome={}, domeInstVAO=null, domeInstVBO=null;   // instanced dome caps (pairs with BODY_FS)
let stripProg=null, uStrip={}, stripInstVAO=null, stripInstVBO=null;   // instanced body strips (pairs with BODY_FS)
let junkProg=null, uJunkRes=null, uJunkSoft=null;
let brightProg=null, blurProg=null, postProg=null; const uBr={}, uBl={}, uPo={};
let boxProg=null, uBoxRes=null, uBoxColor=null, boxVAO=null, boxVBO=null;
let hairTime = 0;
// death fade: dead swimbots are swept from the world each tick, so keep the last reference per id and render it
// fading out (thickness -> 0) over FADE_TICKS of SIM TIME before pruning. Tied to the clock, so it tracks sim
// speed and freezes on pause. 240 ticks = 4 s at 1x (60 ticks/s @ 60fps); at 60x it's 240/3600 = 4/60 s -- death
// speeds up exactly with sim speed. Alive -> fade 1; dead -> fade by elapsed ticks.
const known = new Map(), fades = new Map(), deathTick = new Map(), deathFade0 = new Map(), FADE_TICKS = 240;
const OLD_AGE_DURATION = 1000;   // mirrors the engine: the decline window before old-age death (pre-death decompose ramp)
// floating detritus: persistent world-space particles that drift in the medium (specks + soft out-of-focus blobs)
const MAX_JUNK = 1500;   // floating detritus particle pool (denser medium)
let junk = [], lastJunkClock = 0;   // lastJunkClock: junk drift is advanced by ELAPSED SIM TICKS (freezes on pause, scales with speed)
function seedJunk(rng){
  junk = [];
  for (let i=0;i<MAX_JUNK;i++){
    const blob = rng() < 0.3;
    const sz = Math.pow(2, rng()*2 - 1);             // per-particle size: log-uniform in [0.5x, 2x] (symmetric, mean 1)
    junk.push({
      x: rng()*P.pool, y: rng()*P.pool, vx: (rng()-0.5)*0.083, vy: (rng()-0.5)*0.083,   // per-TICK velocity (x elapsed ticks)
      r: (blob ? 9 + rng()*18 : 2.5 + rng()*5) * sz,   // world visual radius (bigger); x per-particle size spread
      th: blob ? 0.3 + rng()*0.4 : 0.6 + rng()*1.0,    // world thickness (less opaque)
      tint: blob ? [0.62,0.55,0.48] : [0.35+rng()*0.15, 0.30+rng()*0.12, 0.25+rng()*0.10],
      slab: Math.min(K_SLABS-1, (rng()*K_SLABS)|0),    // depth -> interleaves with the swimmers
    });
  }
}
// stable per-creature pseudo-depth in [0,1) (the pool is 2D, so we invent a depth): golden-ratio hash of the id.
function pseudoDepth(id){ const f = (id * 0.61803398875) % 1; return f < 0 ? f + 1 : f; }

function makeTex(w, h){   // FBO-size decoupled from the canvas: caller passes the view size
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, thickFmt.internal, w, h, 0, gl.RGBA, thickFmt.type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function makeAccum(w, h){   // MRT pair: colour (emission) + frontAbsorb
  const out = makeTex(w,h), fa = makeTex(w,h), f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, out, 0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, fa, 0);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) errEl.textContent = 'Accum FBO incomplete';
  return { fbo: f, out, fa };
}
// One complete offscreen pipeline sized to a view (square). Main = 768^2; species tiles share a 256^2 set.
function mkFBO1(tex){ const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0); return f; }
function makeFBOSet(w, h = w){   // view may be non-square (the desktop main fills the window); tiles stay square
  const slabTex = makeTex(w,h), slabFBO = mkFBO1(slabTex);   // per-slab thickness
  const hairTex = makeTex(w,h), hairFBO = mkFBO1(hairTex);   // per-slab hair glow (depth-attenuated in resolve)
  const accA = makeAccum(w,h), accB = makeAccum(w,h);        // front-to-back ping-pong composite
  const sceneTex = makeTex(w,h), sceneFBO = mkFBO1(sceneTex);// backlit scene (pre-bloom)
  const bloomA = makeTex(w,h), bloomAFBO = mkFBO1(bloomA);   // bloom ping-pong
  const bloomB = makeTex(w,h), bloomBFBO = mkFBO1(bloomB);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { w, h, slabTex, slabFBO, hairTex, hairFBO, accA, accB, sceneTex, sceneFBO, bloomA, bloomAFBO, bloomB, bloomBFBO };
}
function deleteFBOSet(s){   // free GL objects when resizing the main set (else a resize leaks textures/FBOs)
  if (!s || !gl) return;
  for (const t of [s.slabTex, s.hairTex, s.sceneTex, s.bloomA, s.bloomB, s.accA.out, s.accA.fa, s.accB.out, s.accB.fa]) gl.deleteTexture(t);
  for (const f of [s.slabFBO, s.hairFBO, s.sceneFBO, s.bloomAFBO, s.bloomBFBO, s.accA.fbo, s.accB.fbo]) gl.deleteFramebuffer(f);
}
// Desktop only: size the main view (canvas backing-store + its FBO set) to FILL #canvasBox. The browser keeps the
// fixed 768^2 main (so its goldens are unchanged). Aspect-correct: fitZoom uses min(W,H)/pool, so the visible field is
// pool/zoom regardless of size -- filling just adds pixels + more world on the long axis.
function resizeMain(){
  if (!gl) return;
  const box = document.getElementById('canvasBox');
  const w = Math.max(64, Math.floor(box.clientWidth)), h = Math.max(64, Math.floor(box.clientHeight));
  if (w === cv.width && h === cv.height && mainSet && mainSet.w === w && mainSet.h === h) return;
  cv.width = w; cv.height = h; CANVAS_W = w; CANVAS_H = h; mainW = w; mainH = h;
  W = w; H = h;   // the RESTING active-view size = the canvas (renderView saves/restores around per-view overrides); input handlers (sc/toScreen/zoom-to-cursor) read these, so they must track the filled window, not stay at the parse-time 768
  const old = mainSet; mainSet = makeFBOSet(w, h); deleteFBOSet(old);
  SC_REF = (Math.min(w, h) / P.pool) * 6;   // rim-brightness ref tracks the view size (uScaleRatio stays = zoom/6)
  render();
}

function initGL(){
  if (!gl) return;
  resolveProg = makeProgram(COMP_VS, RESOLVE_FS);
  finalProg = makeProgram(COMP_VS, FINAL_FS);
  for (const n of ['uSlab','uPrevOut','uPrevFA','uHairTex','uRes','uField','uDensity','uOpacity','uRim','uSub','uScaleRatio']) uR[n] = gl.getUniformLocation(resolveProg, n);
  for (const n of ['uOut','uFA','uRes','uField']) uF[n] = gl.getUniformLocation(finalProg, n);

  // offscreen pipelines: one 768^2 set for the main micrograph, one 256^2 set shared serially by the species tiles.
  // (Each holds its own slab/hair/accum/scene/bloom targets; see makeFBOSet.)
  mainSet = makeFBOSet(VIEW_MAIN);
  smallSet = makeFBOSet(VIEW_SMALL);

  // dynamic body geometry buffer
  bodyVAO = gl.createVertexArray(); gl.bindVertexArray(bodyVAO);
  bodyVBO = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bodyVBO);
  const STR = 9 * 4;   // x,y, cu, rad, v, r,g,b, blur
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, STR, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, false, STR, 8);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, STR, 12);
  gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4, 1, gl.FLOAT, false, STR, 16);   // aV (arc-length)
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 3, gl.FLOAT, false, STR, 20);   // aTint
  gl.enableVertexAttribArray(5); gl.vertexAttribPointer(5, 1, gl.FLOAT, false, STR, 32);   // aBlur (death)
  gl.bindVertexArray(null);

  // instanced hairs: one instance/strand (2 vec4 per-instance attribs, divisor set ONCE here), a 2-triangle quad via
  // gl_VertexID; the arc + taper are drawn per-pixel in the FS (HAIR_SDF_*).
  hairSdfProg = makeProgram(HAIR_SDF_VS, HAIR_SDF_FS);

  gl.bindVertexArray(null);

  // instanced dome caps: 4 vec4 per-instance attribs; pairs with BODY_FS (same body appearance). Ring/col profiles are
  // uniform arrays (CPU-precomputed) so the VS is transcendental/division-free -> cross-arch-stable floor/fract inputs.
  domeProg = makeProgram(DOME_INST_VS, BODY_FS);
  for (const n of ['uRes','uCyto','uCells','uLighten','uGrain','uGrainScale','uSat','uTime','uCytoDrift','uProf','uCol']) uDome[n] = gl.getUniformLocation(domeProg, n);
  gl.useProgram(domeProg);

  gl.bindVertexArray(null);

  // instanced body strips: 9 vec4 per-instance attribs; pairs with BODY_FS. u samples are a uniform (byte-identical).
  stripProg = makeProgram(BODY_INST_VS, BODY_FS);
  for (const n of ['uRes','uCyto','uCells','uLighten','uGrain','uGrainScale','uSat','uTime','uCytoDrift','uU']) uStrip[n] = gl.getUniformLocation(stripProg, n);
  gl.useProgram(stripProg);

  gl.bindVertexArray(null);

  junkProg = makeProgram(BODY_VS, JUNK_FS);   // plain discs, shares the body vertex format

  // world-boundary box (flat-colour quads)
