// ================================================================== engine wiring (identical to the canvas viewer)
let curConfig = null, recording = false, recBuf = [];   // desktop (Electron) SQLite recording: current config + event buffer
function build(){
  deselect();   // world is being rebuilt -> the selected bot ref is about to be discarded (also nulls selection for golden capture)
  errEl.textContent = '';
  if (recording) stopRecording();   // a fresh pool ends the current recording (don't mix runs in one DB)
  // the world (config + junk-zeroed founders + food) is built by the SHARED seeder so live and scrub match exactly;
  // it returns the seed's rng AFTER founders/food so the detritus below continues the same stream (byte-identical).
  let rng;
  try { const r = makeStandardWorld(seed, { pool: P.pool, n: P.n, food: P.food }); world = r.world; curConfig = r.config; rng = r.rng; }
  catch(e){ world = null; errEl.textContent = 'Cannot build: ' + e.message; return; }
  known.clear(); fades.clear(); deathTick.clear(); deathFade0.clear(); lastJunkClock = 0;   // no stale death-fade ghosts / junk drift across a rebuild
  frameCount = 0; speciesModel = createSpeciesAnalyzer();   // reset species state -> deterministic from a fresh build
  rowMap = new Map(); expanded = new Set(); if (speciesPanel) speciesPanel.replaceChildren();   // ids reuse from 1 across builds -> drop stale rows/expansion + the DOM (else orphans accumulate)
  SC_REF = (VIEW_MAIN / P.pool) * 6;   // main-view calibrated (independent of canvas aspect); recompute if P.pool changed
  seedJunk(rng);
  cam = { x:P.pool/2, y:P.pool/2, zoom: cam.zoom || 6 };
  camT = { x: cam.x, y: cam.y, zoom: cam.zoom };   // sync the smoothing target to the hard reset
  document.getElementById('seedIn').value = seed;
}

// ---- desktop (Electron) only: real-file save/load + SQLite snapshot recording via window.pool (absent in a browser) ----
function onSimEvent(e){ recBuf.push(e); }   // attached to world._onEvent only while recording -> engine emits only then
function stopRecording(){
  if (!recording) return; recording = false;
  if (world) world._onEvent = null;                                    // detach -> engine stops emitting (zero overhead)
  if (recBuf.length && window.pool){ window.pool.record(recBuf); recBuf = []; }
  if (window.pool) window.pool.recordStop().then(r => { const el = document.getElementById('recinfo'); if (el && r && r.ok) el.textContent = `saved ${r.events} events → ${r.path.split('/').pop()}`; });
  const b = document.getElementById('record'); if (b){ b.textContent = '● Record'; b.style.color = ''; }
}
async function startRecording(){
  if (!window.pool || !world) return;
  const r = await window.pool.recordStart({ seed, config: curConfig, snapshot: world.serialize() });   // snapshot@now + stream forward
  if (!r || !r.ok) return;
  recBuf = []; world._onEvent = onSimEvent; recording = true;
  const b = document.getElementById('record'); if (b){ b.textContent = '■ Stop'; b.style.color = '#ff6b6b'; }
  const el = document.getElementById('recinfo'); if (el) el.textContent = 'recording → ' + r.path.split('/').pop();
}
function loadWorld(saved){
  if (recording) stopRecording();
  let w; try { w = World.restore(saved.config, saved.data); } catch(e){ errEl.textContent = 'Load failed: ' + e.message; return; }
  deselect();   // replacing the world -> discard the stale selection
  world = w; curConfig = saved.config; if (saved.seed != null) seed = saved.seed;
  known.clear(); fades.clear(); deathTick.clear(); deathFade0.clear(); lastJunkClock = 0;
  frameCount = 0; speciesModel = createSpeciesAnalyzer();
  rowMap = new Map(); expanded = new Set(); if (speciesPanel) speciesPanel.replaceChildren();
  const rng = mulberry32((seed>>>0) ^ 0x5eed1234); seedJunk(rng);    // detritus re-seeded from seed (deterministic, cosmetic)
  cam = { x:P.pool/2, y:P.pool/2, zoom: cam.zoom || 6 };
  camT = { x: cam.x, y: cam.y, zoom: cam.zoom };   // sync the smoothing target to the hard reset
  document.getElementById('seedIn').value = seed;
}
if (window.pool && window.pool.isDesktop){
  setupVideoRecorder();   // red-circle button lives in the bottom bar (the header is hidden in desktop); records a VIDEO of the main viewer
}
// Record a WebM video of the MAIN canvas via MediaRecorder + captureStream; on stop, hand the bytes to the desktop app,
// which writes a date/time-named file. Click to start (button pulses), click to stop. Desktop only (needs a file write).
function setupVideoRecorder(){
  const btn = document.getElementById('vidRec'); if (!btn) return;
  let rec = null, chunks = [];
  btn.onclick = () => {
    if (rec){ if (rec.state !== 'inactive') rec.stop(); return; }   // second click -> stop
    // record the COMPOSITING canvas (WebGL frame + info overlay), sized to the live canvas, filled each frame by render()
    if (!recCanvas){ recCanvas = document.createElement('canvas'); recCtx = recCanvas.getContext('2d'); }
    recCanvas.width = cv.width; recCanvas.height = cv.height;
    recCompositeFrame();                       // seed one frame so the stream starts with content
    recActive = true;
    let stream; try { stream = recCanvas.captureStream(30); } catch (e){ recActive = false; return; }
    const mime = (window.MediaRecorder && MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) ? 'video/webm;codecs=vp9' : 'video/webm';
    try { rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16_000_000 }); }
    catch (e){ rec = null; recActive = false; return; }
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      recActive = false; btn.classList.remove('recording');
      const blob = new Blob(chunks, { type: 'video/webm' }); chunks = []; rec = null;
      const bytes = new Uint8Array(await blob.arrayBuffer());
      await window.pool?.saveVideo?.(bytes);   // desktop writes ~/Movies/GenePool/genepool-<timestamp>.webm
    };
    rec.start();
    btn.classList.add('recording');
  };
}

function parentPos(ph, p){ const par = ph.parts[p].parent; return (par === undefined || par === null || par < 0) ? ph.parts[0].position : ph.parts[par].position; }

// One segment's smooth (bezier-splined) tapered outline in SCREEN space (JJ geometry), plus world half-widths
// (wStart/wEnd = thickness radii) and the gene-shaped caps. Mirrors the canvas viewer's partPoints.
function partPointsGL(ph, p, gscale, baseCap){
  const part = ph.parts[p], parIdx = part.parent, pos = part.position, ppos = parentPos(ph, p);
  const rootLike = (p === 1) || !!baseCap;   // root mouth, OR an over-branch base (larger limb) that caps instead of welding
  let width = part.width, parentWidth = ph.parts[(parIdx>=0?parIdx:0)].width;
  if (gscale < 1){ width = width*gscale + EGG_SIZE*(1-gscale); parentWidth = parentWidth*gscale + EGG_SIZE*(1-gscale); }
  let psx = part.perpendicular.x, psy = part.perpendicular.y, pex = part.perpendicular.x, pey = part.perpendicular.y;
  const cvl = part.length * SPLINE;
  if (p > 1 && !part.branch && parIdx >= 0){ psx += ph.parts[parIdx].perpendicular.x; psy += ph.parts[parIdx].perpendicular.y; const l = Math.hypot(psx,psy)||1; psx/=l; psy/=l; }
  if (part.child !== undefined && part.child >= 0){ pex += ph.parts[part.child].perpendicular.x; pey += ph.parts[part.child].perpendicular.y; const l = Math.hypot(pex,pey)||1; pex/=l; pey/=l; }
  const c1vx=-psy*cvl, c1vy=psx*cvl, c2vx=pey*cvl, c2vy=-pex*cvl;
  const startW = rootLike ? width : parentWidth;   // over-branch base starts at its OWN width (solid capped limb on top), not welded to the parent
  const sPX=psx*startW, sPY=psy*startW, ePX=pex*width, ePY=pey*width;
  const T=(x,y)=>toScreen(x,y);
  const terminal = !(part.child !== undefined && part.child >= 0);
  const len = part.length || 1, nx = part.axis.x/len, ny = part.axis.y/len;   // segment axis (world = screen direction)
  const capLenT = terminal ? width * (part.endCapSpline || 0) : 0;            // terminal dome bulge (world), along +axis
  const root = (p === 1);
  // ONLY the mouth (root) gets a rounded start-dome. Branch limbs instead MERGE into the trunk (thickness ramps up
  // from 0 at their base in emitStrip) -> no visible edge, a smooth fade. Sequential parts share their start edge.
  const capLenR = rootLike ? startW * (4/3) : 0;                              // start-dome bulge (world): root mouth OR the over-branch base cap (Karl: cap on the larger limb)
  return {
    sL:T(ppos.x-sPX, ppos.y-sPY), c1L:T(ppos.x-sPX+c1vx, ppos.y-sPY+c1vy),
    c2L:T(pos.x-ePX+c2vx, pos.y-ePY+c2vy), eL:T(pos.x-ePX, pos.y-ePY),
    eR:T(pos.x+ePX, pos.y+ePY), c2R:T(pos.x+ePX+c2vx, pos.y+ePY+c2vy),
    c1R:T(ppos.x+sPX+c1vx, ppos.y+sPY+c1vy), sR:T(ppos.x+sPX, ppos.y+sPY),
    joint:T(ppos.x, ppos.y), wStart:startW, wEnd:width, terminal, root, nx, ny, capLenT, capLenR,
  };
}

// ------------------------------------------------------------------ geometry -> vertex buffer
let buf = new Float32Array(1 << 21);   // grows if needed
let o = 0;
function vtx(x, y, cu, rad, v, t, blur){
  if (o + 9 > buf.length){ const nb = new Float32Array(buf.length * 2); nb.set(buf); buf = nb; }
  buf[o++]=x; buf[o++]=y; buf[o++]=cu; buf[o++]=rad; buf[o++]=v; buf[o++]=t[0]; buf[o++]=t[1]; buf[o++]=t[2]; buf[o++]=blur;
}
function tri(A,acu,ar,av,aT, B,bcu,br,bv,bT, C,ccu,cr,cv,cT, blur){ vtx(A[0],A[1],acu,ar,av,aT,blur); vtx(B[0],B[1],bcu,br,bv,bT,blur); vtx(C[0],C[1],ccu,cr,cv,cT,blur); }
// quad spanning two rings: verts A,B carry tint tA, verts C,D carry tint tB (colour gradient); blur is per-segment
function quad(A,acu,ar,av, B,bcu,br,bv, C,ccu,cr,cv, D,dcu,dr,dv, tA, tB, blur){ tri(A,acu,ar,av,tA, B,bcu,br,bv,tA, C,ccu,cr,cv,tB, blur); tri(A,acu,ar,av,tA, C,ccu,cr,cv,tB, D,dcu,dr,dv,tB, blur); }

const DISCK = 16;   // junk disc resolution; STEPS/DOME_R/DOME_C are declared up by the shaders
function emitDisc(cx, cy, screenR, rad, t, vBase, blur){
  const c=[cx,cy]; let prev=[cx+screenR,cy];
  for (let i=1;i<=DISCK;i++){ const a=i/DISCK*6.28318; const Pp=[cx+Math.cos(a)*screenR, cy+Math.sin(a)*screenR]; tri(c,0,rad,vBase,t, prev,1,rad,vBase,t, Pp,1,rad,vBase,t, blur); prev=Pp; }
}
// GPU dome: pack ONE instance record (16 floats = 4 vec4) instead of tessellating. center/uAcross/wBase baked on the CPU
// (byte-identical) so the VS stays transcendental/division-free. Same args as emitDome (minus lod -> caller bakes it).
let domeInst = new Float32Array(16 * 1024), dio = 0;   // grows as needed; dio/16 = domes
function pushDome(baseA, baseB, axX, axY, capLenScreen, radWorld, t, vBase, vTip, blur){
  const cx=(baseA[0]+baseB[0])*0.5, cy=(baseA[1]+baseB[1])*0.5;
  const hx=(baseB[0]-baseA[0])*0.5, hy=(baseB[1]-baseA[1])*0.5;
  const wBase=Math.hypot(hx,hy)||1e-6, ux=hx/wBase, uy=hy/wBase;   // unit across-width (matches emitDome)
  if (dio + 16 > domeInst.length){ const nb=new Float32Array(domeInst.length*2); nb.set(domeInst); domeInst=nb; }
  domeInst[dio++]=cx; domeInst[dio++]=cy; domeInst[dio++]=ux; domeInst[dio++]=uy;
  domeInst[dio++]=axX; domeInst[dio++]=axY; domeInst[dio++]=wBase; domeInst[dio++]=capLenScreen;
  domeInst[dio++]=radWorld; domeInst[dio++]=blur; domeInst[dio++]=vBase; domeInst[dio++]=vTip;
  domeInst[dio++]=t[0]; domeInst[dio++]=t[1]; domeInst[dio++]=t[2]; domeInst[dio++]=0;
}
// GPU strip: pack ONE instance record (36 floats = 9 vec4) instead of tessellating the ribbon. Same inputs as emitStrip;
// merge params (or zeros + hasMerge=0) baked in; rw/rampRw clamped >0 so the shader's smoothsteps never hit UB.
let stripInst = new Float32Array(36 * 2048), sio = 0;   // grows as needed; sio/36 = parts
function pushStrip(pt, tStart, tEnd, v0, v1, fade, blur, merge, endFade=0){
  if (sio + 36 > stripInst.length){ const nb=new Float32Array(stripInst.length*2); nb.set(stripInst); stripInst=nb; }
  const hm = merge ? 1 : (endFade > 0 ? 2 : 0);   // 0 none, 1 branch-base ramp (merge), 2 tip end-fade (u-fraction in rampRw)
  const px = merge?merge.px:0, py = merge?merge.py:0, da = merge?merge.da:0;
  const rw = merge?Math.max(merge.rw,1e-3):1, rampRw = merge?Math.max(merge.rampRw,1e-3):(endFade>0?Math.max(endFade,1e-3):1), mA0 = merge?merge.a0:0, mA1 = merge?merge.a1:0;
  const s=stripInst; let i=sio;
  s[i++]=pt.sL[0];s[i++]=pt.sL[1];s[i++]=pt.sR[0];s[i++]=pt.sR[1];
  s[i++]=pt.c1L[0];s[i++]=pt.c1L[1];s[i++]=pt.c2L[0];s[i++]=pt.c2L[1];
  s[i++]=pt.eL[0];s[i++]=pt.eL[1];s[i++]=pt.c1R[0];s[i++]=pt.c1R[1];
  s[i++]=pt.c2R[0];s[i++]=pt.c2R[1];s[i++]=pt.eR[0];s[i++]=pt.eR[1];
  s[i++]=pt.wStart;s[i++]=pt.wEnd;s[i++]=fade;s[i++]=blur;
  s[i++]=v0;s[i++]=v1;s[i++]=hm;s[i++]=da;
  s[i++]=tStart[0];s[i++]=tStart[1];s[i++]=tStart[2];s[i++]=px;
  s[i++]=tEnd[0];s[i++]=tEnd[1];s[i++]=tEnd[2];s[i++]=py;
  s[i++]=rw;s[i++]=rampRw;s[i++]=mA0;s[i++]=mA1;
  sio=i;
}

// --- hairs: instanced. One strand = one instance (8 floats {rx,ry,nx,ny,len,wid,theta,bright}, screen space); the hair
//     program draws a 2-triangle quad and paints the arc+taper per-pixel (HAIR_SDF_*), additively as a glow on top. ---
let hairInst = new Float32Array(8 * 4096), hio = 0;   // grows as needed; hio/8 = strands
let hairsEmitted = 0;   // strands drawn this frame (reset in render()); a debug/perf metric (FPS HUD + __bench)
// per-HAIR stable pseudo-random: hash an integer key -> [0,1). Keyed on the hair's arc position/index (NOT time), so
// each strand's length/angle offset is fixed (organic jitter, not flicker) and identical frame to frame.
function hair01(k){ let h = k>>>0; h = Math.imul(h ^ (h>>>16), 0x45d9f3b); h = Math.imul(h ^ (h>>>16), 0x45d9f3b); h ^= h>>>16; return (h>>>0)/4294967296; }
// jitter a hair's outward direction (nx,ny) + length by small per-strand random offsets. Returns [dx,dy,len].
function hairJit(nx, ny, len, key){
  const a = (hair01(key ^ 0x9e3779b9)*2 - 1) * P.hairAngJit, c = Math.cos(a), s = Math.sin(a);
  return [nx*c - ny*s, nx*s + ny*c, len * (1 + (hair01(key)*2 - 1) * P.hairLenJit)];
}
// one strand: root (rx,ry), outward normal (nx,ny), screen len/half-width, total tip deflection `theta` -> one instance.
function emitHair(rx, ry, nx, ny, len, wid, theta, bright){
  hairsEmitted++;
  if (hio + 8 > hairInst.length){ const nb = new Float32Array(hairInst.length * 2); nb.set(hairInst); hairInst = nb; }
  hairInst[hio++]=rx; hairInst[hio++]=ry; hairInst[hio++]=nx; hairInst[hio++]=ny;
  hairInst[hio++]=len; hairInst[hio++]=wid; hairInst[hio++]=theta; hairInst[hio++]=bright;
}
// COUNT-LOD: strand spacing has a screen-space floor. World spacing P.hairSpace × S = on-screen spacing; when that drops
// below MIN_HAIR_PX (zoomed out, where strands are sub-pixel and just melt into the rim) widen the world spacing so the
// on-screen spacing stays >= MIN_HAIR_PX -> far fewer strands generated/uploaded/drawn, no visible change. At full zoom
// (S large) MIN_HAIR_PX/S -> 0 so P.hairSpace wins and density is untouched. window.__hairMinPx overrides (0 = LOD off).
const MIN_HAIR_PX = 2.0;
const effHairSpace = (S) => Math.max(P.hairSpace, ((typeof window!=='undefined' && window.__hairMinPx!=null) ? window.__hairMinPx : MIN_HAIR_PX) / Math.max(S, 1e-6));
// hairs radiating OUTWARD from a rounded cap (mouth / tip / shoulder): a fan of strands around the dome outline.
// A,B = cap base corners (screen); (ax,ay) = outward axis (screen); capLenScreen = cap bulge; radWorld = cap thickness.
function emitCapHairs(A, B, ax, ay, capLenScreen, radWorld, red, grow, fade, vArc, vx, vy, S){
  const cx=(A[0]+B[0])*0.5, cy=(A[1]+B[1])*0.5, hx=(B[0]-A[0])*0.5, hy=(B[1]-A[1])*0.5;
  const capLenW = capLenScreen / Math.max(S, 1e-6);
  const arcW = Math.PI * (radWorld + capLenW) * 0.5;          // half-ellipse perimeter (world) around the cap
  const K = Math.max(2, Math.round(arcW / effHairSpace(S)));  // SAME (screen-floored) spacing as the side hairs
  const lenS = P.hairLen * (radWorld/3) * red * grow * S, widS = Math.max(0.25, P.hairWid*S);
  const beat = P.hairSway * Math.sin(vArc*P.hairWave - hairTime*P.hairBeat), hb = grow*fade, IN = 0.88;
  for (let i=0;i<K;i++){
    const phi = -1.5708 + (i+0.5)/K * 3.14159, s=Math.sin(phi), co=Math.cos(phi);
    const dx = hx*s + ax*capLenScreen*co, dy = hy*s + ay*capLenScreen*co;   // outline offset from the cap centre
    const px = cx + dx*IN, py = cy + dy*IN;                                 // root slightly inside -> attaches to the body
    let ol=Math.hypot(dx,dy)||1, ox=dx/ol, oy=dy/ol;                        // radial outward normal
    const [jox,joy,jlen] = hairJit(ox, oy, lenS, (Math.floor(vArc*13) + i*131) >>> 0);
    emitHair(px, py, jox, joy, jlen, widS, beat - P.hairDrag*(vx*(-joy)+vy*jox), hb);
  }
}

// tessellate ONE segment (part p) of a creature at the current buffer cursor. Segments of the same CHAIN are emitted
// into the same depth slab so they still fuse seamlessly (no joint disc needed -- sequential parts share their edge).
function tessSegment(sb, ph, p, g, S, v0, v1, fade, merge, lod=1, baseCap=false, suppressTip=false, endFade=0){
  const part = ph.parts[p];
  const pt = partPointsGL(ph, p, g, baseCap);
  // LOD (lod: 1 = full, ->0 for tiny on-screen creatures): the body (strip+dome) is now GPU-tessellated at FIXED resolution
  // (idle GPU -> no triangle-count LOD), but lod still drives the VISUAL fades below: hairLOD (anti-halo) + domeLOD (bulge).
  // hairs FADE OUT smoothly as the creature shrinks (no hard on/off pop). At the small end they'd just be a faint white
  // halo anyway -- which the silhouette RIM already draws -- so as they fade they melt into that rim line. Below the fade
  // floor they're skipped entirely (cost saved at full zoom-out); above it they're full strength.
  const hairLOD = smoothstep(0.6 - P.hairFade, 0.6, lod);   // P.hairFade = fade-band width (wider = gentler fade-out)
  // caps GROW IN smoothly (bulge length scaled by domeLOD) rather than hard on/off -> no pop as you zoom. A zero-length cap
  // is just the flat strip end, so scaling from 0 emerges invisibly; we still skip the draw while it's ~flat (perf kept).
  const domeLOD = smoothstep(0.3, 0.55, lod);
  // DEATH: swell the segment outward from the swimmer's centre (disperse) + soft-focus BLUR, while thickness fades
  let capLenT = pt.capLenT, capLenR = pt.capLenR;
  const blur = P.deathBlur * (1 - fade);   // 0 alive -> P.deathBlur when fully dead (feathers edges in the shader)
  if (fade < 0.999){
    const pos = sb.getPosition(), c = toScreen(pos.x, pos.y), swell = 1 + 0.2*(1-fade);
    for (const key of ['sL','c1L','c2L','eL','eR','c2R','c1R','sR']){ const q=pt[key]; q[0]=c[0]+(q[0]-c[0])*swell; q[1]=c[1]+(q[1]-c[1])*swell; }
    capLenT *= swell; capLenR *= swell;
  }
  // RAW genome colour (0..1) -- the shader reads it raw for cyto/grain, and lightens+desaturates it for the appearance.
  // Colour is a GRADIENT along the body: from the PARENT segment's colour at the joint to this segment's colour at its
  // end -> smooth transitions, no hard colour edges at joints (own colour at the root, where there is no parent).
  // `fade` scales thickness (1 alive -> 0 dead), so a dying swimmer dissolves (absorption, rim, glow all fade with it).
  const tEnd = [ part.red, part.green, part.blue ];
  const pp = (part.parent >= 1) ? ph.parts[part.parent] : part;
  const tStart = [ pp.red, pp.green, pp.blue ];
  pushStrip(pt, tStart, tEnd, v0, v1, fade, blur, merge, endFade);   // GPU strip: bezier + branch bend + taper (+ tip end-fade) expanded in BODY_INST_VS
  // The strip's END is rotated by the branch BEND (in the VS), but the tip dome attaches to the RAW eL/eR/axis. On a SHORT
  // limb the bend has not eased to 0 by the tip, so apply the SAME end-bend (th at u=1, same pivot) to the dome base edge +
  // bulge axis here on the CPU -> the dome's base ring welds to the strip's end edge. Mouth dome (capLenR) = trunk root only.
  let deL=pt.eL, deR=pt.eR, dnx=pt.nx, dny=pt.ny;
  // rampEnd matches the dome base thickness to the (ramped) strip end so a short limb doesn't cliff to full thickness at the tip.
  const rampEnd = merge ? smoothstep(0, merge.rampRw, merge.a1) : 1;
  if (merge){
    const th = merge.da * (1 - smoothstep(0, merge.rw, merge.a1)), c=Math.cos(th), s=Math.sin(th);
    const rot=(Pp)=>{ const dx=Pp[0]-merge.px, dy=Pp[1]-merge.py; return [merge.px+dx*c-dy*s, merge.py+dx*s+dy*c]; };
    deL=rot(pt.eL); deR=rot(pt.eR); dnx=pt.nx*c-pt.ny*s; dny=pt.nx*s+pt.ny*c;
  }
  if (pt.terminal && !suppressTip && domeLOD > 0.02)   pushDome(deL, deR,  dnx,  dny, capLenT*S*domeLOD, pt.wEnd*fade*rampEnd, tEnd,   v1, v1 + capLenT*domeLOD, blur); // tip (suppressed when an over-branch's base cap replaces it here)
  if (pt.capLenR > 0 && domeLOD > 0.02) pushDome(pt.sL, pt.sR, -pt.nx, -pt.ny, capLenR*S*domeLOD, pt.wStart*fade, tStart, v0, v0 - capLenR*domeLOD, blur); // mouth

  // hairs along both side edges: roots welded to the body (follow the swim), tips beat in a metachronal wave along v,
  // length scales with the segment's local thickness, and they DRAG from this part's own velocity through the water.
  // GROWTH GATE (H.Grow): no hairs until this growth fraction, then ramp to full over ~0.4 -> newborns stay bald.
  const grow = smoothstep(P.hairGrow, Math.min(0.99, P.hairGrow + 0.4), g);
  if (P.hair > 0 && part.red > 0.01 && grow > 0.001 && hairLOD > 0.01){
    const red = part.red, gLen = (part.length || 1) * g;   // grown segment length -> even hair spacing on babies too
    const n = Math.max(1, Math.round(gLen / effHairSpace(S)));   // COUNT-LOD: screen-space spacing floor (see effHairSpace)
    const widS = Math.max(0.25, P.hairWid * S);
    const vx = part.velocity ? part.velocity.x : 0, vy = part.velocity ? part.velocity.y : 0;   // per-SEGMENT velocity
    for (let h=0; h<n; h++){
      const u = (h+0.5)/n;
      let L = bez(pt.sL,pt.c1L,pt.c2L,pt.eL,u), R = bez(pt.sR,pt.c1R,pt.c2R,pt.eR,u);
      if (merge){ const th=merge.da*(1-smoothstep(0,merge.rw,merge.a0+(merge.a1-merge.a0)*u)), c=Math.cos(th), s=Math.sin(th);  // hairs track the Y bend
        L=[merge.px+(L[0]-merge.px)*c-(L[1]-merge.py)*s, merge.py+(L[0]-merge.px)*s+(L[1]-merge.py)*c];
        R=[merge.px+(R[0]-merge.px)*c-(R[1]-merge.py)*s, merge.py+(R[0]-merge.px)*s+(R[1]-merge.py)*c]; }
      const M = mid(L,R);
      // hair LENGTH = local thickness * RED (gene trait) * growth-gate; brightness also gated -> smooth grow-in
      const lenS = P.hairLen * (lerp(pt.wStart, pt.wEnd, u) / 3.0) * red * grow * S;
      const beat = P.hairSway * Math.sin(lerp(v0,v1,u)*P.hairWave - hairTime*P.hairBeat);
      const hbright = grow * fade * hairLOD;   // fade with death AND with the LOD hair-fade (smooth zoom transition)
      const kb = (Math.floor(lerp(v0,v1,u)*13)*2) >>> 0;   // per-hair key from arc position (L=kb, R=kb|1)
      let lx=L[0]-M[0], ly=L[1]-M[1], ll=Math.hypot(lx,ly)||1; lx/=ll; ly/=ll;
      const [jlx,jly,jll] = hairJit(lx, ly, lenS, kb);
      emitHair(L[0],L[1], jlx, jly, jll, widS,  beat - P.hairDrag*(vx*(-jly) + vy*jlx), hbright);
      let rx=R[0]-M[0], ry=R[1]-M[1], rl=Math.hypot(rx,ry)||1; rx/=rl; ry/=rl;
      const [jrx,jry,jrl] = hairJit(rx, ry, lenS, kb|1);
      emitHair(R[0],R[1], jrx, jry, jrl, widS, -beat - P.hairDrag*(vx*(-jry) + vy*jrx), hbright);   // beat mirrored; drag physical
    }
    // hairs on the CAPS (heads): radiate from every rounded end -- the tip, and the mouth/branch shoulder. The tip cap
    // hairs must root on the SAME bent + thickness-ramped cap the dome draws (deL/deR/dnx/dny, wEnd*rampEnd), or they float
    // off a short/bent limb (the dome moved + thinned but the hairs stayed on the old full-width, un-bent edge).
    if (pt.terminal && !suppressTip)  emitCapHairs(deL, deR,  dnx,  dny, capLenT*S, pt.wEnd*rampEnd, red, grow, fade*hairLOD, v1, vx, vy, S);
    if (pt.capLenR > 0) emitCapHairs(pt.sL, pt.sR, -pt.nx, -pt.ny, capLenR*S, pt.wStart, red, grow, fade*hairLOD, v0, vx, vy, S);
  }
}

// buildSegs scratch: reused across creatures/frames to avoid per-frame GC churn (was ~7ms at pop 1000). chain/arc grow as
// needed; the rank/chainLen Maps are cleared+refilled; seg records + their merge sub-objects come from a pool reset per view.
let _bsChain = new Int32Array(64), _bsArc = new Float64Array(64);
const _bsRank = new Map(), _bsChainLen = new Map(), _bsSuppress = new Set();   // per-chain depth + arc-length + tip-cap-suppressed parents (pooled, cleared per call)
let _segPool = [], _segCur = 0;
function segReset(){ _segCur = 0; }   // call once per renderView before its buildSegs loop
function segAlloc(){
  let s = _segPool[_segCur++];
  if (!s) s = _segPool[_segCur-1] = { sb:null, ph:null, p:0, g:0, S:0, fade:0, slab:0, v0:0, v1:0, merge:null, lod:0, baseCap:false, suppressTip:false, endFade:0,
                                      _m:{ a0:0, a1:0, rw:0, rampRw:0, px:0, py:0, da:0 } };
  return s;
}
// buildSegs: append one creature's per-part draw records (depth slab + arc-based Y-merge) to `segs`. Shared by render() and
// the Copy-Swimmer capture, so the dumped geometry is exactly what the renderer draws (no separate path that could diverge).
function buildSegs(id, sb, ph, g, fade, S, segs, lodOverride){
  const base = pseudoDepth(id);
  // PER-INSTANCE cytoplasm/grain: shift this creature's body-space v by a big per-id constant so its Worley/grain samples a
  // different region of the (non-repeating, 2D-jittered) noise field -> every creature's pattern is unique instead of every
  // identical shape sharing one pattern. Same offset for all its parts (welding + intra-creature continuity preserved); it
  // also desyncs the hair beat per creature, which looks better. Content-addressed by id so it's stable frame to frame.
  const vOff = (((id * 2654435761) >>> 0) / 4294967296) * 600;
  // per-chain layering: each chain gets a depth slab; a branch is ordered relative to its parent by which is WIDER where
  // they meet (see below). The smaller one merges UNDER (its ramp hidden by the larger's gel in front); the larger sits
  // OVER with a rounded base cap.
  if (_bsChain.length < ph.numParts){ _bsChain = new Int32Array(ph.numParts*2); _bsArc = new Float64Array(ph.numParts*2); }
  const chain = _bsChain, arc = _bsArc; chain[0] = 0; arc[0] = 0;   // reused scratch; [0] is read via parent=0, must be 0

  let reach = 0;   // longest root->tip PATH length (world) -- a POSE-INDEPENDENT size (from fixed part lengths), so LOD
  for (let p=1;p<ph.numParts;p++){ const par = ph.parts[p].parent; chain[p] = ph.parts[p].branch ? p : chain[par]; arc[p] = arc[par] + ph.parts[par].length; const tip = arc[p] + ph.parts[p].length; if (tip > reach) reach = tip; }
  // LOD from the STABLE path length (not the flexing max-part-distance, which wobbled ~25% and made caps/hairs flicker).
  // T=75 calibrated so this matches the old rs/60 aggressiveness on average. Capture forces full detail via lodOverride.
  const lod = (lodOverride !== undefined) ? lodOverride : Math.max(0, Math.min(1, reach * S / 75));
  const trunkChain = chain[1];
  const chainLen = _bsChainLen; chainLen.clear();   // total arc-length of each chain -> how much room a limb has to fade its thickness in
  for (let p=1;p<ph.numParts;p++){ const c=chain[p]; chainLen.set(c, (chainLen.get(c)||0) + ph.parts[p].length); }
  // DEPTH by SIZE, decided AT THE JUNCTION (Karl): a branch chain sits ONE slab in FRONT of what it attaches to when it's
  // WIDER right where they meet (branch base width vs the parent part's width), else one slab BEHIND. Depth accumulates
  // down the tree (parent depth +/-1) -> a cycle-free total order, and the cap follows the SAME decision (over -> capped).
  const depthOf = _bsRank; depthOf.clear(); depthOf.set(trunkChain, 0);
  const suppressTip = _bsSuppress; suppressTip.clear();   // parent parts whose own tip cap an over-branch's base cap replaces at the junction
  for (let p=1;p<ph.numParts;p++){
    if (chain[p] !== p || p === trunkChain) continue;   // branch BASE parts only (a branch base has chain[p]===p)
    const par = ph.parts[p].parent, over = ph.parts[p].width > ph.parts[par].width;
    depthOf.set(p, (depthOf.get(chain[par]) ?? 0) + (over ? -1 : 1));
    if (over) suppressTip.add(par);   // the over-branch caps its base ON the parent's tip -> drop the parent's now-redundant tip cap
  }
  const trunkSlab = Math.floor(base * (K_SLABS - 1));
  for (let p=1;p<ph.numParts;p++){
    if (ph.parts[p].length <= 0) continue;
    const cid = chain[p];
    const slab = Math.max(0, Math.min(K_SLABS-1, trunkSlab + (depthOf.get(cid) ?? 0)));
    const s = segAlloc();   // pooled record (no per-part object alloc)
    s.sb=sb; s.ph=ph; s.p=p; s.g=g; s.S=S; s.fade=fade; s.slab=slab; s.v0=arc[p]+vOff; s.v1=arc[p]+vOff+ph.parts[p].length; s.lod=lod; s.merge=null; s.baseCap=false; s.suppressTip=suppressTip.has(p);
    // symmetric fade (Karl): a TERMINAL parent tucking under an over-branch's cap thins its tip to 0 (mirrors the branch base ramp) instead of a flat cut. u-fraction ~ width*3/length near the tip.
    s.endFade = (s.suppressTip && !(ph.parts[p].child >= 0)) ? Math.min(0.85, ph.parts[p].width * 3 / (ph.parts[p].length || 1)) : 0;
    if (cid !== trunkChain){
      const par = ph.parts[cid].parent;
      const over = ph.parts[cid].width > ph.parts[par].width;   // LARGER where they meet -> render OVER
      if (over){
        // LARGER -> renders OVER: a solid limb with a rounded END CAP at its base (no under-merge/ramp); the base part is
        // treated root-like (own width + mouth-style dome). Karl: "the end cap should be placed on the larger one."
        if (p === cid) s.baseCap = true;
      } else {
        // SMALLER -> renders UNDER: merge into the parent (thickness ramps in + bend toward tangent), hidden by the parent's
        // gel in front (as before). rampRw kept gentle (bw*4) so no junction rim, but capped at the chain's own length.
        const baseArc = arc[cid], bw = ph.parts[cid].width;
        const tp = ph.parts[ph.parts[cid].parent], tl = Math.hypot(tp.axis.x, tp.axis.y) || 1;
        const tx = tp.axis.x/tl, ty = tp.axis.y/tl;
        const bp = ph.parts[cid], bl = Math.hypot(bp.axis.x, bp.axis.y) || 1;
        const bnx = bp.axis.x/bl, bny = bp.axis.y/bl;
        let phi = Math.atan2(bny, bnx) - Math.atan2(ty, tx); phi = Math.atan2(Math.sin(phi), Math.cos(phi));
        if (phi > Math.PI/2) phi -= Math.PI; else if (phi < -Math.PI/2) phi += Math.PI;
        const da = -phi * Math.cos(phi);                                 // bend toward tangent, ->0 at perpendicular (no snap)
        const pv = parentPos(ph, cid), ps = toScreen(pv.x, pv.y);
        const a0 = arc[p] - baseArc;
        const rampRw = Math.min(bw*4, Math.max(chainLen.get(cid), 1e-3));
        const m = s._m; m.a0=a0; m.a1=a0+ph.parts[p].length; m.rw=bw*4; m.rampRw=rampRw; m.px=ps[0]; m.py=ps[1]; m.da=da; s.merge=m;
      }
    }
    segs.push(s);
  }
}

const labMain = document.getElementById('labMain');

const _rowIO = ('IntersectionObserver' in window && speciesPanel)

  : null;

// launch we RASTERISE each glyph with the ACTUAL loaded font, pixel-scan its true ink bbox, and re-draw it dead-centre
// on a cell-sized bitmap. The bitmap becomes the cell's glyph (a CSS background-image), so it's centred by construction
// -- font-agnostic, no baseline math, no magic constants. Bitmaps are cached in a <style> so per-frame plateHTML stays
// a tiny string (no base64 churn).
const CELL_W = 18, CELL_H = 20, GLYPH_SS = 4;         // CELL_* must match .cell width/height; SS = supersample for crispness
const CELL_FONT_PX = 13, CELL_FONT_STACK = '"OCR A", ui-monospace, "SF Mono", Menlo, monospace';
let SIG_GLYPHS_READY = false;                         // false until the bitmap stylesheet is installed
const SIG_GLYPH_IMG = {};                             // ch -> Image of the centred glyph bitmap (for the video overlay's 2D draw)
function measurePlateGlyphs(){
  const W = CELL_W * GLYPH_SS, H = CELL_H * GLYPH_SS;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const cx = cv.getContext('2d', { willReadFrequently: true });   // we getImageData every glyph -> hint avoids a warning + is faster
  cx.font = `600 ${CELL_FONT_PX * GLYPH_SS}px ${CELL_FONT_STACK}`;
  const gv = Math.round(Math.max(0, Math.min(1, P.plateInk)) * 255);   // plate LETTER brightness (0=black..1=white)
  cx.textAlign = 'left'; cx.textBaseline = 'alphabetic'; cx.fillStyle = `rgb(${gv},${gv},${gv})`;
  let css = '';

    cx.clearRect(0, 0, W, H);

    const d = cx.getImageData(0, 0, W, H).data;                    // pixel-scan the true ink bbox (alpha > 0)
    let minx = W, maxx = -1, miny = H, maxy = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
      if (d[(y*W + x)*4 + 3] > 12){ if (x<minx)minx=x; if (x>maxx)maxx=x; if (y<miny)miny=y; if (y>maxy)maxy=y; } }
    if (maxx >= 0){

      cx.clearRect(0, 0, W, H); cx.fillText(ch, W*0.25 + sx, H*0.7 + sy);
    }

  }

  if (!measurePlateGlyphs._style){ measurePlateGlyphs._style = document.createElement('style'); document.head.appendChild(measurePlateGlyphs._style); }
  measurePlateGlyphs._style.textContent = css;

}

// render the signature as a colour barcode. Colour is a LINEAR (non-wrapping) ramp red(-1) -> green(0=mean) -> blue(+1)
// in OKLCh -- NOT the hue WHEEL (a ring: red would wrap back through magenta). We sweep hue monotonically red(29)->
// green(146)->blue(264) and stop, dropping the magenta arc. Value comes from the symbol's signed step ('0'=mean).
function plateHTML(sig){
  let cells = '';
  for (const ch of sig){
    const idx = SIG_ALPHA.indexOf(ch);
    const signed = idx <= 17 ? idx : idx - 36;                // recover signed step [-17,17] (0 = mean)
    const v = signed / 17;                                    // [-1,1]
    const hue = (29 + (v + 1) * 117.5).toFixed(1);            // red(29) -> green(146) -> blue(264), linear, no magenta

      gl.uniform2f(uSdfRes, W, H); gl.uniform3f(uSdfColor, 1.0, 1.0, 0.97); gl.uniform1f(uSdfBright, P.hair);

      gl.bindVertexArray(null); gl.disable(gl.BLEND);
    }
    // resolve: prev accumulator + this slab (body + hairs) -> next accumulator
    gl.bindFramebuffer(gl.FRAMEBUFFER, next.fbo);
    gl.useProgram(resolveProg);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, slabTex);  gl.uniform1i(uR.uSlab, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, prev.out); gl.uniform1i(uR.uPrevOut, 1);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, prev.fa);  gl.uniform1i(uR.uPrevFA, 2);
    gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, hairTex);  gl.uniform1i(uR.uHairTex, 3);
    gl.uniform2f(uR.uRes, W, H); gl.uniform1f(uR.uField, P.field); gl.uniform1f(uR.uDensity, P.density);
    gl.uniform1f(uR.uOpacity, P.opacity); gl.uniform1f(uR.uRim, P.rim); gl.uniform1f(uR.uSub, P.subsurface);

  gl.bindVertexArray(emptyVAO);
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO);
  gl.useProgram(finalProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, prev.out); gl.uniform1i(uF.uOut, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, prev.fa);  gl.uniform1i(uF.uFA, 1);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  gl.useProgram(postProg);

  // ---- wall marking the world boundary: a FIXED-WORLD-THICKNESS frame drawn ENTIRELY OUTSIDE the play area (never
  //      covers it), so it scales with zoom -- ~5px when the whole pool fits (zoom 1) and thicker as you zoom in. ----
  //      SKIPPED for tiles: at tile zoom the wall is huge (thick*zoom) and its darkening quads blacken a tile whose
  //      specimen sits near a pool edge. Tiles are interior close-ups; the boundary isn't meaningful there.
  if (drawWall) {
    const T = P.wallThick * cam.zoom;   // wall thickness (screen px): P.wallThick at zoom 1, scales with zoom
    const a = toScreen(0,0), c = toScreen(P.pool, P.pool);
    const x0=Math.min(a[0],c[0]), x1=Math.max(a[0],c[0]), y0=Math.min(a[1],c[1]), y1=Math.max(a[1],c[1]);
    const R=(rx0,ry0,rx1,ry1)=>[rx0,ry0, rx1,ry0, rx1,ry1,  rx0,ry0, rx1,ry1, rx0,ry1];

    //    tile the outside region without overlap, so the alpha darkening is even (no double-darkened seams).
    if (P.wallDark > 0){
      const ox0=x0-T, oy0=y0-T, ox1=x1+T, oy1=y1+T;
      const dv = new Float32Array([
        ...R(0, 0,   W,   oy0),   // above the wall
        ...R(0, oy1, W,   H),     // below
        ...R(0, oy0, ox0, oy1),   // left
        ...R(ox1, oy0, W, oy1),   // right

    const bv = new Float32Array([

      ...R(x0-T, y1,   x1+T, y1+T), // bottom
      ...R(x0-T, y0,   x0,   y1),   // left

    gl.bufferData(gl.ARRAY_BUFFER, bv, gl.DYNAMIC_DRAW);

    gl.bindVertexArray(null); gl.disable(gl.BLEND);
  }
  } finally { cam = _cam; W = _W; H = _H; }   // restore the active view to the canvas view
}

function render(){

  frameCount++;

    const vis = [...miniShowing].filter(id => { const el = rowMap.get(id); return el && el._onScreen; });   // skip minis scrolled out of the species column
    const n = Math.min(vis.length, MINI_BUDGET);

      const id = vis[(miniCursor + k) % vis.length];
      const r = speciesModel.speciesById.get(id); if (!r || !r.t) continue;        // miss -> keep last frame
      const showBot = (id === selSpecies) ? selectedSb : r.t.rep;                   // show the SELECTED individual, else the species rep
      if (!showBot || !showBot.getAlive()) continue;

let _fpsPrev = 0, _fpsEMA = 0, _fpsLogT = 0;
function tickFPS(){
  const now = performance.now();
  if (_fpsPrev){ const f = 1000 / Math.max(0.001, now - _fpsPrev); _fpsEMA = _fpsEMA ? _fpsEMA * 0.9 + f * 0.1 : f; }
  _fpsPrev = now;
  const pop = world ? world.getLivingSwimbotCount() : 0;
  if (fpsHud) fpsHud.textContent = `${_fpsEMA.toFixed(0)} fps · ${hairsEmitted} hairs · ${pop} pop`;
  if (window.pool && now - _fpsLogT > 2000){ _fpsLogT = now; console.info(`[fps] ${_fpsEMA.toFixed(1)} fps  hairs=${hairsEmitted}  pop=${pop}`); }
}

function loop(){
  if (loopStopped) return;
  if (running && world){ for (let i=0;i<ticksPerFrame;i++) world.tick(); }
  if (recording && recBuf.length && window.pool){ window.pool.record(recBuf); recBuf = []; }   // flush this frame's events to the recorder
  updateCamera(1/60);   // animate zoom-to / follow the selected swimmer (no-op when nothing selected); before render
  render();

// ================================================================== controls
const _playBtn = document.getElementById('play');

// -- selection + camera helpers --
const easeInOut = p => p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;   // easeInOutQuad: soft both ends (not a snap)
function wrapNear(v, ref, span){ let d = ((v - ref) % span + span*1.5) % span - span/2; return ref + d; }   // nearest torus copy of v to ref
function cursorToBacking(e){ const r = cv.getBoundingClientRect(); return [ (e.clientX-r.left)/r.width*W, (e.clientY-r.top)/r.height*H ]; }
function screenToWorld(px, py){ const s = sc(); return [ cam.x + (px-W/2)/s, cam.y + (py-H/2)/s ]; }

  if (ph && ph.parts) for (let q=1;q<ph.numParts;q++){ const dx=ph.parts[q].position.x-c.x, dy=ph.parts[q].position.y-c.y, d=dx*dx+dy*dy; if (d>wr) wr=d; }
  return Math.sqrt(wr); }

  return Math.max(0.5, Math.min(60, (Math.min(W,H)*0.28 / worldR) / fitZoom())); }
// pick the living swimbot whose body-disc contains the world point; nearest centre wins (once per click, not per frame)
function pickSwimbot(wx, wy){
  let best = null, bestD = Infinity;
  for (const [, sb] of known){
    if (!sb.getAlive()) continue; const ph = sb._phenotype; if (!ph || ph.numParts <= 1) continue;
    const c = sb.getPosition(), dx = wrapNear(wx, c.x, P.pool)-c.x, dy = wrapNear(wy, c.y, P.pool)-c.y, d = dx*dx+dy*dy;
    const rr = (botRadius(sb)+18); if (d <= rr*rr && d < bestD){ bestD = d; best = sb; }

}
const selRing = document.getElementById('selRing');

// Shared by the DOM overlay AND the video composite so the recording matches the live view exactly. Callers must run it
// with the main-view cam/W/H (after render()).
function selRingGeom(){
  if (!selectedSb || !selectedSb.getAlive() || selRingR <= 0) return null;
  const c = selectedSb.getPosition();
  const [sx, sy] = toScreen(wrapNear(c.x, cam.x, P.pool), wrapNear(c.y, cam.y, P.pool));   // nearest torus copy -> no seam jump

const _mod = v => ((v % P.pool) + P.pool) % P.pool;

  // (1) advance the TARGET from the active selection animation (drag/wheel set camT directly in their handlers).

    if (!selectedSb || !selectedSb.getAlive()){ camAnim.phase = 'idle'; camAnim.tracking = false; }   // safety (death also handled at the fold)

  const A = 1 - Math.exp(-dt / Math.max(1e-3, P.camSmooth));

cv.addEventListener('wheel', (e)=>{

    camT.zoom = Math.max(0.5, Math.min(60, camT.zoom*f));

  // (cam eases to it), so the pin is exact on the TARGET and converges on screen with the smoother's "give".
  const [px, py] = cursorToBacking(e); const s0 = fitZoom()*camT.zoom;
  const wx = camT.x + (px-W/2)/s0, wy = camT.y + (py-H/2)/s0;   // world point under the cursor, before zoom
  camT.zoom = Math.max(0.5, Math.min(60, camT.zoom*f));

// ---- deterministic golden-capture hook (INERT unless called; see docs/PLAN-visual-goldens.md) ----
// Stops the rAF loop, rebuilds at a fixed seed, advances/renders a fixed amount, returns raw default-framebuffer RGBA.
// The render is a pure function of (seed, ticks, frames, opts); no wall-clock/random/DPR anywhere.
//   camOv  = {x?,y?,zoom?,focus?}  pick a view (focus:'biggest' centres on the largest grown living specimen).
//   opts.interleave = N > 0  => advance N ticks BETWEEN renders (tick N, render, repeat) so the death-fade path
//     (deathTick/fades, updated inside render()) actually populates — a plain ticks-then-render never exercises it.
// Returns {w,h,b64, thickFmt:'RGBA16F'|'RGBA8', floatRT, fading} (fading = count of mid-fade dead ghosts in-frame).
window.__golden = function(s, ticks, frames, camOv, opts){
  opts = opts || {};
  loopStopped = true; running = false;
  Object.assign(P, DEFAULTS);   // capture at the BAKED look, never a dev's saved K-panel params (goldens must be deterministic)
  if (typeof applyPlateStyles === 'function') applyPlateStyles();   // reset --plate-l + re-raster glyphs to defaults too
  seed = (s>>>0); cam.zoom = 6; build();
  gl.disable(gl.DITHER);
  const applyCam = () => {
    if (!camOv) return;
    cam = { x: camOv.x ?? P.pool/2, y: camOv.y ?? P.pool/2, zoom: camOv.zoom ?? 6 };
    if (camOv.focus === 'biggest' && world){      // centre on the largest grown living specimen (most grain to judge)
      let best=null, bestR=-1;
      for (const [id, sb] of world._swimbots){
        if (!sb.getAlive()) continue;
        const ph = sb._phenotype; if (!ph || ph.numParts <= 1) continue;
        if ((sb._growthScale ?? 1) < 0.9) continue;
        const c = sb.getPosition(); let wr=0;
        for (let q=1;q<ph.numParts;q++){ const dx=ph.parts[q].position.x-c.x, dy=ph.parts[q].position.y-c.y, d=dx*dx+dy*dy; if (d>wr) wr=d; }
        if (wr > bestR){ bestR=wr; best=c; }
      }
      if (best){ cam.x = best.x; cam.y = best.y; }
    }
    camT = { x: cam.x, y: cam.y, zoom: cam.zoom };   // keep the smoothing target in sync (defensive: this hook stops the loop, but so does no drift if it ever resumes)
  };
  const T = ticks|0, every = opts.interleave|0;
  if (every > 0){                                 // interleaved tick->render (exercises death-fade)
    applyCam();                                   // static cam across the interleave
    let done = 0;
    while (done < T){ const step = Math.min(every, T - done); for (let i=0;i<step;i++) world.tick(); done += step; render(); }
    if (T === 0) render();
  } else {
    for (let i=0; i<T; i++) world.tick();
    applyCam();                                   // apply AFTER ticks so focus sees settled positions
    for (let f=0; f<Math.max(1, frames|0); f++) render();
  }
  let fading = 0; for (const v of fades.values()) if (v > 0 && v < 1) fading++;
  const w = cv.width, h = cv.height, px = new Uint8Array(w*h*4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let str=''; for (let i=0;i<px.length;i+=8192) str += String.fromCharCode.apply(null, px.subarray(i, i+8192));
  const floatRT = !!(thickFmt && thickFmt.internal === gl.RGBA16F);
  const species = speciesModel.speciesList.slice(0,4).map(r => ({ n: r.count, sig: r.t ? r.t.sig : null,
    alive: !!(r.t && r.t.rep && r.t.rep.getAlive()) }));
  // opts.mini: also capture the largest species' 256^2 mini-viewer (the small-view render path the list expands into),
  // via the SAME (0,0,256,256) scratch corner the live blit uses. Done AFTER the main readPixels (it overwrites the corner).
  let mini = null; const bigR = speciesModel.speciesList.find(r => r.t && r.t.rep && r.t.rep.getAlive());
  if (opts.mini && bigR){
    const c = bigR.t.rep.getPosition();
    renderView({ x: c.x, y: c.y, zoom: TILE_ZOOM }, VIEW_SMALL, VIEW_SMALL, smallSet, 0, 0, false, 0, bigR.t.rep);
    const mp = new Uint8Array(VIEW_SMALL*VIEW_SMALL*4);
    gl.readPixels(0, 0, VIEW_SMALL, VIEW_SMALL, gl.RGBA, gl.UNSIGNED_BYTE, mp);
    let ms=''; for (let i=0;i<mp.length;i+=8192) ms += String.fromCharCode.apply(null, mp.subarray(i, i+8192));
    mini = btoa(ms);
  }
  return { w, h, b64: btoa(str), thickFmt: floatRT ? 'RGBA16F' : 'RGBA8', floatRT, fading, species,
           mini, miniW: VIEW_SMALL, miniH: VIEW_SMALL };
};

// ---- perf benchmark hook (INERT unless called; performance.now is MEASUREMENT only -> never touches render output) ----
// Builds a fixed scene, then renders it `frames` times (no ticks between -> constant frame) and returns per-frame ms.
// junkFrac optionally overrides P.junk for an A/B of the detritus load. gl.finish() after each render so SwiftShader's
// (CPU) work is actually complete before we stop the clock.
window.__bench = function(s, ticks, camOv, frames, junkFrac){
  loopStopped = true; running = false;
  seed = (s>>>0); cam.zoom = 6; build();
  gl.disable(gl.DITHER);
  for (let i=0; i<(ticks|0); i++) world.tick();
  if (camOv){ cam = { x: camOv.x ?? P.pool/2, y: camOv.y ?? P.pool/2, zoom: camOv.zoom ?? 6 }; camT = { x: cam.x, y: cam.y, zoom: cam.zoom }; }   // sync the smoothing target
  const _junk = P.junk; if (junkFrac !== undefined && junkFrac !== null) P.junk = junkFrac;
  const N = Math.max(1, frames|0);
  render(); gl.finish();                                        // warm-up: shader compile / buffer upload / first recluster
  const t = new Array(N), tc = new Array(N);                    // total (incl. gl.finish) + CPU-only (before gl.finish)
  for (let f=0; f<N; f++){ const t0 = performance.now(); render(); const t1 = performance.now(); gl.finish(); t[f] = performance.now() - t0; tc[f] = t1 - t0; }
  const nJunk = Math.floor(P.junk * MAX_JUNK), nHairs = hairsEmitted;   // detritus + strands drawn during the timed renders
  P.junk = _junk;
  const med = (a) => { const s = a.slice().sort((x,y)=>x-y); return s[s.length>>1]; };
  t.sort((a,b)=>a-b);
  const sum = t.reduce((a,b)=>a+b,0);
  const cpuMed = med(tc);
  // tCPU = JS emit/submit (on SwiftShader ~ the CPU-side cost we optimize); tGPU = the gl.finish() delta (SwiftShader
  // software raster -> a PESSIMISTIC proxy, not real-GPU). See perf.mjs / the hair plan P3.
  return { frames:N, median:t[N>>1], mean:sum/N, min:t[0], p90:t[Math.min(N-1, Math.floor(N*0.9))],
           cpuMedian: cpuMed, gpuMedian: t[N>>1] - cpuMed, nHairs,
           living: world.getLivingSwimbotCount(), nJunk, zoom: cam.zoom };
};

// Zoom-sweep bench: __bench (median ms/frame) at several zooms, logs a [bench] table -> main forwards it -> I read the
// numbers myself (real-GPU in the desktop app; SwiftShader headless is a relative yardstick only). Trigger: ?zoombench
// on the URL (desktop main.mjs adds it when GP_BENCH=1). Samples the whole-pool zoom band where hair count -> 100k+.
function benchZooms(){

  const zooms = [1, 1.5, 2, 2.5, 3, 4, 6];   // whole-pool sweep = Karl's slow band

// ================================================================== scrub / playback (desktop only)
// The browser keeps the live loop above. In the Electron app a utilityProcess GENERATES the seed's run (real Node,
// same V8 -> D1) and main serves it read-only over IPC (window.pool.scrub). A tick is DECODED by restoring the nearest
// keyframe (drag = snap, no re-sim) and, while playing, ticking that restored world forward -- deterministic, so it
// stays in lockstep with the generator. Time is shown mm:ss (never ticks).
const TICKS_PER_SECOND = 60;   // 1x speed = real-time
// adaptive sim-time: mm:ss under an hour, h:mm:ss under a day, "Nd hh:mm:ss" beyond (unbounded runs reach days).
const _p2 = n => String(n).padStart(2, '0');
const timeUnits = t => { const s = Math.max(0, Math.floor((t || 0) / TICKS_PER_SECOND)); return s >= 86400 ? 3 : s >= 3600 ? 2 : 1; };
function fmtTime(t, units = timeUnits(t)) {
  let s = Math.max(0, Math.floor((t || 0) / TICKS_PER_SECOND));
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  if (units >= 3) return `${d}d ${_p2(h)}:${_p2(m)}:${_p2(s)}`;
  if (units >= 2) return `${h}:${_p2(m)}:${_p2(s)}`;
  return `${_p2(m)}:${_p2(s)}`;
}
// current playhead + timeline length, mirrored out of startPlayback's closure so the timeline graph can draw a "now"
// marker without re-reaching into it (0 in the browser, where there is no run to scrub).
let scrubHead = 0, scrubFrontier = 0;

// ================================================================== timeline history graph (G)
// A glass panel over the main view plotting population + food across the WHOLE run. Data is the downsampled
// ticks series the run reader already exposes (window.pool.scrub.popSeries -> [{tick,pop,food}]); we redraw on a
// light interval while open so a live-generating run fills in, and on resize (cached data, no refetch).
const graphEl = document.getElementById('graph');
const graphCanvas = document.getElementById('graphCanvas');
const graphEmpty = document.getElementById('graphEmpty');
const gctx = graphCanvas ? graphCanvas.getContext('2d') : null;
let graphData = [];            // last fetched [{tick,pop,food}]
let graphTimer = 0;            // refresh interval id while open
let _gDrawnHead = -1, _gDrawnFront = -1;   // dirty-check: skip the per-frame redraw when the playhead hasn't moved
const G_COL_POP = '#d9a441', G_COL_FOOD = '#7fd0a0', G_COL_DIV = '#6cb8e6', G_COL_LIFE = '#cf8fd4';   // food = green (Karl), population = amber
let graphMetric = 'pop';   // which metric owns the (single) left axis; click a legend entry to switch

function toggleGraph(){
  if (!graphEl) return;
  graphEl.hidden = !graphEl.hidden;
  if (!graphEl.hidden){ refreshGraph(); graphTimer = graphTimer || setInterval(refreshGraph, 1500); }
  else if (graphTimer){ clearInterval(graphTimer); graphTimer = 0; }
}
async function refreshGraph(){
  if (!graphEl || graphEl.hidden) return;
  try { graphData = (window.pool && window.pool.scrub) ? (await window.pool.scrub.popSeries({ maxPoints: 1400 })) || [] : []; }
  catch { graphData = []; }

}
function sizeGraphCanvas(){
  if (!graphCanvas) return false;
  const r = graphCanvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (graphCanvas.width !== w || graphCanvas.height !== h){ graphCanvas.width = w; graphCanvas.height = h; }
  return true;
}
const gNice = v => { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; const s = m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10; return s * p; };
function drawGraph(){
  if (!gctx || !graphEl || graphEl.hidden) return;
  const has = graphData && graphData.length > 1;
  if (graphEmpty) graphEmpty.hidden = has;
  if (!sizeGraphCanvas()) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = graphCanvas.width / dpr, H = graphCanvas.height / dpr;
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, W, H);
  if (!has) return;

  const L = 48, R = 14, T = 16, B = 24;                       // margins (px): one axis on the LEFT (selected metric), time (B)
  const x0 = L, x1 = W - R, y0 = T, y1 = H - B, pw = Math.max(1, x1 - x0), ph = Math.max(1, y1 - y0);
  const xMax = Math.max(1, scrubFrontier, graphData[graphData.length - 1].tick);
  const popMax = gNice(graphData.reduce((m, r) => Math.max(m, r.pop || 0), 0));
  const foodMax = gNice(graphData.reduce((m, r) => Math.max(m, r.food || 0), 0));
  const X = t => x0 + (t / xMax) * pw;
  const Ypop = v => y1 - (v / popMax) * ph;
  const Yfood = v => y1 - (v / foodMax) * ph;

  // horizontal grid (4 bands), faintly tinted to the SELECTED metric (matches the axis numbers)
  const G_COL_BY = { pop: G_COL_POP, food: G_COL_FOOD, div: G_COL_DIV, life: G_COL_LIFE };
  const selCol = G_COL_BY[graphMetric] || G_COL_POP;

  for (let i = 0; i <= 4; i++){ const y = Math.round(y0 + (ph * i / 4)) + 0.5; gctx.beginPath(); gctx.moveTo(x0, y); gctx.lineTo(x1, y); gctx.stroke(); }
  gctx.restore();

  const series = (val, Y, col, fillTop) => {
    gctx.beginPath();
    gctx.moveTo(X(graphData[0].tick), Y(val(graphData[0])));
    for (let i = 1; i < graphData.length; i++) gctx.lineTo(X(graphData[i].tick), Y(val(graphData[i])));
    // area fill
    gctx.save();
    gctx.lineTo(X(graphData[graphData.length - 1].tick), y1);
    gctx.lineTo(X(graphData[0].tick), y1);

    for (let i = 1; i < graphData.length; i++) gctx.lineTo(X(graphData[i].tick), Y(val(graphData[i])));
    gctx.lineWidth = 1.5; gctx.lineJoin = 'round'; gctx.strokeStyle = col; gctx.stroke();
  };
  series(r => r.food || 0, Yfood, G_COL_FOOD, 'rgba(127,208,160,0.26)');   // food = green, behind
  series(r => r.pop || 0, Ypop, G_COL_POP, 'rgba(217,164,65,0.22)');       // population = amber, in front

  // diversity + life expectancy: plain lines (no fill, so 4 areas don't muddy). val() returns null to break the line
  // (older runs with no stats; life is null until the first death). Diversity uses the same divPct 0..100 as the overlay
  // bar; life auto-scales to its own peak (a small fraction of MAX_LIFESPAN -- auto-scale shows the shape).
  const line = (val, Y, col) => {
    gctx.lineWidth = 1.5; gctx.lineJoin = 'round'; gctx.strokeStyle = col; gctx.beginPath();
    let pen = false;

      const x = X(graphData[i].tick), y = Y(v); if (!pen){ gctx.moveTo(x, y); pen = true; } else gctx.lineTo(x, y); }
    gctx.stroke();
  };
  const lifeMax = gNice(graphData.reduce((m, r) => (r.life != null ? Math.max(m, r.life) : m), 0)) || 1;
  const Ydiv = v => y1 - (v / 100) * ph;              // diversity: fixed 0..100 (divPct)
  const Ylife = v => y1 - (v / lifeMax) * ph;         // life: auto-scaled to its peak
  line(r => (r.div == null ? null : divPct(r.div)), Ydiv, G_COL_DIV);
  line(r => (r.life == null ? null : r.life), Ylife, G_COL_LIFE);

  // playhead ("now" / scrub position)
  if (scrubHead > 0 && scrubHead <= xMax){
    const px = Math.round(X(scrubHead)) + 0.5;
    gctx.strokeStyle = 'rgba(207,214,224,0.55)'; gctx.lineWidth = 1;
    gctx.beginPath(); gctx.moveTo(px, y0); gctx.lineTo(px, y1); gctx.stroke();
  }

  // ONE left axis, for the SELECTED metric (click a legend entry to switch). Reading at every gridline (0..max), coloured
  // to the metric so it's clear which line it labels. Diversity is a %, lifespan a duration (mm:ss), pop/food counts.
  const axisFor = {
    pop:  { max: popMax,  col: G_COL_POP,  fmt: v => String(Math.round(v)) },
    food: { max: foodMax, col: G_COL_FOOD, fmt: v => String(Math.round(v)) },
    div:  { max: 100,     col: G_COL_DIV,  fmt: v => Math.round(v) + '%' },
    life: { max: lifeMax, col: G_COL_LIFE, fmt: v => fmtTime(v) },
  };
  const ax = axisFor[graphMetric] || axisFor.pop;
  gctx.font = '500 11px "Quicksand", "Segoe UI", system-ui, sans-serif';   // chrome font (matches the panel); viewers keep OCR A
  gctx.textBaseline = 'middle'; gctx.textAlign = 'right'; gctx.fillStyle = ax.col;
  for (let i = 0; i <= 4; i++){ const y = y0 + ph * i / 4; gctx.fillText(ax.fmt(ax.max * (4 - i) / 4), x0 - 6, y); }
  // time axis (x): start / mid / end
  gctx.fillStyle = '#5c6b80'; gctx.textBaseline = 'alphabetic';
  const u = timeUnits(xMax);
  gctx.textAlign = 'left';   gctx.fillText(fmtTime(0, u), x0, y1 + 15);
  gctx.textAlign = 'center'; gctx.fillText(fmtTime(xMax / 2, u), (x0 + x1) / 2, y1 + 15);
  gctx.textAlign = 'right';  gctx.fillText(fmtTime(xMax, u), x1, y1 + 15);
}

  // drag-snap: restore the nearest keyframe <= t (no re-sim). Coalesce to the latest target while one is in flight.
  async function snapTo(t){
    if (!cfg) return;
    t = Math.max(0, Math.min(t, frontier));
    if (snapInFlight){ snapPending = t; return; }
    snapInFlight = true;
    const kf = await window.pool.scrub.keyframe(t);
    snapInFlight = false;
    if (kf){ world = World.restore(cfg, kf.snapshot); head = kf.tick; resetOverlays(head); render(); updateBar(); }
    if (snapPending != null){ const p = snapPending; snapPending = null; snapTo(p); }
  }
  async function selectSeed(sd){
    const wasPlaying = playing;   // resume playback after the switch if it was already running (Karl)
    playing = false;              // hold ticks while we swap worlds (don't tick the stale world during the async load)
    curSeed = sd >>> 0;   // set BEFORE the await so a killed run's in-flight frontier (tagged with the old seed) is dropped
    const r = await window.pool.scrub.select(sd >>> 0);
    if (!r || !r.ok){ document.getElementById('err').textContent = 'run failed: ' + ((r && r.error) || '?'); return; }
    document.getElementById('err').textContent = '';
    cfg = r.runConfig.config; frontier = r.frontier; head = 0;
    updateBar();   // reset the slider RANGE to the new run's length now (don't wait on snapTo's keyframe, which may be momentarily null)
    seedJunk(mulberry32((sd >>> 0) ^ 0x5eed1234));   // detritus pool (cosmetic; build() normally does this)
    await snapTo(0);
    playing = wasPlaying;         // new pool plays on from tick 0 if we were running before the switch
    updateBar();
  }

  // frontier grows monotonically WITHIN a run; a seed switch resets it (in selectSeed). Drop updates tagged with any
  // other seed so a just-killed generator's late progress can't Math.max the range back up to the old run's length.
  window.pool.scrub.onFrontier(msg => { if (!msg || (msg.seed >>> 0) !== curSeed) return; frontier = Math.max(frontier, msg.tick); if (!dragging) updateBar(); });
  // 4 fast-forward buttons: each plays at 2^N x real-time (1x, 2x, 4x, 8x); clicking the ACTIVE speed pauses.
  for (const b of speedBtns) b.onclick = () => {
    const tpf = 1 << (+b.dataset.n);
    if (playing && ticksPerFrame === tpf) playing = false;          // click the playing speed -> pause
    else { ticksPerFrame = tpf; playing = true; }
    updateBar();
  };
  togglePlay = () => { playing = !playing; updateBar(); };   // space = play/pause at the current speed (desktop)
  // seed +/- : step to the previous/next seed (and load/generate its run)
  $seed.onchange = () => { const v = parseInt($seed.value, 10); if (Number.isFinite(v) && v >= 0) selectSeed(v); };   // native number-input arrows fire this
  // scrubbing does NOT pause: keep `playing` as-is while dragging (loop holds via !dragging), so releasing resumes -> "takes off" (Karl)
  $slider.oninput = () => { dragging = true; head = +$slider.value; const u = timeUnits(frontier); $time.textContent = `${fmtTime(head, u)} / ${fmtTime(frontier, u)}`; snapTo(head); };
  $slider.onchange = () => { dragging = false; snapTo(+$slider.value); };

  // SEED/FILE toggle (Karl): the "SEED" label is a button. Click -> "FILE" and the seed input becomes LOAD + SAVE;
  // click again -> back to "SEED". LOAD/SAVE prompt for a state file (World serialize/restore, via the desktop dialog).
  const $modeToggle = document.getElementById('sbModeToggle'), $fileBtns = document.getElementById('sbFileBtns');
  let sourceFile = false;
  function setSourceMode(file){ sourceFile = file; $modeToggle.textContent = file ? 'FILE' : 'SEED'; $seed.hidden = file; $fileBtns.hidden = !file; }
  $modeToggle.onclick = () => setSourceMode(!sourceFile);
  setSourceMode(false);
  document.getElementById('sbSave').onclick = async () => {
    if (!world || !window.pool?.save) return;
    await window.pool.save({ v: 1, seed: curSeed >>> 0, config: cfg || curConfig, data: world.serialize() });
  };
  document.getElementById('sbLoad').onclick = async () => {
    if (!window.pool?.load) return;
    const r = await window.pool.load();
    if (r && r.ok){ playing = false; loadWorld(r.data); render(); updateBar(); }   // pause playback so the loaded world stays put
  };

  function playbackLoop(){
    if (loopStopped) return;
    if (playing && world && !dragging && head < frontier){
      const step = Math.min(ticksPerFrame, frontier - head);
      for (let i = 0; i < step; i++) world.tick();
      head += step;
    }
    updateCamera(1/60);   // animate zoom-to / follow the selected swimmer (runs even when paused; no-op when nothing selected)
    render(); updateSelRing(); updateBar(); tickFPS();
    requestAnimationFrame(playbackLoop);
  }
  ticksPerFrame = 1;   // default 1x; playback starts paused until a speed button is pressed
  seedJunk(mulberry32((+$seed.value >>> 0) ^ 0x5eed1234));   // seed detritus BEFORE any render (loop + resizeMain both render)
  resizeMain();                                              // size the main view to FILL the window (safe: junk seeded, world may be null)
  window.addEventListener('resize', resizeMain);            // keep filling when the window is resized
  selectSeed(+$seed.value);
  requestAnimationFrame(playbackLoop);
}

function boot(){
  if (!gl) return;
  initGL();
  let bench = false; try { bench = new URLSearchParams(location.search).has('zoombench'); } catch {}
  if (bench){ /* ?zoombench: benchZooms runs via its own setTimeout; do NOT start playback (it would collide + freeze) */ }
  else if (window.pool && window.pool.scrub){ startPlayback(); }     // desktop: generate-then-scrub player
  else { build(); requestAnimationFrame(loop); }                     // browser: live loop (unchanged)
}
boot();
</script>
</body>
</html>
